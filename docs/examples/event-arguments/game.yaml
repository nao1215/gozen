schema_version: 10
id: argument-workshop
start: {location: workshop}
planning:
  calendar: {start: '2030-01-01', end: '2030-01-02', phases: [day]}
  attributes: {vigor: {type: number, initial: 0}}
  entities: {potter: {name: Potter}, weaver: {name: Weaver}}
  activities:
    prepare: {name: Prepare, effort: 2, assignee: potter}
    shape: {name: Shape, effort: 2, assignee: potter}
screens:
  stock:
    params: {amount: number}
    title: 'Stock {arg.amount}'
    entries:
    - label: 'Collect {arg.amount}'
      when: 'arg.amount > 0'
      do:
      - choice:
        - label: Confirm
          do:
          - set: {var.total: 'var.total + arg.amount'}
        - label: Cancel
      - open: {screen: receipt, args: {amount: 'arg.amount + 10'}}
      - say: 'Stock {arg.amount}'
  receipt:
    params: {amount: number}
    title: 'Receipt {arg.amount}'
    entries:
    - label: Read
      do:
      - call: {event: stock_report, args: {amount: 'arg.amount'}}
  candidates:
    params: {task: activity, resident: entity}
    title: 'Assign {arg.task}'
    entries:
    - label: 'Choose {arg.resident}'
      do:
      - choice:
        - label: Confirm
          do:
          - plan: {op: assign, activity: {expr: arg.task}, entity: {expr: arg.resident}}
        - label: Cancel
      - say: 'Reviewed {arg.task}'

  calendar:
    title: Calendar
    kind: calendar
    view:
      fullscreen: true
      markers:
      - date: '2030-01-01'
        screen: day_detail
        args: {day: '"2030-01-01"'}
      - date: '2030-01-02'
        screen: day_detail
        args: {day: '"2030-01-02"'}
  day_detail:
    params: {day: date}
    title: 'Schedule {arg.day}'
    entries:
    - label: 'Inspect {arg.day}'
      do:
      - say: 'Selected {arg.day}'
