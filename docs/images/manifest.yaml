# The source of every picture that README.md, the website and docs/ show.
#
# Each image is made from a sample game: the sample is built, run with its
# script under a display (Xvfb on Linux), and the frames it writes with `shot`
# (or --frames) are encoded here. `make docs-images` remakes every image;
# `make docs-images-check` remakes them in a temporary directory and fails when
# a committed image is stale. A picture that is not listed here cannot be put
# in docs/images or referred to from README.md or the website
# (internal/dev/docs). The rules are in docs/development/docs.md.
#
# A picture that is not a capture (the logo) is listed under `static` with its
# source and license instead; it is not remade.
#
# To show another sample, change `samples` (and the runs that use it): the
# images, their references and the checks stay the same.

samples:
  go-zen:
    package: ./examples/go-zen
  puppet:
    package: ./examples/puppet
  novel:
    package: ./examples/novel
  campaign:
    package: ./examples/campaign

# One run of a sample. {script} is the script file and {out} a new, empty
# directory for the run: the shots, saves and trace go under it. `check` is
# run afterwards with the run directory as its last argument and fails the
# run when the play did not go as planned.
runs:
  opening:
    sample: go-zen
    script: scripts/capture-go-zen.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
  map:
    sample: go-zen
    script: scripts/capture-go-zen-map.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, town, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  plaza:
    sample: go-zen
    script: scripts/capture-go-zen-plaza.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, plaza, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  face:
    sample: go-zen
    script: scripts/capture-go-zen-face.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, opening, --line, "12", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  tree:
    sample: go-zen
    script: scripts/capture-go-zen-tree.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, inn, --party, "maren,ox,tilly,kes", --level, "6", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  lineage:
    sample: go-zen
    script: scripts/capture-go-zen-lineage.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, altar, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  breeding:
    sample: go-zen
    script: scripts/capture-go-zen-breeding.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, altar, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  recruit:
    sample: go-zen
    # The script starts this battle through the event runner and stops at the recruit choice.
    script: scripts/capture-go-zen-recruit.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b1, --party, "maren,ox,tilly,kes", --level, "6", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    check: [python3, scripts/check-go-zen-recruit.py]
  shop:
    sample: go-zen
    script: scripts/capture-go-zen-shop.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, shop, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  dungeon:
    sample: go-zen
    script: scripts/capture-go-zen-dungeon.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b2, --party, "maren,ox,tilly,kes", --calm, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  battle:
    sample: go-zen
    script: scripts/capture-go-zen-battle.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b2, --party, "maren,ox,tilly,kes", --level, "6", --battle, warden, --until, "950", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
  battle-transform:
    sample: go-zen
    script: scripts/capture-go-zen-transform.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b2, --party, "maren,ox,tilly,kes", --level, "14", --battle, tollkeeper, --until, "1600", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    check: [python3, scripts/check-go-zen-battle-feature.py, transform]
  battle-merge:
    sample: go-zen
    script: scripts/capture-go-zen-merge.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b1, --party, "maren,ox", --level, "1", --battle, drips, --until, "900", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    check: [python3, scripts/check-go-zen-battle-feature.py, merge]
  battle-hp-pictures:
    sample: go-zen
    script: scripts/capture-go-zen-hp-pictures.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b1, --party, "maren,ox", --level, "1", --battle, drip_and_rat, --until, "900", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    check: [python3, scripts/check-go-zen-battle-feature.py, hp]
  battle-motion:
    sample: go-zen
    script: scripts/capture-go-zen-motion.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b2, --party, "maren,ox,tilly,kes", --level, "6", --battle, succubus_group, --until, "1100", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    check: [python3, scripts/check-go-zen-battle-feature.py, motion]
  balance:
    sample: go-zen
    script: scripts/capture-go-zen-balance.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --start, b2, --party, "maren,ox,tilly", --level, "1", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  novel:
    sample: novel
    script: scripts/capture-novel.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
  novel-language:
    sample: novel
    script: scripts/capture-novel-language.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  novel-stage:
    sample: novel
    script: scripts/capture-novel-stage.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, opening, --line, "9", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  novel-panel:
    sample: novel
    script: scripts/capture-novel-panel.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  novel-ending:
    sample: novel
    script: scripts/capture-novel-ending.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, with_brenna, --line, "7", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  # The hot reload (F5): the game runs from a copy of its files ({game}, --dir), and
  # `edit` changes a line in the copy once the shot `after` is written.
  playtest-reload:
    sample: novel
    script: scripts/capture-playtest-reload.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --dir, "{game}", --event, toast, --line, "3", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
    edit:
      copy: examples/novel/game
      after: rl011
      file: data/story.yaml
      old: "Somebody gets the first toast. Make it a good one."
      new: "First toast is yours. Keep it short, the cider is getting cold."
  playtest-memo:
    sample: novel
    script: scripts/capture-playtest-memo.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --line, "3", --memos, "{out}/memos", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  playtest-panel:
    sample: novel
    script: scripts/capture-playtest-panel.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --line, "3", --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  novel-characters:
    sample: novel
    script: scripts/capture-novel-characters.txt
    args: [--dev, --mute, --seed, "7", --window, "1", --event, toast, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves"]
  campaign:
    sample: campaign
    script: scripts/capture-campaign.txt
    args: [--dev, --mute, --seed, "3", --window, "1", --start, war, --script, "{script}", --shots, "{out}", --save-dir, "{out}/saves", --trace, "{out}/trace.jsonl"]
  puppet-tour:
    sample: puppet
    args: [--tour, --frames, "{out}/frames"]

# Each image: the run, the shot (a `shot NAME` of the script, or a pick from
# the frames) and how it is encoded.
#   shot: NAME                the frame NAME.png
#   pick: {shots: GLOB, ...}  frames whose names match GLOB, in the order the
#                             game wrote them; `before: EVENT` takes the last
#                             frame before the first trace line with EVENT,
#                             `at: N` the frame closest to N ticks after it,
#                             `middle: true` the middle frame
#   frames: [pick, ...]       the frames of an animation; `every: N` keeps
#                             every Nth, `from`/`to` keep the frames from..to
#                             ticks after `near: EVENT`; `run: NAME` takes a
#                             pick from another run, and the runs follow one
#                             another in the order they first appear
#   jpeg: {width, height, quality}             (quality is ffmpeg's -q:v)
#   gif: {fps, width, height, colors, crop}    (crop is ffmpeg's w:h:x:y)
#   tolerance: share of pixels that may differ in the stale check (default 0.02)
#
# The captures take a frame every 5 ticks (12 a second), and the GIFs play
# them at the game's speed (fps 12), 720 wide (the README shows them about
# 400 wide in two columns, so a larger size only adds bytes). The README's first one, at
# fps 10, walks the map at a little under twice the speed. After ffmpeg writes a
# GIF, slimGIF (internal/dev/docs/gifslim_test.go) keeps only the pixels that
# changed by more than a small tolerance, which halves the size again.
images:
  # The README's first picture: the town map, the dungeon, a battle with its
  # cut-in, and a talk, about 12 seconds.
  go-zen.gif:
    run: map
    frames:
      - {shots: "m*", every: 2}
      - {run: dungeon, shots: "da*"}
      - {run: battle, shots: "fight_b*", every: 2, near: cutin, from: -725, to: -665}
      - {run: battle, shots: "fight_b*", every: 2, near: cutin, from: -560, to: -500}
      - {run: battle, shots: "fight_b*", every: 2, near: cutin, from: -185, to: -125}
      - {run: battle, shots: "fight_b*", near: cutin, from: -5, to: 110}
      - {run: face, shots: "fa01[4-9]"}
      - {run: face, shots: "fb0[01][0-9]"}
    gif: {fps: 10, width: 720, height: 405, colors: 96}
  go-zen-face.gif:
    run: face
    frames:
      - {shots: "f*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  go-zen-plaza.gif:
    run: plaza
    frames:
      - {shots: "p*"}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  go-zen-map.gif:
    run: map
    frames:
      - {shots: "m*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  go-zen-dungeon.gif:
    run: dungeon
    frames:
      - {shots: "d*"}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  go-zen-battle.gif:
    run: battle
    frames:
      - {shots: "fight_b*", near: cutin, from: -290, to: -110}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  go-zen-transform.gif:
    run: battle-transform
    frames:
      - {shots: "feature_*", every: 2}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  go-zen-merge.gif:
    run: battle-merge
    frames:
      - {shots: "feature_*"}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  go-zen-hp-pictures.jpg:
    run: battle-hp-pictures
    pick: {shots: "s-hurt"}
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-motion.gif:
    run: battle-motion
    # The sway is a spring that runs on its own clock, so frames shift a little between runs.
    tolerance: 0.08
    frames:
      - {shots: "full_*"}
      - {shots: "feature_*", every: 2}
    gif: {fps: 12, width: 720, height: 405, colors: 96, split_at: 24}
  go-zen-cutin.gif:
    run: battle
    frames:
      - {shots: "fight_b*", near: cutin, from: -10, to: 120}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  go-zen-tree.jpg:
    run: tree
    shot: s-tree
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-bestiary.jpg:
    run: lineage
    shot: s-page
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-lineage.jpg:
    run: lineage
    shot: s-lineage
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-breeding.gif:
    run: breeding
    frames:
      - {shots: "b0*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  go-zen-recruit.jpg:
    run: recruit
    shot: s-rise
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-title.jpg:
    run: opening
    shot: s-title
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-shop.jpg:
    run: shop
    shot: s-shop
    jpeg: {width: 720, height: 405, quality: 3}
  go-zen-balance.jpg:
    run: balance
    shot: s-balance
    jpeg: {width: 720, height: 405, quality: 3}
  # The README's campaign picture: the war map, the orders of a region, the sortie, the clash of
  # the two armies and the region in the Crown's colour; and the map with everything it shows.
  campaign.gif:
    run: campaign
    frames:
      - {shots: "ca*"}
      - {shots: "cb*"}
      - {shots: "cc*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  campaign-map.jpg:
    run: campaign
    shot: s-map
    jpeg: {width: 720, height: 405, quality: 3}
  campaign-clash.jpg:
    run: campaign
    shot: s-clash
    jpeg: {width: 720, height: 405, quality: 3}
  # The README's novel picture, beside the first one: a line, a choice, Back over the
  # choice, the same option again and Skip to the first line not read, about 10 seconds.
  novel.gif:
    run: novel
    frames:
      - {shots: "na*"}
      - {shots: "nb*"}
      - {shots: "nc*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  novel-back.gif:
    run: novel
    frames:
      - {shots: "na04[4-9]"}
      - {shots: "na05[0-9]"}
      - {shots: "nb*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  novel-skip.gif:
    run: novel
    frames:
      - {shots: "nb01[6-9]"}
      - {shots: "nb02*"}
      - {shots: "nc*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  novel-language.gif:
    run: novel-language
    frames:
      - {shots: "la*"}
      - {shots: "lb*"}
      - {shots: "lc*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  novel-stage.gif:
    run: novel-stage
    frames:
      - {shots: "st*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  novel-panel.jpg:
    run: novel-panel
    shot: s-panel-state
    jpeg: {width: 720, height: 405, quality: 3}
  novel-flags.jpg:
    run: novel-panel
    shot: s-panel-flags
    jpeg: {width: 720, height: 405, quality: 3}
  novel-picture.jpg:
    run: novel-ending
    shot: s-ending
    jpeg: {width: 720, height: 405, quality: 3}
  # The README's Playtesting section, beside the balance panel (F7) and the panel's State
  # and Flags tabs (novel-panel.jpg, novel-flags.jpg).
  playtest-reload.gif:
    run: playtest-reload
    frames:
      - {shots: "rl*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  playtest-memo.gif:
    run: playtest-memo
    frames:
      - {shots: "me*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  playtest-command.gif:
    run: playtest-panel
    frames:
      - {shots: "pc*"}
    gif: {fps: 12, width: 720, height: 405, colors: 96}
  playtest-jump.gif:
    run: playtest-panel
    frames:
      - {shots: "pj*"}
    gif: {fps: 12, width: 720, height: 405, colors: 128}
  # The meter's numbers change from run to run; they are a small part of the picture.
  playtest-frames.jpg:
    run: playtest-panel
    shot: s-frames
    jpeg: {width: 720, height: 405, quality: 3}
    tolerance: 0.03
  # The character book (ADR 0031): F6 opens it at a line, and right goes to Wren.
  novel-characters.jpg:
    run: novel-characters
    shot: s-characters
    jpeg: {width: 720, height: 405, quality: 3}
  puppet.gif:
    run: puppet-tour
    frames:
      - {shots: "f*", every: 3}
    gif: {fps: 10, width: 500, height: 281, colors: 128, crop: "960:540:0:0"}

# Pictures that are not captures. They are drawn once from vector sources and
# committed as they are; `make docs-images` does not remake them.
static:
  breeding.jpg:
    source: the author's original breeding illustration (`vampire_breed.jpg`)
    license: CC BY 4.0
  gozen-logo.svg:
    source: the mark (a brush circle in Go's blue, #00ADD8, around a cross key) and the word Gozen as paths, from Quicksand Bold; for light backgrounds
    license: MIT; the letter outlines come from Quicksand (SIL Open Font License 1.1), see ASSETS.md
  gozen-logo-dark.svg:
    source: the same logo for dark backgrounds
    license: MIT; the letter outlines come from Quicksand (SIL Open Font License 1.1), see ASSETS.md
  gozen-favicon.svg:
    source: the mark alone, for the site's icon on light backgrounds
    license: MIT
  gozen-favicon-dark.svg:
    source: the mark alone, for the site's icon on dark backgrounds
    license: MIT
  gozen-ogp.png:
    source: the dark logo alone, centered on a dark 1280x640 card (the social preview), rendered from SVG
    license: MIT; the word mark is set in Quicksand (SIL Open Font License 1.1), see ASSETS.md
  dungeon-themes.jpg:
    source: one corridor of the Go Zen sample (floor B1) shown in each of the five dungeon themes, taken one by one with the game binary under Xvfb after gozen theme add and a theme key in the dungeon, joined into one sheet of 640x360 cells
    license: CC BY 4.0 (the theme pictures, see ASSETS.md); the interface drawn in it is the Go Zen sample (CC BY 4.0 too)
