<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Playtesting with Gozen</title>
  <desc id="desc">Play, script or autoplay creates a trace. Use it to reproduce a screen, read screen structure, play metrics or per-section frame numbers. Capture compares with a previous capture.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#34546a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="380" rx="16" fill="#f4f8fb"/>
  <g fill="none" stroke="#34546a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 140H310"/>
    <path d="M470 140H520V48H580"/>
    <path d="M470 140H520V110H580"/>
    <path d="M470 140H520V172H580"/>
    <path d="M470 140H520V234H580"/>
    <path d="M240 328H580"/>
  </g>
  <g fill="#ffffff" stroke="#7c98aa" stroke-width="1.5">
    <rect x="30" y="108" width="210" height="64" rx="10"/>
    <rect x="310" y="108" width="160" height="64" rx="10"/>
    <rect x="580" y="24" width="350" height="48" rx="10"/>
    <rect x="580" y="86" width="350" height="48" rx="10"/>
    <rect x="580" y="148" width="350" height="48" rx="10"/>
    <rect x="580" y="210" width="350" height="48" rx="10"/>
    <rect x="30" y="304" width="210" height="48" rx="10"/>
    <rect x="580" y="304" width="350" height="48" rx="10"/>
  </g>
  <g fill="#19384c" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="135" y="136">Play / script /</text><text x="135" y="160">autoplay</text>
    <text x="390" y="147">Trace</text>
    <text x="755" y="55">Reproduce a screen</text>
    <text x="755" y="117">Screen structure</text>
    <text x="755" y="179">Play metrics</text>
    <text x="755" y="241">Per-section frame numbers</text>
    <text x="135" y="335">Capture</text>
    <text x="755" y="335">Compare with previous capture</text>
  </g>
</svg>
