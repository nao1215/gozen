# Configuration for the hosted documentation website (GitHub Pages).
# Content comes from the repository itself where it can: the screenshots in
# docs/images and the generated data/schema/types.schema.json are mounted read-only, so the
# committed files stay the single source of truth.
baseURL = "https://nao1215.github.io/gozen/"
locale = "en"
title = "Gozen"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "A YAML-first 2D RPG, visual novel and strategy game framework for Go with a fast edit–play loop"
description = "Gozen is a YAML-first 2D RPG, visual novel and strategy game framework for Go and Ebitengine. Write the game as YAML, check it with gozen check, gozen sim battle and gozen sim campaign, and tune it while you play with notes, live win rates, and reload."

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Play Go Zen"
pageRef = "/play"
weight = 5

[[menus.main]]
name = "Install"
pageRef = "/install"
weight = 10

[[menus.main]]
