# Configuration for the hosted documentation website (GitHub Pages).
# Content comes from the repository itself where it can: the screenshots in
# docs/images and the generated data/schema/types.schema.json are mounted read-only, so the
# committed files stay the single source of truth.
baseURL = "https://nao1215.github.io/gozen/"
locale = "en"
title = "Gozen"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "Create RPGs, visual novels and strategy games with YAML and assets. No programming required."
description = "Gozen is a no-code game toolkit. Create a playable template, edit YAML and assets, check your game and play it without writing Go code."

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Play Go Zen"
pageRef = "/play"
weight = 5

[[menus.main]]
name = "Install"
pageRef = "/install"
weight = 10

[[menus.main]]
name = "Getting started"
pageRef = "/getting-started"
weight = 20

[[menus.main]]
name = "Writing a game"
pageRef = "/writing-a-game"
weight = 30

[[menus.main]]
name = "Cookbook"
pageRef = "/cookbook"
weight = 35

[[menus.main]]
name = "Schema"
pageRef = "/schema"
weight = 40

[[menus.main]]
name = "Edit–play loop"
pageRef = "/edit-play-loop"
weight = 50

[[menus.main]]
name = "Commands"
pageRef = "/commands"
weight = 60

[[menus.main]]
name = "AI agents"
pageRef = "/ai-agents"
weight = 70

[[menus.main]]
name = "Production tools"
pageRef = "/production-tools"
weight = 90

[module]
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "data"
target = "data"

# The YAML contract, generated from the Go types by a test in
# internal/layer2/gamedata (GOZEN_UPDATE_SCHEMA=1). The Schema page is built from
# it by content/_content.gotmpl, with the English wording in data/schema_en.yaml
# and the descriptions in data/schema_fields/.
[[module.mounts]]
source = "../data/schema/types.schema.json"
target = "assets/schema/types.schema.json"

# Screenshots served as-is.
[[module.mounts]]
source = "../docs/images"
target = "static/images"

# The same images, mounted again as processable assets so the layouts can read
# their sizes and derive a social card and a favicon at build time without
# committing any extra binary.
[[module.mounts]]
source = "../docs/images"
target = "assets/imgsrc"
