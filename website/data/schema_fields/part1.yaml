Action:
  _: "Something the player can do at a location, such as searching a chest or resting at an inn."
  group: "The heading the action is listed under in the place's list. Entries of one group are listed together under it, the groups in the order first met. Expressions in braces are expanded. Omitted: no heading."
  do: "The commands that run when the player picks this action."
  id: "A stable ID for the action that does not depend on its label."
  label: "The text shown for this action in the location menu."
  mark: "An expression. While it holds, a marker is added to the label to signal something worth noticing."
  new: "An expression that holds while the action has new content. It is not shown on screen and is only a hint for automatic players."
  when: "An expression that decides whether the action is shown. If omitted, the action is always available."
Actor:
  _: "A party member or other character: their class, level, faces, equipment and portrait settings."
  ai: "The rules this actor follows in auto battle, either an ID of ai or a list of rules inline. Party members inherit their class AI when omitted."
  back: "If true, the actor starts in the back row."
  class: "An ID of classes for a combat actor. Omit for a speaker who only uses dialog, portraits and voices."
  color: "The color of the actor's name on the status screen."
  cutin: "The picture used for the skill cut-in, a file under assets/. The standing picture is used when omitted."
  cutin_box: "Where the face is in the cut-in picture: the center as fractions of width and height, then the size as a fraction of width."
  cutin_lines: "Lines shouted during a cut-in. One is picked in turn."
  doll: "How the actor looks as a small doll walking a stage when leading the party. Needs schema version 3."
  equip: "The starting equipment, mapping each equip slot to an ID of items."
  face: "The face shown by default. It must be one of the face names in the faces directory. Default `normal`."
  face_box: "Where the face is on the standing pictures: the center as fractions of width and height, then the size as a fraction of width."
  face_rules: "Rules that pick this actor's face from their state. The first rule whose `when` holds wins."
  images: "Faces selected by descending HP thresholds during battle. Each row names `below` and a `face` in the actor's faces directory. Needs schema version 7."
  face_shade: "How much the face icons cut from standing pictures are darkened, from 0 (as drawn) to 1 (black). Default 0."
  face_shade_top: "The darkness at the top of the face icon, fading evenly to `face_shade` at the bottom. Defaults to `face_shade`."
  faces: "A directory under assets/ that holds one picture per face, named `<face>.png`."
  level: "The starting level. Default 1."
  name: "The name shown for the actor."
  no_standing: "If true, the actor is not shown standing in talks or cut-ins, which suits the protagonist the player stands in for. The face icon stays."
  profile: "A short description of the actor shown in the status screen."
  puppet: "A moving portrait under assets/. The talk window draws it instead of the face picture when it has a face of that name."
  reactions: "Faces shown for a moment on events such as hit, act, heal, win and fall, mapping the event name to a face."
  tree: "Skill tree nodes already raised at the start, mapping a node ID to its level. They are paid from the starting SP."
  voices: "A folder under `assets/` holding the actor's voices, named by `say.voice`. `gozen check` counts the actor's lines without a voice. Needs schema version 4."
Affect:
  _: "Puts a state on party members or removes one outside battle."
  add: "The state to add, an ID of states. Either `add` or `remove` is required."
  remove: "The state to remove, an ID of states, or `bad` to remove every bad state."
  resist: "If true, the target's state resistance may block the state, rolled for each member. Otherwise the state is always applied."
  turns: "How many turns the added state lasts. The state's own `turns` is used when omitted."
  who: "Who is affected: an ID of actors, or `all` for the whole party."
Aside:
  _: "An event inserted right after a line by a given speaker is shown, when a condition holds. It is not inserted during battle."
  actor: "The speaker whose lines trigger the aside, an ID of actors. One of `actor`, `face` or `name` is required."
  call: "The event inserted after the line, an ID of events. The conversation resumes when it ends."
  face: "A pattern matched against the face of the line. One of `actor`, `face` or `name` is required."
  name: "The speaker name a line must have. One of `actor`, `face` or `name` is required."
  skip: "Patterns of event names. The aside is not inserted while one of these events, or an event it calls, is running."
  when: "An expression that decides whether the aside is inserted."
Atlas:
  activation: "travel (default) follows roads; instant executes the chosen point directly, including the current point, without walking, steps, encounters or changing the standing point. A to entrance still moves to its destination."
  region_numbers: "Which regions' plates show their garrison on a campaign's map: all (the default) or near (the region chosen and its neighbours; the others show their names only, in the same place)."
  talk: "How the map shows under a conversation that is not its own question (a region's orders): omitted (as it is), dim (darkened) or hide (darkened, without the markers, flags and name plates)."
  safe_area: "The edges of the screen kept for the windows over the map, [top, right, bottom, left] as fractions of the screen (each at most 0.45). The picture is fitted to the rest; zoomed in far enough, the camera keeps it over the whole screen, the edges included, however far it is moved. Omitted: the whole screen."
  selection_panel: "Optional fixed panel showing the focused point's first matching advice variant. Clicking selects; Confirm executes; Back hides the panel."
  camera: "Opt-in pan/zoom camera. An empty map uses zoom 2 and max_zoom 8. Omitted keeps the fitted overview. Camera position is not saved."
  travel_speed: "Token travel in picture widths per second, per location. Omitted or 0 means 0.12; otherwise 0.01 to 2, finite. Does not change road steps or encounters."
  _: "A location shown as a picture with points and roads. Needs schema version 3."
  draw_roads: "If true, the roads are drawn over the picture. By default they are only the paths the token walks along. Default false."
  label_size: "The height of the point name plates as a fraction of the screen height. 0.03 when 0."
  marker: "A map with a `picture` and an optional `height` for the piece standing on each point, such as a pin or flag. It cannot be `doll`. A small pin is drawn when omitted."
  picture: "The map picture, a file under assets/."
  points: "The places on the map, keyed by point ID."
  region_borders: "On a campaign's map, when the outline of each region's area is drawn: `selected` (the default, only the region chosen) or `always` (every region, the old look)."
  region_roads: "On a campaign's map, when the roads are shown: `selected` (the default, a thin arrow to each neighbour the region chosen can march on) or `always` (the lines of all the roads, as draw_roads does on other maps). draw_roads is not read on a campaign's map."
  roads: "The roads that connect points. The token walks along them."
  token: "The piece that stands for the party on the map: a picture, the leader's face, or `doll` for the leader's doll."
  unknown: "How a point not yet visited is shown: `hidden`, `dim`, `mark` (a question-mark plate, the default) or `named`."
AtlasPanel:
  _: "Selected-point advice in a fixed screen rectangle, independent of map pan and zoom."
  rect: "[x, y, width, height] as screen fractions; defaults to [0.66, 0.1, 0.32, 0.65]. Must fit the screen, with width at least 0.2 and height at least 0.25."
  portrait: "Default face picture under assets/. An advice variant can override it."
MapAdvice:
  _: "One selected-point advice variant; the first whose when holds is shown."
  when: "Normal field expression. Omitted always holds. Preview evaluation does not consume gameplay randomness."
  heading: "Heading template; the point label is used when omitted."
  text: "Body template, wrapped within the fixed panel."
  portrait: "Face picture under assets/, overriding the panel default."
AtlasCamera:
  _: "Presentation-only camera for a large atlas. Bounds are clamped to the picture and labels retain their screen size."
  buttons: "How the camera's on-screen buttons show: shown (the default), faint (see-through until the pointer is over them) or hidden (the keys, the wheel and the pad still move the camera)."
  zoom: "Initial zoom relative to fit-to-screen, from 1 to max_zoom. Zero or omitted means 2, capped at max_zoom."
  max_zoom: "Maximum zoom relative to fit-to-screen, from 1 to 64. Zero or omitted means 8."
BattleAct:
  _: "One move for the next auto battle: who acts, with what skill or item, and on whom."
  actor: "The party member who acts, an ID of actors."
  item: "The item to use, an ID of items. Use this or `skill`."
  skill: "The skill to use, an ID of skills. Use this or `item`."
  target: "The target, an enemy or party member ID. The skill's own targeting is used when omitted."
BattleCfg:
  _: "The rules shared by every battle: damage, speed, escape, AI, music and automatic play."
  after: "An event ID run after the result is applied, before the next choice or the end of the event. Useful for resource checks or returning home."
  after_win: "An event ID run after every battle that is won."
  ai: "How battlers choose actions: `priority` (the default, highest priority by weight) or `gambit` (the first rule that holds, from the top)."
  attack_skill: "The skill used by the Attack command, an ID of skills. Default `attack`."
  auto_start: "If true, battles begin in auto mode unless the player chose otherwise in settings. Default false."
  auto_tactics: "Auto-battle tactic rows for each named AI, keyed by AI name. An AI without an entry uses the default rules."
  auto_tempo: "A speed multiplier for messages and waits while auto battle runs. Default 1."
  back_weight: "How strongly enemies aim at one back-row member. Default 1."
  before: "An event ID run just before a battle starts. Useful for resource costs or entry conditions."
  boss_win_music: "The song played once when a battle with a boss enemy is won."
  critical: "An expression for the chance of a critical hit for skills that do not set their own. No critical hits when omitted."
  critical_rate: "The damage multiplier of a critical hit. Default 1.5."
  escape: "An expression for the chance that the party escapes. Default 0.5."
  foe_scale: "Multipliers for the stats of non-boss foes, keyed by stat name, such as `mhp: 1.4`."
  foe_scale_when: "An expression that decides when `foe_scale` applies. It always applies when omitted."
  front_weight: "How strongly enemies aim at one front-row member. Default 4."
  guard_rate: "The multiplier applied to damage taken by a guarding battler. Default 0.5."
  guard_skill: "The skill used by the Guard command, an ID of skills. Default `guard`."
  music: "The battle song used when the troop names none. Defaults to the song named `battle` if there is one."
  passives: "States placed on party members at the start of each battle while their `when` holds. They do not last after the battle."
  retry: "If true, the player may retry from before the fight after losing. Default false."
  simple_tactics: "If true, tactics are edited as five rows of condition and action only. Default false."
  speed: "An expression for the action order key, where higher acts first. Default `a.agi` times a random 0.8 to 1.2."
  tactic_presets: "Named sets of tactics the player can pick, keyed by preset ID."
  tempo: "How fast battle messages and moves go by. Default 1, and 1.5 is half as fast again."
  variance: "The default spread of damage and healing, where 0.1 means plus or minus 10 percent. Default 0.1."
BattleFx:
  _: "Multipliers that scale battle visual effects up or down. A value of 0 turns an effect off."
  auto: "Extra multipliers applied while the battle runs in auto mode."
  charge: "The length of the build-up before a boss's big move. Default 1."
  finish: "The length of the stop and slow motion on a finishing blow and the boss-defeated display. Default 1."
  flash: "The strength of the short white flash on critical hits and weakness hits. Default 1."
  hitstop: "How long the screen freezes on a critical or weakness hit. Default 1."
  pop: "The size and bounce of damage numbers. Default 1."
  shake: "The strength of screen shaking on critical hits, weakness hits and finishing blows. Default 1."
BattleFxAuto:
  _: "Extra effect multipliers applied during auto battle so the player is not kept waiting."
  charge: "Multiplier for the build-up before a boss's big move. Default 0, meaning none."
  finish: "Multiplier for the stop and slow motion on a finishing blow. Default 0, meaning none."
  hitstop: "Multiplier for the freeze on critical and weakness hits. Default 0, meaning none."
  win: "Multiplier for the time the boss-defeated banner cannot be skipped. Default 0.4."
Bubble:
  _: "A line said now and then in a speech balloon over a person's doll on a stage. It can be written as plain text or as `text` and `when`. Needs schema version 3."
  text: "The line shown in the balloon; it must not be empty. A bubble may be written as just this line."
  when: "An expression; the bubble is said only while it holds."
CG:
  _: "A full-screen picture shown by the `image` command, with its fade, tint, pages and display options. It can be written as just a file path."
  file: "The picture to show, under `assets/`. Written alone as a path; an empty path hides the picture shown."
  files: "Several pictures shown one after another, a tap between them; an entry may be a pattern such as `cg/night_*.jpg`."
  fit: "`contain` (the default) shows all of the picture over a blurred copy; `cover` fills the screen."
  tint: "A color the picture is tinted with, such as `\"#ffd8e0\"`."
  brightness: "Brightness of the picture; 1 (the default) is unchanged and 0 is black in schema version 1 and later."
  fade: "Seconds the picture takes to fade in (default 0.25); 0 shows it at once in schema version 1 and later."
  faces: "Keep the speakers' pictures shown over it; they are hidden by default."
  page: "With `files`, show only this page (1 is the first; past the last, the last)."
  over: "A picture standing in the middle of it, its feet above the message window, such as a monster met in a dungeon."
  over_size: "The height of `over`, as a share of the screen's height (default 0.55)."
  pick: "An expression choosing which of `files` to show: its value modulo the number of files, plus one."
  optional: "Let `files` match no picture yet; nothing is shown until one exists."
  look: "How it is shown; `dream` blurs the edges, adds a haze from the edges and slowly zooms in."
  haze: "The color of the `dream` haze (a pale pink when left out)."
  auto: "Seconds each of `files` stays before the next comes by itself, a slideshow without the message window; 0 waits for a tap."
CGReviewCfg:
  _: "Settings for reviewing the game's pictures: the tags to mark them with, extra files and groups."
  extra: "Extra picture files to include in the review."
  groups: "Named groups of picture files to review together."
  tags: "The tags a reviewer can mark a picture with."
CGReviewGroup:
  _: "A named group of pictures in the review."
  files: "The picture files in the group. At least one is required."
  label: "The name shown for the group. Required."
CGReviewTag:
  _: "A tag a reviewer can attach to a picture."
  id: "The ID stored in the record. It must be unique among the tags."
  label: "The name shown for the tag."
  ok: "If true, this is an OK tag, and pictures with it are left out by the filter that hides OK ones."
CardBubble:
  _: "Small particles that rise from an actor's card in battle while a condition holds, such as bubbles for a poisoned member."
  actor: "The actor whose card shows the particles, an ID of actors."
  color: "The particle color. Default white."
  count: "How many particles appear at once. Default 4, up to 24."
  rise: "How high the particles rise. Default 50."
  size: "The particle radius. Default 3."
  speed: "How fast the particles rise. Default 30."
  state: "A state ID. The particles appear while the actor has this state."
  when: "An expression. The particles appear while it holds."
ChoiceOption:
  _: "One answer of a `choice` command."
  do: "The commands that run when this answer is picked."
  id: "An identifier that is unique within the same question."
  label: "The text shown for this answer."
  when: "An expression that decides whether the answer is offered."
Class:
  _: "A kind of character: how stats grow with level, which skills are learned and what equipment is allowed."
  ai: "The auto battle rules for this class, either an ID of ai or a list of rules inline."
  equip: "The kinds of equipment this class may use. An empty list allows every kind."
  exp_for: "An expression for the total experience needed to reach a level, with the level given as `level`."
  max_level: "The highest level this class can reach."
  name: "The name of the class."
  skills: "The skills learned at given levels."
  sp: "The skill points gained at each level. Default 1."
  sp_pitch: "A short line used when suggesting how to spend SP, giving a reason that fits this class's role."
  start_sp: "The skill points the class has at level 1."
  stats: "An expression for each stat, such as `mhp` or `atk`, giving its value at a level."
  tree: "The skill tree: skills and passive nodes raised with SP, each opening once the nodes it requires are raised far enough."
Campaign:
  _: "game.yaml's campaign: a game of regions held by factions over turns (ADR 0030). Its state is in variables with generated names."
  end_turn_button: "A button at the bottom right of the map, over the generals, that ends the turn on a click or the E key (the pad's left face button); it glows when no actions are left. Omitted: none."
  order_view: "How the orders of a region chosen on the map are offered: list (a choice of their labels, the default) or icons (a row of square buttons with the orders' icons over the bottom of the map; left and right choose, OK gives the order, Cancel closes it)."
  sortie: "How the sortie screen looks: a picture behind it, and its title, then shown in a window like the other windows. Omitted: a plain dark screen with an outlined title."
  heading: "The turn's part of the band over the campaign's map, a text with {expressions}, such as \"Year {campaign.year}\". With it the band leaves out the last turn. Omitted: the calendar's words."
  pin_end_turn: "Keep the end of the turn in the last row of the place's list, below the rows that scroll, so it shows however long the list is, on every kind of place. On by default; false lists it where it falls."
  actions: "An expression for how many orders a turn has, worked out at the start of each turn. It may read only region, faction, campaign and generals. Default 1."
  calendar: "How the turns are named: omitted (turn N) or week (a turn is a week of a 52-week year; campaign.week and campaign.year)."
  clash: "How a march is decided."
  count: "How a turn's orders are counted: actions (the turn's actions, each order spending its cost; the default) or orders (each order may be given per_turn times a turn)."
  defeat: "What becomes of a general whose troops a march brings to 0. A general is never lost for good."
  end_turn: "The label of the menu entry that ends the turn. The engine's words when omitted."
  generals: "The actors who lead the player's marches, keyed by actor ID. A general serves once they have joined."
  location: "The place whose menu lists the orders and the end of the turn. Required."
  lose: "An expression that ends the campaign lost. Default: the player's faction does not hold its capital."
  lost: "The event run when the campaign is lost (or the last turn ends), before the game is over."
  on_turn: "The event run at the start of each turn after the first."
  labels: "The names shown for the regions' values in the region window, keyed by value name. A value without a label shows its name."
  orders: "What the player can do in a turn, keyed by order ID, listed in the written order."
  player: "The player's faction, an ID of factions. Required."
  turns: "The last turn. Ending it without winning loses. 0 means no limit."
  win: "An expression that ends the campaign won. Default: the player holds every region."
  won: "The event run when the campaign is won, before the game is cleared."
Clash:
  _: "How a march of a (the side marching, with troops, might, faction, general, and the general's level and stats such as atk) on the region b is decided. The march takes b when power is more than defense."
  defense: "The strength of the region. Default `b.troops * 1.25`."
  backgrounds: "The pictures behind a clash shown as units, by the region's terrain (field, town, castle or any word), files under assets/."
  armies: "The soldiers of an army by kind (generals.<id>.army, enemies.<id>.army): each kind lists poses of one soldier, facing right (the foe side is turned to face left), which a clash shown as units lines up in staggered rows behind the front, one soldier for per_soldier troops. The soldiers lost fall from the back rows. With armies, soldiers is not read."
  layout: "Where a unit's leader stands against its army in a clash shown with armies. below (the default): the armies above and a row of large cards, a bust of each leader, along the bottom; the rope of the troops is left out unless rope is true. front: a small card in front of each army, at the edge facing the foe."
  capture: "The chance that a routed foe is caught in a clash shown as units, from 0 to 1. Default 0.2."
  garrison: "The share of a general's troops left in a region taken, from 0 to 1. Default 0.4. A faction's march leaves all of them."
  hit: "The troops a unit's strike takes in a clash shown as units: a strikes, b is struck (troops, max, might, hp, mhp, player, level and the stats). Default `a.troops * 0.15 * (0.8 + rand() * 0.4)`."
  per_soldier: "The troops one soldier stands for in a clash shown as units. Default 50 for the ranks; with armies, the troops a unit marches with divided by max_soldiers, and a value here wins."
  max_soldiers: "The most soldiers one unit of an army shows in a clash shown with armies, from 1 to 12. Default 4. They fall from the back as the troops fall."
  rounds: "The most rounds of a clash shown as units; when they run out, the region holds (a draw). Default 5."
  soldiers: "The pictures of one soldier of the player's side (player, facing right) and of the foes' (foe, facing left), lined up behind each leader in a clash shown as units."
  held: "The garrison of b left after holding. Default `b.troops - power * 0.4`."
  lost: "The troops of a left after failing. Default `a.troops * 0.5`."
  power: "The strength of the march. Default `a.troops * (0.8 + rand() * 0.4)`."
  won: "The troops of a left after taking b. Default `a.troops * (1 - 0.5 * defense / power)`."
  rope: "false leaves out the rope of the two sides' troops over a clash shown as units, so the soldiers alone tell them. Default true, but false with armies laid out below."
  skills: "The skills of a clash shown as units, by ID: a unit uses one when it is charged (campaign.generals.<id>.skills, and foes for enemies)."
  tactics: "The tactics of a clash shown as units, by ID: how a unit picks the foe it strikes, chosen for each general on the sortie screen. Without them the engine's front, weakest, strongest, leader and guard."
  units: "The most units a side has in a clash shown as units, 1 to 4 (4 when omitted); 1 makes it a duel. It also caps the generals of an order."
ClashSkill:
  _: "A skill of a clash shown as units: charged after charge rounds, it is used instead of the next strike."
  all: "If true, it strikes every foe in front instead of the one the tactic picks."
  charge: "The rounds it takes to charge. Default 2."
  foes: "The enemies who use it, IDs of enemies (generals list theirs in campaign.generals.<id>.skills)."
  heal: "The troops it gives back to the unit (a the unit), at most what it lost."
  label: "The name shown across the unit's card when it is used."
  power: "The troops it takes from each foe struck: a strikes, b is struck. Default twice clash.hit."
  cutin: "If true, the user's picture crosses the screen with the skill's name before it strikes (a general's cut-in picture, else the face)."
ClashTactic:
  _: "A tactic of a clash shown as units: how a unit picks the foe it strikes and how much it deals and takes."
  all: "If true, it looks at every foe standing, not only those in front."
  by: "The number pick compares (t the foe, a the unit striking), such as t.troops or t.hp."
  deal: "The share of the troops it takes that the unit deals, 1 when omitted (0.6 deals less)."
  label: "The name shown on the sortie screen."
  pick: "least or most by by, or random (the default)."
  take: "The share of the troops struck that the unit loses, 1 when omitted (0.6 loses less)."
  where: "Which foes it may strike (t the foe, a the unit striking); all of them when none holds."
