EndTurnButton:
  _: "The button on a campaign's map that ends the turn (campaign.end_turn_button)."
  icon: "Its picture under assets/, beside the end of the turn's label. Omitted: the label alone."
Encounter:
  _: "The random battles met at a location, checked on arrival and on each search (or each step in a dungeon)."
  gauge: "If set, each step fills an on-screen gauge by `rate`, and the chance of a battle on a step is the gauge's fill times this number (for example 0.3). The gauge empties after a battle."
  rate: "An expression giving the chance of meeting a battle on arriving and on each search or dungeon step."
  search: "The label of an extra menu entry that searches the location and rolls `rate` for a battle. It is shown only when `troops` is not empty."
  troops: "The enemy groups that can appear, each a troop with its own weight and conditions."
Enemy:
  _: "A kind of foe that can appear in battle."
  family: "The monster family ID used by breeding. Needs schema version 6."
  rank: "A positive rank used to select offspring from a family rule. Needs schema version 6."
  monster_class: "The class used for a recruited or bred actor instance. Needs schema version 6."
  sex: "Allowed sexes for monster instances: any (default), male or female. Needs schema version 6."
  sex_ratio: "Chance of a male instance when sex is any, from zero to one; default 0.5. Needs schema version 6."
  recruit: "The chance, level and optional bonus for joining after a victory. Bosses cannot be recruited. Needs schema version 6."
  lore: "A short description shown in the monster book after the enemy has been encountered."
  actions: "How many actions the enemy takes per turn. The default is 1."
  army: "The kind of army (a key of campaign.clash.armies) its unit is shown as in a clash shown as units, when it leads a region's defence or a faction's march: monsters for monsters."
  ai: "How the enemy chooses what to do, either an ID of ai or a list of rules written inline."
  boss: "Set to `true` to make this enemy a boss, which gets the guardian banner and boss treatment in battle."
  drops: "Items the enemy may leave behind when defeated, each with its own chance."
  exp: "The experience points the party earns for defeating this enemy."
  face_rules: "Rules that pick which face (a key of `faces`) the enemy shows, using the first rule whose condition holds."
  faces: "Pictures of the enemy by mood (such as hurt or angry), for bosses drawn as people. Values are images under assets/."
  gold: "The gold the party earns for defeating this enemy."
  hard: "If above 0, the plain attack (the skill named by `battle.attack_skill`) does at most this much damage to the enemy unless it is a critical hit. Other skills and critical hits do full damage."
  hp_triggers: "Immediate form changes when damage crosses descending HP ratios. Each row names `below` and `transform`. Needs schema version 7."
  image: "The picture of the enemy shown in battle, written as a path or as a picture map with a `file`."
  images: "Alternate files selected as HP falls below descending ratio thresholds. Needs schema version 7."
  motion: "Idle movement: none (default), breathe, sway, or bob. Needs schema version 7."
  puppet: "An optional moving portrait definition under assets/ for this enemy. Needs schema version 7."
  level: "The enemy's level as read by battle expressions (`level`) and the average level of a side. It does not change `stats`. The default is 1."
  name: "The enemy's name shown in battle."
  reactions: "Faces (keys of `faces`) shown briefly when the enemy is hit, acts or falls."
  resist: "Damage multiplier by element, as a map of element name to number. A value of 0.5 halves that damage."
  scale: "The legacy size multiplier of the enemy picture. The default is 1."
  image_height: "Battle picture height as a fraction of screen height (0 to 1). Omission keeps the legacy pixel-based layout; crowded troops shrink together."
  state_resist: "Chance multiplier by state, as a map of state ID to number. A value of 0 makes the enemy immune."
  stats: "The enemy's base stats, a map that must give all eight stats."
  title: "The small line above a boss's name in the banner shown at the start of its battle. When empty, a default guardian line is used."
HPImage:
  _: "A battle picture selected when the unit's HP ratio falls below a threshold."
  below: "Exclusive HP ratio threshold between zero and one. Write rows in descending order."
  file: "The enemy picture under assets/; use this only for enemies."
  face: "The actor face name in its faces directory; use this only for actors."
HPTrigger:
  _: "An enemy form change triggered immediately after damage crosses an HP ratio."
  below: "Exclusive HP ratio threshold between zero and one, in descending order."
  transform: "The enemy ID of the new form."
  hp: "New HP: ratio (default), full, or an expression evaluated before the form changes."
  clear: "Clear states and guard on transformation when true."
Merge:
  _: "A skill effect that combines living enemies into one form."
  into: "The enemy ID of the merged form."
  from: "Enemy IDs allowed to join the merge."
  count: "How many living members must join, including the user. At least two."
  hp: "Merged HP: sum (default), average ratio, or full."
EquipItem:
  _: "The `equip` command: an actor puts an item from the bag into an equipment slot."
  actor: "The ID of the actor (an ID of actors) who equips the item."
  item: "The ID of the equipment item (an ID of items that has a `slot`) to put on. When omitted, the slot is emptied."
  slot: "The equipment slot to use (an ID of slots). When empty, the item's own first slot is used."
EquipStones:
  _: "Puts the stones of a stone set on an actor."
  actor: "An expression giving the ID of the actor who receives the stones."
  set: "An expression giving the ID of the stone set to put on."
Event:
  _: "A named list of commands, run from another event with `call` or by itself when its trigger fires."
  do: "The commands the event runs."
  location: "The ID of the location (an ID of locations) where a triggered event fires. For `auto`, empty means anywhere. An `enter` event needs a location."
  once: "If `true`, a triggered event fires only once and is then marked as done."
  trigger: "When the event runs by itself: empty for only when called, `enter` on entering a location, or `auto` whenever its conditions hold."
  when: "An expression that must hold for a triggered event to fire."
Exit:
  _: "A way out of a location that leads to another location."
  at: "For an exit into a dungeon, the map character to arrive at."
  do: "Commands run before moving. An exit with only `do` runs them and does not move."
  facing: "For an exit into a dungeon, the direction the party faces on arrival."
  label: "The text of the exit shown in the menu."
  to: "The ID of the location (an ID of locations) the exit leads to."
  when: "An expression that must hold for the exit to be shown."
FaceRule:
  _: "One rule for picking an actor's or enemy's face from their state, where `self` is the one in question."
  face: "The face to show, a key of `faces`."
  when: "An expression that must hold for this rule to apply. The first rule that holds wins."
FloorPlan:
  _: "How one floor of a generated dungeon is made."
  map: "A hand-drawn map for this floor, using `#`, `.`, `D` and tile characters with one start character. Characters already drawn count toward each `place` count, and `place` adds only what is missing."
  note: "A free note explaining why this floor was hand-drawn. It has no effect on play."
  seed: "The random seed for this floor, taking priority over the dungeon's `seed`."
Fonts:
  _: "The font files used by the game, as paths under assets/. All are optional: without them the text is set in Go Regular, which Gozen carries and which has Latin letters only."
  pop: "The font used for pop-up text such as damage numbers."
  regular: "The font used for ordinary text. When omitted, the built-in Go Regular is used; it has Latin letters only, so a game in Japanese or another script names its own font here. gozen check warns about characters the built-in font cannot draw."
  subtitle: "The font of the title screen's subtitle. When empty, the title's font is used."
  title: "The font of the title screen's title and subtitle. When empty, the regular font is used."
Front:
  _: "A part of a painted stage that stands up from the ground (a pillar or a stall) and hides people standing behind it."
  area: "The polygon covering the front object in the painting."
  base: "The y coordinate of the line where the object meets the ground. People whose feet are behind (above) this line are hidden by it."
Fusion:
  _: "A recipe at the stone shop that makes one stone from several."
  from: "The IDs of the items (the stones, an ID of items) that are combined. At least one is needed."
  price: "The gold the fusion costs."
  to: "The ID of the item (the stone, an ID of items) that the fusion produces."
Gallery:
  _: "The title screen's gallery: pictures to look at again and scenes to play again."
  cgs: "The pictures in the gallery, each opening once it has been shown in play."
  music: "The song and mood used when a gallery scene starts, unless the scene has its own music. If neither is set, the location's music plays."
  music_pictures: "Pictures shown in the music section for each song, as a map of song ID to a list of picture paths. Pictures not yet unlocked are skipped."
  scenes: "The scenes that can be played again from the gallery."
GalleryCG:
  _: "A picture in the gallery that opens once it has been shown by an `image` command or its flag is set."
  file: "The path of the picture under assets/. It may be a pattern matching several files."
  files: "Several pages of one picture, viewed one after another. Each entry may be a pattern such as `cg/x.*.jpg`."
  flag: "A flag that, once set, also opens this picture."
  title: "The title shown for the picture in the gallery."
GalleryPage:
  _: "An entry point into the middle of a gallery scene, given as a playback position and the answers to choices before it."
  answers: "The 0-based indexes of the options chosen at each choice before this position, in order. Playback stops at the first choice with no listed answer."
  line: "The 1-based number of the line or question to start from, counting dialog lines and choices."
  picture: "If set, only dialog shown over this picture is counted for `line`."
  title: "The title shown for this entry point in the list."
GalleryScene:
  _: "A scene that can be played again from the gallery, run as an event with the starting party and no lasting effect."
  background: "The picture shown behind the replay. By default the location's background is used."
  event: "The ID of the event (an ID of events) to play."
  flag: "A flag that, once set, opens the scene. At least one of `flag`, `when` and `seen` is needed."
  group: "The heading under which the scene is grouped on the scene review page, such as a character name. When empty, it is grouped as other."
  id: "A fixed name for the scene that stays the same when its title or unlock condition changes."
  legacy_keys: "Older keys of this scene, so records saved under them carry over to this `id`."
  location: "The ID of the location (an ID of locations) where the replay starts. By default the place where the event usually happens, or else the first location."
  music: "The song and mood used when the replay starts. By default the gallery's music, then the location's."
  pages: "Entry points that let the replay start from the middle instead of the beginning."
  picture: "A picture shown for the scene in the gallery list. By default none."
  seen: "A picture path or a pattern under assets/. The scene opens once a matching picture has been shown."
  set: "Assignments applied to the replay's starting state, such as `flag.x` or `var.x` expressions, so the scene plays as a later visit or with the right partner."
  title: "The title shown for the scene in the gallery."
  when: "An expression that must hold for the scene to open."
Game:
  _: "The contents of game.yaml: the game's title, screen and starting state."
  asides: "Events inserted after the lines of certain speakers, such as a moment of thought or a picture in the character's mind."
  battle: "The rules every battle shares."
  campaign: "Makes the game a campaign of regions held by factions over turns: the place of the orders, the player's faction, the turns, the orders, the generals and how a march is decided. Needs schema version 5."
  card_bubbles: "Small particles (such as poison bubbles) that rise from a party member's status card."
  cg_review: "Settings for the picture review debug mode: the tags to attach, extra pictures and picture groups."
  data_version: "The version of the game's content. 0 or omitted means unmanaged. It is separate from the save format version."
  equip_slots: "The equipment slots a character has, such as weapon or armor."
  fonts: "The font files the game uses."
  gallery: "What the title screen's gallery shows: pictures seen and scenes to replay."
  game_over: "What happens when the party falls."
  id: "The game's ID, which names its save directory."
  join_exp: "An expression giving the minimum experience of a member who joins the party, evaluated against the party before joining. Lower experience is raised to this, never lowered."
  language: "The language shown: the engine's built-in words, `en` (the default) or `ja`, and the game's own text, translated by `lang/<language>.yaml` when it is not the language written."
  languages: "The languages the player may choose in the settings, from `en` and `ja`; the language shown must be one of them. The default is `language` alone. Needs schema version 4."
  max_party: "The largest number of characters in the active party."
  memo: "Settings for the test player's notes (kinds of notes and numbers kept with each)."
  meters: "Gauges of the player's numbers shown on the field, in the dungeon and in the status menu."
  scene_review: "Settings for the scene review debug page, such as the tags attached to scenes."
  schema_version: "The version of the YAML specification the game is written for. 0 or omitted means the legacy rules."
  screen: "The logical screen size."
  screens: "Named information screens, each with a title and ordered entries. Open with `open: NAME`."
  stand_ins: "A file under assets/ listing placeholder pictures, one path per line. A placeholder picture does not hide character portraits."
  start: "The state a new game begins in."
  state: "Declarations of the game's variables and whether unknown names are rejected."
  subtitle: "The subtitle shown on the title screen."
  terms: "The words the menus use, such as the currency name and level label."
  text: "Replaces the engine's built-in words on the screens, as a map from the engine's key to your text."
  title: "The game's title."
  title_art: "A picture drawn on the title screen, such as a logo or key art."
  title_background: "The background picture of the title screen."
  title_figures: "Pictures standing on the title screen in order, with later ones in front. When used, `title_art` is not drawn."
  title_text: "How the title screen letters the title and the subtitle: sizes, the space between letters and colors. Needs schema version 3."
  title_music: "The song and mood played on the title screen."
  ui: "The look of the game's menus and windows."
  reactions: "Maps speaker IDs to reaction book paths under assets/. Memory is saved with the game."
  streams: "The live-stream file (`Streams`), relative to the game, such as `data/streams.yaml`. It and its episodes are not data files. Needs schema version 9."
  verbs: "Maps reusable command names to event IDs. Invoke with `NAME: true`, or call the event directly with `call`."
  written_in: "The language the files under `data/` are written in. Each other language is translated by `lang/<code>.yaml`, a map `text` from the text as written to its translation. The default is `language`. Needs schema version 4."
GameOver:
  _: "What is shown when the party falls."
  background: "The picture shown behind the game over screen."
  event: "An event run instead of ending the game, for example to carry the party back and apply a penalty."
  music: "The song and mood played on the game over screen."
  text: "The text shown on the game over screen."
Faction:
  _: "A side of a campaign. One is the player's; the others move by their ai rules at the end of each turn."
  ai: "The rules the faction follows at the end of each turn, each in its order. The player's faction's rules are used only by gozen sim campaign --as ai."
  capital: "A region the faction holds at the start. Losing it is the player's default defeat."
  color: "The faction's colour, for the marks of its regions."
  name: "The name shown. The ID when omitted."
  generals: "The enemies who lead the faction's marches when the campaign shows marches as clashes of units: a march takes the strongest (by atk), up to clash.units, and is fought as a clash. IDs of enemies."
FactionRule:
  _: "One rule of a faction's turn: draft troops into every region it holds, or march once along a border."
  by: "An expression over s (the region marching) and t (the region marched on) that pick: min or max compares."
  draft: "An expression for the troops each region of the faction gains, with t the region."
  keep: "The least garrison a region must have to march from it."
  march: "If true, the rule marches once along a border where `where` holds."
  pick: "Which march to take: first (in the written order of the regions, the default), min, max or random."
  send: "The share of the garrison that marches, from 0 to 1. Default 0.6."
  when: "An expression that must hold for the rule to run."
  where: "An expression over s (a region of the faction) and t (a region it borders, not its own) that must hold for the march."
General:
  _: "An actor's place in a campaign."
  might: "A number read as a.might in the clash."
  army: "The kind of army (a key of campaign.clash.armies) their unit is shown as in a clash shown as units: men for a man, women for a woman."
  troops: "The troops the general leads at the start."
  skills: "The skills they use in a clash shown as units, IDs of campaign.clash.skills."
  tactic: "The tactic the sortie screen picks for them first, an ID of campaign.clash.tactics (or of the engine's)."

AuthorScreen:
  _: "An author-defined information or picture list opened by name."
  title: "The title, with text interpolation and translation."
  entries: "Selectable detail pages in authored order."
ScreenEntry:
  _: "One detail page in an author-defined screen."
  do: "Optional event commands run once on confirmation; conditions and text refresh afterward."
  label: "Required label shown in the list."
  text: "Detail text, with interpolation and translation."
  picture: "Optional image path under assets/."
  when: "Condition for showing this entry; omitted means visible."

Respond:
  _: "Submit text to a speaker's reaction rules and show the reply as dialog."
  who: "A speaker with a book in game.yaml reactions."
  text: "Text submitted to the rules, with interpolation and translation."
  from: "Sender name for repeat detection; omitted means player."
