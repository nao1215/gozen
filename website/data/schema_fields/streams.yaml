Streams:
  _: "The live-stream file named by `streams` in game.yaml (schema version 9): the channels, their episodes, and the rules of the stream screen."
  timing: "How long each kind of beat lasts, in seconds."
  live: "Who is live when the game opens."
  away: "The gold earned while the game is closed."
  tips: "The amounts the player can tip, above 0, smallest first, each once."
  crowd: "The bot viewers of the chat."
  channels: "The streamers, in the order the lobby lists them."
  duos: "Episodes two channels stream together."
StreamTiming:
  _: "The length of the beats. A line lasts `say` plus `per_char` for each character; a question shows its options for `ask` and then says its longest answer."
  say: "Seconds every line lasts, more than 0."
  per_char: "Seconds more for each character of a line, 0 or more."
  chat: "Seconds a chat beat lasts, more than 0."
  ask: "Seconds the options of a question stay open, more than 0."
StreamLive:
  _: "Who is live: every channel the first time the game opens, then each with the chance `share` and at least `min_share` of them."
  share: "The chance of each channel to be live, 0 to 1."
  min_share: "The least part of the channels that are live, 0 to 1."
  duo_chance: "The chance that two live hosts of a duo stream together, 0 to 1."
StreamAway:
  _: "Gold earned while the game is closed, shown when the stream screen opens."
  per_hour: "Gold an hour, 0 or more."
  cap_hours: "The most hours counted, 0 or more."
  star_bonus: "The part added for each affection step of each channel, 0 or more (0.1 adds 10%)."
StreamCrowd:
  _: "The bot viewers of the chat."
  names: "The names of the bot viewers."
  lines: "What they chat."
  tip_lines: "What they write with a tip."
  rate: "Messages a second on average, more than 0 and at most 100."
Channel:
  _: "A streamer: an actor streaming from a room, with its episodes and its greetings."
  id: "The channel's ID, unique, not `say`, `chat` or `ask`. A duo's episodes use it as the key of the other host's lines."
  actor: "The actor (`actors`) whose name, puppet and reaction book (`reactions`) the channel uses. It needs a puppet."
  tag: "The category shown under the name."
  room: "The background picture under assets/."
  frame: "The part of the puppet shown."
  voice: "Speech synthesis in a browser build."
  episodes: "The episode files (`Episode`), relative to the streams file. A channel plays the next one the player has not seen."
  greet: "Lines said to a returning viewer, one list for each affection step 0 to 4. `{from}` is the viewer's name."
  first: "Lines for a first-time viewer; one is said. `{from}` is the viewer's name."
  streak: "Lines for a viewer who came three days in a row or more; one is said. `{days}` is the days and `{from}` the name."
  stayed: "Lines for a viewer who watched to the end; one is said. `{from}` is the viewer's name."
StreamFrame:
  _: "The part of the puppet a stream shows, in the puppet's pixels."
  cx: "The column at the center of the frame."
  top: "The row at the top of the frame, 0 or more."
  bottom: "The row at the bottom of the frame, below top."
StreamVoice:
  _: "The voice of speech synthesis; 0 is 1."
  pitch: "The pitch, 0 to 2."
  rate: "The speed, 0 to 10."
Duo:
  _: "Episodes two channels stream together when both are live."
  host: "The channel that hosts it."
  with: "The other channel."
  episodes: "The episode files, relative to the streams file."
Episode:
  _: "One stream: its title, the lines of its lobby card, and its parts. An episode shorter than 20 minutes is warned of."
  title: "The title shown under the stream."
  lobby: "Short lines for the lobby card."
  parts: "The parts, each a list of beats played in order."
Beat:
  _: "One beat: `say`, `chat`, `ask`, or the channel ID of the other host of a duo with a line."
  say: "A line of the host: the text, or `{face, text}`."
  chat: "A viewer's message, `[name, text]`."
  ask: "A question the viewers answer."
StreamLine:
  _: "A line, written as its text or with the face it is said with."
  face: "A face of the speaker's puppet."
  text: "What is said."
StreamAsk:
  _: "A question. The player may answer it; the streamer reads one answer and its lines."
  who: "The channel that asks; the host when left out."
  q: "The question the asking channel says."
  options: "Two to four answers."
  npc: "Answers of bot viewers, `[name, option]`, the option counted from 0. At least one."
StreamOption:
  _: "An answer and what is said when it is picked."
  c: "The answer shown on its card and in the chat."
  r: "The lines said when it is picked. `{name}` is who picked it."
