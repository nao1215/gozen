Troop:
  _: "A group of enemies met together in one battle."
  background: "The picture shown behind the battle."
  can_escape: "Whether the party may run away. The default is true."
  events: "Commands that run during the battle when their conditions hold."
  intro: "The line shown when the battle begins, instead of the default appearance message."
  level_scale: "Toughens the troop a little when the party is stronger than intended, for bosses."
  members: "The IDs of enemies in the troop. At least one is required."
  music: "The music played during the battle."
  name: "The troop's name."
  win_music: "The music played once after winning, taking precedence over the game's boss win music."
TroopEvent:
  _: "A battle event: commands run when a condition holds during a battle."
  do: "The commands to run."
  once: "Whether it fires only once per battle. The default is true."
  when: "The condition that triggers it."
TroopPick:
  _: "A troop that can be drawn, with its weight."
  troop: "An ID of troops."
  weight: "The relative chance of drawing this troop. The default is 1, and 0 or less counts as 1."
  when: "A condition for the troop to be eligible."
UIStyle:
  _: "The colors and layout of the windows and message display."
  bestiary: "Show Monsters, the monster book, in the title and field menu. Off by default; under `--dev` the menus show it anyway. Needs schema version 4."
  accent: "The accent color."
  backlog: "How many lines the backlog keeps. The default is 300."
  balloon: "The text height of speech balloons over people in a painted scene, as a fraction of the screen height, from 0.01 to 0.2. The default is 0.037; needs schema version 3."
  battle_fx: "How strong the battle effects are: shake, flash, number pop, hit stop, charge and finish."
  border: "The window border color."
  cursor: "The cursor color."
  field_notices: "Whether to show small notices on the field. The default is true."
  message: "The message window style: `box` (a framed box, the default) or `novel` (across the bottom like a visual novel)."
  name_tag: "The color of the speaker's name tag."
  rollback: "How many earlier events the player can roll back into, besides the one running, from 0 to 64. The default is 8, and 0 turns rolling back off; needs schema version 4."
  profiles: "Show Characters, the character book, in the title, the field menu and the novel bar. Off by default; under `--dev` the menus show it anyway."
  sfx_vary: "How much repeated sound effects vary in pitch and volume."
  shadow: "The text shadow color."
  stage_drop: "Per standing picture, how far to move it down as a fraction of the screen height, to even out heights. The default is 0."
  stage_scale: "Per standing picture, a size multiplier keyed by picture file. The default is 1."
  talk_portrait: "Where the speaker's standing picture stands beside the `box` message window, to bring the speaker closer. The default is a picture as tall as the screen at the window's left end; needs schema version 3."
  text: "The text color."
  voice: "How voices play: `cut` and `auto_wait`. Needs schema version 4."
  window: "The window background color."
Usage:
  _: "What using an item or skill does: its targets, effects and presentation."
  anim: "The animation style: `slash`, `magic`, `heal`, `buff`, `debuff` or `none`."
  color: "The color that tints the effect."
  crit: "The critical-hit chance as an expression. The default is the battle's critical rate; use `0` for none."
  cutin: "Show the user's picture and name across the screen before the action, for big skills."
  effects: "What it does to each target, as a list of effects."
  fx: "The effect drawn on the targets, such as `slash`, `fire`, `heal` or `none`. The default depends on the element or `anim`."
  hit: "The chance to hit each target, as an expression. The default is 1."
  hits: "How many times it hits each target; for `random_enemy`, how many random foes it strikes. The default is 1."
  message: "The message shown when it is used."
  sacrifice: "The user falls after using it, as in blowing itself up."
  scope: "Who it targets: `one_enemy`, `all_enemies`, `random_enemy`, `one_ally`, `all_allies`, `self`, `dead_ally`, `all_dead_allies`, `everyone` or `none`. Skills default to `one_enemy`, items to `one_ally`."
  sfx: "The sound effect played when it is used."
  speed: "A bonus added to the user's speed for turn order, as an expression. By default nothing is added."
  where: "A list of where it can be used: `battle`, `menu`. Items default to both, skills to `battle`."
VoiceStyle:
  _: "How the voices of lines play."
  cut: "Whether the next line stops a voice still playing. The default is true; false lets it finish."
  auto_wait: "Whether auto waits for a voice to end as well as for the text. The default is true."
