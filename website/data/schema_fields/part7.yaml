NovelWindow:
  _: "Where the novel message window stands, in fractions of the screen (schema_version 10); 0 keeps the default of each."
  x: "The window's left edge as a fraction of the screen's width; 0 centers it. It needs width."
  width: "The window's width as a fraction of the screen's width, from 0.3 to 1; 0 keeps it across the screen, or inside 104 pixels each side with ui.material."
  bottom: "The room left under the window and its buttons, as a fraction of the screen's height, up to 0.4; 0 leaves none, or 8 pixels with ui.material."
Troop:
  _: "A group of enemies met together in one battle."
  background: "The picture shown behind the battle."
  can_escape: "Whether the party may run away. The default is true."
  events: "Commands that run during the battle when their conditions hold."
  intro: "The line shown when the battle begins, instead of the default appearance message."
  level_scale: "Toughens the troop a little when the party is stronger than intended, for bosses."
  members: "The IDs of enemies in the troop. At least one is required."
  music: "The music played during the battle."
  name: "The troop's name."
  win_music: "The music played once after winning, taking precedence over the game's boss win music."
TroopEvent:
  _: "A battle event: commands run when a condition holds during a battle."
  do: "The commands to run."
  once: "Whether it fires only once per battle. The default is true."
  when: "The condition that triggers it."
TroopPick:
  _: "A troop that can be drawn, with its weight."
  troop: "An ID of troops."
  weight: "The relative chance of drawing this troop. The default is 1, and 0 or less counts as 1."
  when: "A condition for the troop to be eligible."
TitleMenu:
  _: "Schema 10: the title screen's menu."
  hide_disabled: "Leave out the entries that cannot be chosen now (Continue with no save, Gallery with nothing to show) instead of graying them. Off by default."
UIStyle:
  phone_background: "Game-wide phone page body color; default white (#ffffff), with no per-cue flag."
  phone_text: "Phone page body text color; default #1d1f24."
  phone_muted: "Phone page caption and secondary text color; default #808690."
  phone_accent: "Phone owner bubble and page control color; unset keeps #3d8bf2. A page color overrides its controls. Independent of ui.accent. Use the same color to match the game palette."
  title: "Schema 10: the title screen's menu. Omitted, every entry is shown and the ones that cannot be chosen are grayed."
  profile_book: "Schema 10: the character book's title and layout (list or grid). Omission keeps Characters as a list."
  material: Optional layered panel finish; omission retains classic windows.
  chrome: "Schema 10: colors and marks of the title bar and browser decoration of windowed planning surfaces and calls. Omission keeps the built-in light desktop look."
  tones: "Schema 10: fills of workspace entries with tone note or primary. Omission keeps the built-in colors."
  light: "Schema 10: paper palette of view.light surfaces. Omission keeps the built-in colors."
  stage_framing: "Per-picture static novel portrait framing, keyed by paths under assets/. Sets the source head anchor, displayed head height and top; preserves authored horizontal positions and clips off-screen content. Omitted pictures keep legacy framing. Needs schema version 8."
  hide_bar_on_choice: "Hide the buttons under the novel window (back, log, save and the rest) while a choice is shown; their keys still work. Off by default."
  quick_menu: "Schema 10: where the buttons of the novel window stand. Omitted, in a row at the screen's lower right as before, a window with its own band raised above them. below: in a band under the message window with its left and right edges, the window raised by the band. inside: in the window's lower edge, the window taller by the band. The captions of a call follow the same choice."
  choice_position: "Schema 10: where the novel window's choices stand. Omitted, at the window's right end as before; center, in the middle of the screen above the window."
  wheel_up: "Schema 10: what turning the mouse wheel up does in the novel window. Omitted, it rolls back one line when it can and opens the backlog otherwise; log always opens the backlog. Turning it down advances the line either way."
  novel_window: "Schema 10: where the novel message window stands, in fractions of the screen. Omitted, it keeps its place. The buttons of quick_menu below or inside follow it."
  battle_message: "The battle's message window: fit (as tall as the lines it shows, the default) or fixed (three lines tall)."
  battle_foe_names: "A plate under each foe that is not a boss: name (its name, the default), hp (its name and a bar of its HP) or none."
  hide_gold: "The kinds of place (field, dungeon, map, stage) where the windows of the money are not shown: the field's, with the play time, and the menu's. Omitted: shown everywhere."
  battle_ai_history: "Show the battle AI history button and enable B/PageUp, controller L1 and pointer activation. True when omitted. False hides the panel entry and the tactic explanation appended to action messages, without changing decisions or replay traces."
  _: "The colors and layout of the windows and message display."
  face_shape: "How faces are cut on planning screens: round (the default) or square, a rounded square. A screen view may choose its own; a video call always keeps round faces."
  bestiary: "Show Monsters, the monster book, in the title and field menu. Off by default; under `--dev` the menus show it anyway. Needs schema version 4."
  accent: "The accent color."
  backlog: "How many lines the backlog keeps. The default is 300."
  balloon: "The text height of speech balloons over people in a painted scene, as a fraction of the screen height, from 0.01 to 0.2. The default is 0.037; needs schema version 3."
  battle_fx: "How strong the battle effects are: shake, flash, number pop, hit stop, charge and finish."
  border: "The window border color."
  cursor: "The cursor color."
  field_notices: "Whether to show small notices on the field. The default is true."
  message: "The message window style: `box` (a framed box, the default) or `novel` (across the bottom like a visual novel)."
  name_tag: "The color of the speaker's name tag."
  rollback: "How many earlier events the player can roll back into, besides the one running, from 0 to 64. The default is 8, and 0 turns rolling back off; needs schema version 4."
  profiles: "Show Characters, the character book, in the title, the field menu and the novel bar. Off by default; under `--dev` the menus show it anyway."
  sfx_vary: "How much repeated sound effects vary in pitch and volume."
  shadow: "The text shadow color."
  stage_drop: "Per standing picture, how far to move it down as a fraction of the screen height, to even out heights. The default is 0."
  stage_scale: "Per standing picture, a size multiplier keyed by picture file. The default is 1."
  stage_puppets: "Let the novel stage draw the moving portrait (puppet) of an actor whose face the puppet has, in place of the face picture and in the same frame: it breathes, sways and blinks, the speaker's mouth moves, and faces fade. Off by default; needs schema version 8."
  talk_portrait: "Where the speaker's standing picture stands beside the `box` message window, to bring the speaker closer. The default is a picture as tall as the screen at the window's left end; needs schema version 3."
  text: "The text color."
  voice: "How voices play: `cut` and `auto_wait`. Needs schema version 4."
  window: "The window background color."
StageFraming:
  _: "Explicit head framing for one static novel portrait. Positions and sizes use fractions rather than pixels; requires schema version 8."
  head: "Required [center_x, top_y, height] in source-image fractions: x uses image width; y and height use image height. Values must be finite and within the image, with positive height and top_y + height at most 1."
  height: "Required displayed head height as a positive fraction of screen height, at most 1. stage_scale multiplies this height around the head anchor."
  top: "Head top as a fraction of screen height, from 0 to 1; defaults to 0. stage_drop adds a screen-height offset."
BreedCmd:
  _: "Two owned monster instances and a selection of their skills to pass on."
  parents: "Two distinct owned monster instance IDs."
  skills: "Distinct skills known by either parent, up to breeding.skill_slots."
BreedFamily:
  _: "A symmetric family combination whose child depends on the parents' ranks."
  parents: "Two IDs from monster_families, in either order."
  children: "Candidate enemy IDs; the highest rank no greater than the mean parent rank wins."
BreedPair:
  _: "A symmetric specific-species recipe, tried before family rules."
  parents: "Two enemy species IDs, in either order."
  child: "The resulting enemy species ID."
  min_level: "An optional higher minimum level for both parents."
  min_plus: "An optional minimum of the parents' combined plus values."
BreedStaging:
  _: "Rank thresholds for birth presentation; omitted values default to rare rank 4 and legendary rank 7."
  rare_rank: "The first child rank with a longer pause before reveal, a gold ring and a slower afterglow."
  legend_rank: "The first child rank with the longest pause, gold and blue-grey rings and a low sound."
BreedKeeper:
  _: "The ranch's greeting: the speaker's name and the line in the message window while the player chooses what to do. Both are translated by lang/<code>.yaml."
  name: "The speaker's name over the line; none when omitted."
  text: "The line shown; a neutral built-in line when omitted."
Breeding:
  _: "The monster breeding requirements and recipes."
  min_level: "The minimum level of each parent; at least one."
  skill_slots: "The maximum number of distinct parental skills the child may inherit."
  staging: "Rank thresholds for the rare and legendary birth effects."
  keeper: "Who greets the player in the ranch's message window. Omission shows a neutral line under no name."
  pairs: "Specific species recipes; these win over family rules."
  families: "Family recipes, used when no specific pair matches."
Recruit:
  admission: "reserve (default) permits overflow; party_only rejects when the active party is full, without creating an instance. Rechecked at acceptance, including after save/resume."
  _: "The chance and starting level for an enemy to join after victory."
  chance: "A probability greater than zero and at most one."
  class: "An optional class override; otherwise enemy.monster_class is used."
  level: "The recruited actor's starting level; one if omitted."
  bonus_item: "An item whose possession adds bonus to the chance."
  bonus_skill: "A skill known by an active member that adds bonus to the chance."
  bonus: "The additive chance granted by the item or skill."
ReserveSwap:
  _: "One reserve-to-party exchange."
  in: "The reserve actor instance ID to activate."
  out: "The active actor instance ID to put in reserve."
Usage:
  _: "What using an item or skill does: its targets, effects and presentation."
  anim: "The animation style: `slash`, `magic`, `heal`, `buff`, `debuff` or `none`."
  color: "The color that tints the effect."
  crit: "The critical-hit chance as an expression. The default is the battle's critical rate; use `0` for none."
  cutin: "Show the user's picture and name across the screen before the action, for big skills."
  effects: "What it does to each target, as a list of effects."
  fx: "The effect drawn on the targets, such as `slash`, `fire`, `heal` or `none`. The default depends on the element or `anim`."
  hit: "The chance to hit each target, as an expression. The default is 1."
  hits: "How many times it hits each target; for `random_enemy`, how many random foes it strikes. The default is 1."
  message: "The message shown when it is used."
  sacrifice: "The user falls after using it, as in blowing itself up."
  scope: "Who it targets: `one_enemy`, `all_enemies`, `random_enemy`, `one_ally`, `all_allies`, `self`, `dead_ally`, `all_dead_allies`, `everyone` or `none`. Skills default to `one_enemy`, items to `one_ally`."
  sfx: "The sound effect played when it is used."
  speed: "A bonus added to the user's speed for turn order, as an expression. By default nothing is added."
  where: "A list of where it can be used: `battle`, `menu`. Items default to both, skills to `battle`."
VoiceStyle:
  _: "How the voices of lines play."
  cut: "Whether the next line stops a voice still playing. The default is true; false lets it finish."
  auto_wait: "Whether auto waits for a voice to end as well as for the text. The default is true."
WebPage:
  _: "The page of a browser export as the sites a link to it is shared on show it (Open Graph and X cards)."
  url: "Where the page is published, an https:// address ending in /: the page's og:url and the start of its picture's address."
  description: "A sentence or two about the game, the page's description and the card's text."
  image: "The card's picture under assets/, a PNG or a JPEG of 1200x630 or more (smaller is warned of, GZN0121). gozen export copies it as it is beside the page as og-image with its extension; it needs url."

MaterialStyle:
  opacities: "Schema 10: opacity for one role of panel (base, card, control, chart, message for the novel message window and its band, choice for the novel window's choices), each in [0,1]. A role left out uses opacity. Higher is a deeper tint over the same finish."
  refraction: Additional glass edge displacement in logical pixels, from 0 to 32.
  wallpaper_strength: Strength of the procedural wallpaper color fields, from 0 to 1.
  _: Reusable frosted panel finish for planning and dialogue.
  kind: Mica uses at least 90 percent tint, acrylic at least 72 percent, glass uses authored opacity and edge refraction, opaque uses tint only.
  blur: Blur footprint in logical pixels, from 0 to 64.
  opacity: Tint strength from 0 to 1.
  border: Fine illuminated edge strength from 0 to 1.
  shadow: Soft outer shadow strength from 0 to 1.
  surfaces: Optional base, card, control and chart material kind overrides. An omitted chart override inherits base.
  wallpaper: Optional three colors for a cached soft gradient on light planning surfaces.

ChromeStyle:
  _: Title bar and browser decoration; unset colors keep the built-in look.
  bar: Title bar fill.
  text: Title, address and button marks.
  field: Browser tab and address field fill.
  frame: Outline of the window.
  buttons: "Decorative window buttons as text. Empty hides them; omission keeps the minimize, maximize and close marks."
  nav: "Browser back and forward marks as text. Empty hides them."

ToneStyle:
  _: Fills of workspace entry tones; unset colors keep the built-in look.
  note: Fill of a note entry.
  primary: Fill of a primary entry on islands surfaces.
  primary_card: Card fill of a primary entry on workspace surfaces.
  primary_text: Label color of a primary entry on workspace surfaces.

LightStyle:
  _: Paper palette of view.light surfaces; unset colors keep the built-in look.
  paper: Background color of the whole screen behind the panels.
  window: Fill color of the panels and the authored controls.
  text: Color of the ordinary text on the panels.
  dim: Secondary text color.
  accent: Color of focused controls and highlighted values.
