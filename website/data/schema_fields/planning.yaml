  start: "Start of this calendar."
  end: "End of this calendar."
  phases: "Phases of this calendar."
  weekdays_off: "Weekdays off of this calendar."
  closed: "Closed of this calendar."
Activity:
  observation: "Displayed progress formula; self contains progress, effort and assignee. Refreshed by observe."
  dependency_ratio: "Fraction of each prerequisite needed before positive progress; omitted means 1."
  _: "Activity definition for deterministic planning simulations."
  name: "Name of this activity."
  effort: "Effort of this activity."
  assignee: "Assignee of this activity."
  after: "After of this activity."
  from: "From of this activity."
  to: "To of this activity."
Ledger:
  _: "Ledger definition for deterministic planning simulations."
  retain: "Retain of this ledger."
Reservation:
  _: "An event reservation dispatched once per matching date."
  id: "Stable reservation ID."
  date: "Date of this ledger."
  weekdays: "Weekdays of this ledger."
  phase: "Phase of this ledger."
  event: "Event of this ledger."
PlanCommand:
  rule: "Reusable rule ID for the rule operation."
  args: "Expressions bound to the rule parameters for this invocation."
  policy: "Policy ID for selecting one event from observations."
  _: "PlanCommand definition for deterministic planning simulations."
  op: "Op of this plancommand."
  entity: "Entity of this plancommand."
  tag: "Tag of this plancommand."
  where: "Where of this plancommand."
  attribute: "Attribute of this plancommand."
  value: "Value of this plancommand."
  activity: "Activity of this plancommand."
  ledger: "Ledger of this plancommand."
  period: "Period of this plancommand."
PlanRule:
  _: "A sequence of at most 256 immediate operations; nested rule calls are rejected."
  params: "Unique scalar argument names available as arg.NAME."
  do: "Operations evaluated in authored order, atomically."
PolicyRule:
  _: "An ordered policy candidate; the first matching candidate supplies its event."
  when: "Condition evaluated from visible entity and activity observations. Omitted means true."
  event: "Existing event to run through the ordinary interpreter."
PlanningView:
  tabs: "Two to five fullscreen screen IDs in the same order on every peer, including this screen. Bottom tabs or left/right replace the surface without consuming time or nesting screens."
  filter_label: Optional label for the unfiltered grouped timeline. Enables arrow buttons to cycle public residents from order and visible; clicking the portrait or name resets to all. Other lanes become faint without moving or changing state.
  rows: Optional grouped timeline rows. The calendar range stays fixed and oversized tables scroll by group.
  markers: Named date annotations on the grouped timeline calendar band.
  visible: Optional public boolean binding; only true residents are displayed and selectable. Missing values hide the resident.
  highlight: Optional public boolean binding that outlines ensemble tiles when exactly true. Missing or non-boolean values do not highlight; use a badge to explain the meaning.
  detail: Public text binding for the selected entity pane, shown alongside its assigned activities.
  fullscreen: Use the entire play surface with authored action bounds and contextual entity actions.
  header: Interpolated status text on the full-screen top strip.
  footer: Interpolated guidance text on the full-screen bottom strip.
  date_format: Go time layout for dates; the literal {weekday} is replaced using weekdays.
  week_start: First monthly calendar column, from 0 (Sunday, default) to 6 (Saturday). Weekday labels remain in Sunday-first order.
  weekdays: Seven weekday labels starting with Sunday; omitted uses English.
  phases: Display labels keyed by calendar phase IDs.
  event_label: Calendar count suffix; omitted uses events.
  icon: Fixed public portrait binding for video-off participants.
  _: Explicit player-facing columns, seating and observed image bindings for planning screens.
  order: Entity IDs in seat order; omitted order uses ascending IDs.
  fields: Player value columns; hidden attributes are rejected.
  portrait: Public value containing a portrait asset path.
  camera: Public boolean value controlling participant video.
  badge: Public value shown instead of a face at an unoccupied seat.
  backdrop: Public value containing a participant background asset path.
  mask: Public boolean value selecting coarse background masking.
  door: Authored label on the island view's door.
PlanningField:
  _: A labeled public value with an optional numeric gauge.
  key: Attribute or observation name; hidden attributes are rejected. Schema-10 plain portrait lists also accept a text template; missing or hidden resolved values are omitted.
  label: The authored label displayed above this public value column; plain portrait lists support interpolation.
  maximum: Positive gauge maximum, or zero for text only.
  marks: Threshold positions in gauge units.
TimelineRow:
  _: A named timeline group in display order, with one compact lane per item.
  label: Group heading. Long text is truncated at a readable font size.
  text: Optional interpolated summary replacing the lane-label line; truncated at 15 logical pixels without changing row or bar positions.
  items: Activity lanes in display order. Activities omitted from all rows appear in fallback rows.
TimelineItem:
  args: "Schema 10: pure expressions binding the destination screen parameters when the lane is opened."
  text: Optional interpolated explanation below the public assignment and report summary in expanded rows. Reserves an extra 20 logical pixels per lane and uses 15-pixel text; overflow is truncated. Also included in the activity description.
  sample: Optional saved observation ratio expression (0 to 1). Negative, missing or invalid values hide the marker; never implicitly reads live progress.
  forecast_label: Optional explanatory label enabling a linear finish forecast from reported work and elapsed calendar days. Empty disables it; zero reports, completed and excluded work have no forecast.
  sample_freshness: "Pure expression from 0 (old) to 1 (fresh), blending between dim and text colors without hiding the saved marker. Values are clamped; errors and non-numeric or non-finite values use 0. Omission uses 1. Authors choose the aging interval and explain age in sample_label."
  sample_label: Text template describing the saved observation, such as its date and source, shown with its percentage in the footer.
  _: An activity lane rendered from its reported observation, never its hidden progress.
  activity: Existing planning activity ID; each activity may appear only once in the view.
  label: Short lane identifier shown below the group heading.
  screen: Optional authored screen to open when the lane is clicked or confirmed.
TimelineMarker:
  args: "Schema 10: pure expressions for every destination screen parameter, evaluated at click time. Same-date links must have identical arguments."
  _: A named date annotation independent of scheduling rules.
  date: ISO date; annotations outside the calendar range are not drawn.
  label: Text shown when pointing at that date in the calendar band. May be omitted for a screen-only link, which adds no annotation tick or calendar label.
  milestone: Draw a dashed vertical line through the timeline rows.
  screen: Optional authored screen to open when clicking this date in the timeline band or month calendar. Markers on the same date must use the same destination. Browsing does not advance time.

IDRef:
  _: "A literal ID or an explicit pure expression resolving to an existing typed target."
  expr: "Schema 10: a pure expression returning an entity or activity ID for the owning plan field. Empty and unknown IDs are rejected before mutation."
