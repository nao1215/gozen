Command:
  respond: "Submit text to a speaker reaction book; the reply uses the ordinary dialog flow."
  _: "One step of an event. Each command has a single main key (the verb) and may carry extra keys that only that verb understands."
  end_turn: "Ends the campaign's turn: the other factions follow their rules and the next turn begins. Needs schema version 5."
  act: "Queues one move for the next auto battle: who acts, the skill or item, and the target."
  game_over: "Ends the game lost, as a lost battle does. Needs schema version 5."
  affect: "Puts a state on party members or removes one outside battle."
  at: "With `move` or `dive`, where to arrive: a map character of a dungeon, a point of a map or a spot of a stage."
  battle: "Starts a battle against a troop, an ID of troops."
  buy: "Buys items from a shop, the same as the Buy screen: the shop, the item and the count."
  call: "Runs another event, an ID of events, then continues."
  choice: "Asks the player to pick one of several answers. Each answer has its own commands."
  clear: "If true, ends the game as cleared."
  dive: "Starts a dive into a generated dungeon, an ID of locations whose dungeon has `generate`. `floor` chooses the floor."
  effect: "Plays a visual effect: `shake`, `flash` or `fade` of the screen, or a reaction of a moving portrait (`hop`, `shrink`, `nod`, `tilt`, `freeze` or one its file names; version 4). A map (version 4) adds `who`, `seconds`, `color` and `hold`."
  else: "With `if`, the commands that run when the condition does not hold."
  end: "If true, stops the event here."
  equip: "Equips an item from the bag on a party member. Leaving out `item` empties the slot, and leaving out both equips the best gear."
  equip_stones: "Puts the stones of a stone set on an actor's stone slots, taking them from the bag or from members not using them."
  exp: "An expression for the experience each living party member gains."
  facing: "With `move` or `dive` into a dungeon, the way to face on arrival."
  fighters: "With `battle`, the actors who fight instead of the whole party, for a duel."
  floor: "With `dive`, an expression for the floor to dive to. Default 1."
  give: "Adds an item to the bag: the item ID and a count (default 1)."
  gold: "An expression for gold to add. A negative value takes gold away."
  heal: "Fully restores a party member, an ID of actors, or everyone with `all`."
  hurt: "Takes HP from party members outside battle, for example on a poison floor. It never reduces anyone below 1."
  id: "The name of a choice: the state remembers the option taken there, read as `chose.<id>` (the option's `id`, or its number from 0). Lowercase letters, digits and `_`, one per game; needs schema version 4."
  if: "An expression. The `then` commands run when it holds, otherwise the `else` commands."
  image: "Shows a full-screen picture. It can be a file path or a map with options."
  join: "Adds an actor to the party, an ID of actors."
  learn: "Teaches a party member a skill: the actor and the skill."
  leave: "Removes an actor from the party, an ID of actors."
  mood: "Switches the music to a named mood."
  move: "Moves the party to another location, an ID of locations."
  music: "Plays a song, optionally in a given mood. Written as `song`, `song/mood` or a map."
  notice: "Shows a short notice at the top of the screen without stopping the event."
  on_escape: "With `battle`, the commands that run when the party escapes."
  on_lose: "With `battle`, the commands that run when the party loses."
  on_win: "With `battle`, the commands that run when the party wins."
  open: "Opens a game screen by name."
  order: "Gives an order of the campaign: its ID, or a map of the ID, the general and the target region. The general and the target it needs are asked when not given. Needs schema version 5."
  open_wall: "Turns the wall next to the party's cell in a dungeon into the tile of the given map character, such as a hidden stair."
  pick: "Picks an item of the current location's menu (a person, action or exit) by its label."
  prompt: "A line of text shown above the answers of a choice or stone selection."
  reset_tree: "Gives back the SP spent in the skill tree of an actor, an ID of actors, or of everyone with `all`."
  retry: "With `battle`, set to false to skip the offer to retry after losing."
  recover: "With `battle`, defaults to true. False preserves final HP after defeat, independently of retry. Outcome branches can read last_battle for participant IDs and HP before recovery."
  save: "If true, opens the save screen."
  say: "Shows a line of dialog. It can be plain text or a map with speaker, face, side and text."
  sell: "Sells items to a shop, the same as the Sell screen: the shop, the item and the count."
  set: "Assigns values to variables or state, mapping each name to an expression."
  sfx: "Plays a sound effect by name. A map (version 4) with `wait: true` holds the event until the sound ends."
  shop: "Opens a shop, an ID of shops."
  sp_apply: "Spends the SP according to the plan made by `sp_suggest`, for all members at once."
  sp_decline: "Remembers that the player declined, so `sp_suggest` does not offer again until a member's SP changes."
  sp_suggest: "Plans how to spend each member's spare SP automatically and stores the plan in variables with the given name prefix. It does not spend anything."
  stand: "Brings a portrait onto the stage of the novel window or takes it off: `none`, or a map with `who`, `face`, `at`, `enter` or `leave`. An event that uses it places its portraits only as written; needs schema version 4."
  step: "Walks the given number of steps forward in a dungeon. Floor traps and battles happen on every step."
  stone_apply: "Re-equips everyone's stones at once with the best arrangement found by `stone_suggest`."
  stone_choose: "Lets the player choose one of the possible stone combinations."
  stone_decline: "Remembers that the player declined, so `stone_suggest` does not offer again until the owned stones change."
  stone_suggest: "Finds the strongest way to equip all owned stones and stores the changes in variables with the given name prefix when it beats the current setup."
  stone_wearer: "Lets the player choose who wears the stones."
  take: "Removes an item from the bag: the item ID and a count (default 1)."
  target: "With `use`, the party member who receives the item. The first member when omitted."
  then: "With `if`, the commands that run when the condition holds."
  turn: "Turns in a dungeon: `left`, `right` or `back`."
  capture: "Recruits a non-boss species with recruit settings under its admission policy. Sets var.capture_result to party, reserve, party_full or unavailable. Needs schema version 6."
  reserve: "Swaps one joined reserve actor into an active party slot. Needs schema version 6."
  release: "Permanently releases one owned monster instance. Needs schema version 6."
  breed: "Breeds two owned monster instances and chooses inherited skills. Needs schema version 6."
  use: "Uses an item from the menu, an ID of items."
  wait: "Pauses for the given number of seconds. A map (version 4) with `skip: false` holds even in skip mode."
  walk: "Walks the shortest path in a dungeon to the tile of the given map character."
DataFile:
  _: "A file under data/. It can hold any of these sections, and the sections from all files are merged."
  actors: "Characters, keyed by actor ID."
  ai: "Named sets of battle AI rules, keyed by AI ID."
  factions: "The sides of a campaign, keyed by faction ID. Needs schema version 5."
  regions: "The regions of a campaign, keyed by region ID. Needs schema version 5."
  classes: "Character classes, keyed by class ID."
  elements: "Damage elements, mapping each element ID to its display name."
  enemies: "Enemy definitions, keyed by enemy ID."
  events: "Reusable sequences of commands, keyed by event ID."
  fusions: "Recipes that combine items into another item."
  breeding: "Monster breeding requirements, species pairs and family rules. Needs schema version 6."
  monster_families: "Monster family IDs and their display names. Needs schema version 6."
  items: "Items, equipment and key items, keyed by item ID."
  locations: "Places the party can be, keyed by location ID."
  music: "The songs and the rules that choose the mood."
  profiles: "Pages of the character book (the Characters screen), keyed by profile ID; a profile whose ID is an actor's shows that actor."
  shops: "Shops, keyed by shop ID."
  skills: "Skills, keyed by skill ID."
  states: "Status conditions such as poison or buffs, keyed by state ID."
  stone_sets: "Named combinations of stones that give a bonus, keyed by set ID."
  tactic_actions: "Actions the player can choose in tactics, keyed by ID."
  tactic_conditions: "Conditions the player can choose in tactics, keyed by ID."
  tactic_targets: "Targets the player can choose in tactics, keyed by ID."
  troops: "Enemy groups that appear in a battle, keyed by troop ID."
Doll:
  _: "How an actor or person looks as a small doll walking a stage. Needs schema version 3."
  face_at: "Where to cut the face for balloons from the picture: the middle, the top and the width, as fractions of the visible part. It is found automatically when omitted."
  hair: "The hair style: `short`, `long`, `bald` or `bun`. It is guessed from the picture when omitted."
  icon: "A square face picture drawn in balloons, cut round. It takes priority over `face_at`."
  parts: "Extra pieces the doll wears or carries, such as a cape or a staff."
DollPart:
  _: "A piece added to a doll."
  color: "The piece color as `#rrggbb`."
  kind: "The kind of piece: `apron`, `cape`, `robe`, `skirt`, `dress`, `coat`, `shield`, `staff`, `glasses`, `hat`, `hood`, `bag`, `goggles`, `muffler`, `shawl`, `ponytail` or `lashes`."
Drop:
  _: "An item an enemy may leave behind when defeated."
  chance: "The probability of the drop, from 0 to 1."
  item: "The item dropped, an ID of items."
  when: "An expression that must hold for the drop, for example depending on how the enemy was beaten."
Dungeon:
  space: "Optional aligned levels and stairs for bounded streets, interiors and atriums; excludes map, generate and roamers."
  _: "A maze walked in first person, drawn from a text map or generated on each dive."
  ceiling: "The ceiling color."
  ceiling_texture: "A picture tiled on the ceiling, one per cell, multiplied by the ceiling color."
  complete: "Commands that run once the whole floor has been explored (100 percent). They run once for each floor."
  darkness: "How fast the view darkens with distance, from 0 to 1. Default 0.5, and 0 means no darkening."
  depth: "How many cells ahead are drawn. Default 5."
  door: "The picture used for doors."
  floor: "The floor color."
  floor_texture: "A picture tiled on the floor, one per cell, multiplied by the floor color."
  generate: "Settings for making the map anew on each dive, with rooms, corridors and placed tiles, instead of a fixed `map`."
  looks: "Alternative appearances that replace the walls, colors and music while their `when` holds. The first match wins."
  map: "The map as rows of characters. Each character stands for a tile."
  no_map: "If true, the corner map is not shown."
  pictures: "Replacements for tile pictures, mapping an original file to a substitute."
  roamers: "Strong foes that walk the generated floor. Meeting one starts its battle, and once beaten it is gone."
  theme: "A theme of pictures and colors from assets/dungeon/themes/, such as `cave`. It fills the walls, door, floor, ceiling and their colors that are not written here. Add one to the game with `gozen theme add`."
  tiles: "The meaning of each map character, keyed by that character."
  walked: "Commands that run on arriving at the start of a fully explored floor, for example offering to jump to the down stairs."
  wall: "The picture used for walls."
DungeonLook:
  _: "Another appearance of a dungeon that applies while its condition holds. Anything left out stays as the dungeon says."
  area: "A name shown in place of the location's area, such as the district name."
  battle_background: "The battle background used while this look applies."
  battle_music: "The song for ordinary battles while this look applies."
  ceiling: "The ceiling color for this look."
  ceiling_texture: "The ceiling picture for this look."
  darkness: "How fast the view darkens with distance for this look, from 0 to 1."
  door: "The door picture for this look."
  floor: "The floor color for this look."
  floor_texture: "The floor picture for this look."
  music: "The song while this look applies. The location's song is used when omitted."
  no_map: "If true, the corner map is hidden while this look applies, for example on a dark floor."
  pictures: "Tile picture replacements while this look applies, layered on the dungeon's own."
  theme: "A theme for this look. It fills the walls, door, floor, ceiling and colors that the look does not write itself, in place of the dungeon's theme."
  wall: "The wall picture for this look."
  when: "An expression that decides when this look applies."
Effect:
  _: "One thing a skill or item does to each target, such as dealing damage, healing or adding a state."
  add_state: "A state to add to the target, an ID of states."
  chance: "An expression for the chance that the effect happens."
  damage: "An expression for the damage dealt, with `a` as the user and `b` as the target."
  drain: "The fraction of the damage dealt that the user gains back, as HP or MP following `stat`."
  element: "The element of the damage, an ID of elements."
  escape: "If true, the party runs away from the battle."
  heal: "An expression for the amount healed."
  message: "The line shown in the battle log when the effect happens."
  on_user: "If true, the effect lands on the user instead of the target, so what is taken from the target goes to the user."
  quiet: "If true, no message is shown, only the light and numbers. Nothing is shown when the heal is 0."
  recoil: "The fraction of the damage dealt that the user loses, never below 1 HP."
  remove_state: "A state to remove, an ID of states, or `bad` for every bad state."
  revive: "An expression for the HP a fallen ally comes back with."
  stat: "The stat the effect changes, `hp` (the default) or `mp`."
  summon: "An enemy to call into the battle on the foes' side, an ID of enemies. Only an enemy user summons."
  transform: "The enemy ID that replaces a living enemy target in its existing battle slot. Needs schema version 7."
  transform_hp: "New HP: `ratio` (default), `full`, or an expression evaluated before the form changes."
  transform_clear: "Clear states and guard on transformation. By default they remain."
  merge: "Combine living enemy allies into one form, with `into`, `from`, `count` and `hp`. Needs schema version 7."
  summon_max: "The most foes that may stand in the battle at once, counting every living foe. Default 5."
  turns: "An expression for how many turns an added state lasts. The state's own `turns` is used when omitted."
  variance: "The spread of damage and healing for this effect, where 0.1 means plus or minus 10 percent. The battle default applies when omitted."
  when: "An expression that must hold for the effect to apply, with `a` and `b` in scope."
EffectCue:
  _: "A visual effect, written as a word or a map (the map needs schema version 4)."
  name: "The effect: `shake`, `flash`, `fade`, or a reaction of a moving portrait."
  who: "With `shake`, the actor (or the name of a speaker stood with a picture) whose portrait shakes instead of the screen; with a reaction, the actor who plays it. The default is the last speaker."
  seconds: "How long the effect takes. The default is the effect's own."
  color: "With `fade`, the color the screen goes to. The default is black."
  hold: "With `fade`, how many seconds the screen stays on the color."
Defeat:
  _: "What becomes of a general beaten to no troops."
  out: "The turns the general is away for (0: stays, and only needs troops again)."
