Put:
  _: "A character placed on a generated floor, such as stairs, a chest or an event tile."
  at: "Place it at this map cell as `[x, y]` counted from the top left. The cell is opened and joined to the rest of the floor."
  char: "The map character to place; it must be one of the dungeon's tiles."
  count: "How many to place, as an expression of the floor number. The default is 1."
  far: "Place it as far from the start as possible, as for stairs down."
  near: "Place it on the open cell beside a character placed earlier, such as a guard in front of the stairs. Nothing is placed if no suitable cell exists."
  steps: "Place it about this many walked steps from the start, so the party meets it on the way."
  wall: "Place it in a wall cell beside exactly one open cell, preferring dead ends, for stairs drawn on a wall or a door."
Require:
  _: "A prerequisite of a skill-tree node: another node that must reach a level first."
  level: "The level the required node must have reached. The default is 1."
  node: "The ID of the skill-tree node that must be raised first."
Road:
  _: "A road joining two points of a map, usable in both directions."
  between: "The two point IDs the road connects."
  do: "Commands to run when the party travels along the road."
  encounters: "Random encounters that can happen while travelling the road."
  steps: "How many steps the trip takes. The default is 1."
  via: "The map coordinates `[x, y]` the road bends at on its way, in order."
  when: "A condition that must hold for the road to be open."
Roamer:
  _: "A strong foe that walks a generated dungeon floor and fights the party on contact."
  appear: "A condition for it to show up. When set, it is not placed at the start but appears on the farthest floor cell once the condition holds, and disappears when it stops holding. Do not combine with `count`."
  count: "How many are on a floor, as an expression of the floor number. The default is 1."
  every: "How many steps the player walks for each step it takes, as an expression of the floor. The default is 1."
  far: "The minimum number of steps from the floor's start where it may be placed. The default is 6 or three fifths of the floor's farthest distance, whichever is larger, or 0 for roamers that use `appear`."
  icon: "A small picture shown on the map, and in the view when `picture` is not set. Without it the map shows a dot in the `mark` color."
  mark: "The color of its dot on the map."
  meet: "Commands run when the party touches it, used instead of the battle in `troops`. It then leaves the floor."
  move: "How it moves: `chase` (comes after the party once it sees it), `wander` (random steps), `guard` (stays put) or `hunt` (always approaches by the shortest way)."
  name: "The name shown when it is in front of the party."
  on_appear: "Commands run when it appears because its `appear` condition became true."
  on_leave: "Commands run when it disappears because its `appear` condition stopped holding."
  picture: "The picture of it standing in its cell."
  sight: "How many cells away it notices the party when chasing. The default is 4."
  size: "The picture's height, where a wall is 1. The default is 0.8."
  troops: "The battle it starts, drawn by weight from the troops whose `when` holds."
  wait: "How many steps after arriving on a floor (or after a meeting) before it shows up, as an expression of the floor. The default is 0."
Rule:
  _: "One rule of a battler's AI: when it holds, the battler may use a skill or item on a target."
  chance: "An expression for a random draw; the rule is skipped unless the draw passes."
  item: "An ID of items from the party's bag to use instead of a skill. Only party members can use items."
  once: "Use this rule at most once per battle."
  priority: "Among the rules that hold, only those with the highest priority are kept. Higher wins."
  say: "A line shown before the action."
  target: "How to pick the target, as a preset name or a map with `side`, `where`, `pick` and `by`."
  use: "An ID of skills to use."
  weight: "The weight when one of the top-priority rules is drawn at random. The default is 1."
  when: "A condition for the rule, with `self`, `allies`, `foes`, `turn`, `flag` and `var` available."
Say:
  _: "A line of dialogue, written as a plain string or as a map with the speaker, face and text."
  who: "Who speaks: an actor ID, or any name to show."
  face: "A face of the speaking actor (the actor's own face when left out), or for a speaker who is not an actor, a picture path under `assets/`."
  text: "The line. A line may be written as just this text."
  side: "`left` or `right`, where the speaker stands. The default is `left` for an actor and `right` for any other speaker."
  instead: "In battle, replacement lines by other actors, said when `who` is down: the first speaker not down says theirs. Not used outside battle."
  voice: "The line's voice: for an actor with `voices`, a name in that folder (the `.ogg` or `.wav` may be left out); for anyone else, a path under `assets/`. Needs schema version 4."
ScaleMark:
  _: "A person's pixel height measured with the feet at a given point, used to scale dolls in a stage."
  at: "The feet position as `[x, y]` in background pixels."
  height: "The person's height in pixels when standing at `at`."
SceneReviewCfg:
  _: "Settings for the scene-review tool that lets authors tag recollection scenes."
  groups: "The order of the group headings. Headings not listed come after, in the order they appear."
  tags: "The tags a reviewer can put on a scene, each with an ID, a label and whether it counts as OK."
  title: "The name of the review section. It defaults to a translatable built-in title."
Screen:
  _: "The logical screen size the game is drawn at."
  height: "The logical screen height in pixels."
  width: "The logical screen width in pixels."
SfxVary:
  _: "How much the pitch and volume of a sound effect vary when it plays repeatedly in a short time."
  pitch: "The pitch variation as a fraction. The default is 0.03 (plus or minus 3%); 0 turns it off."
  volume: "The volume variation as a fraction. The default is 0.1 (plus or minus 10%); 0 turns it off."
Shop:
  _: "A shop selling a list of goods."
  goods: "The IDs of items the shop sells."
  greeting: "The line the shopkeeper says on entering."
  keeper: "The picture of the shopkeeper."
  name: "The shop's name."
  sell: "Whether the party can sell items here. The default is true."
  spent: "A `var.<name>` to which every purchase here adds its price. Several shops may share one. Empty means not counted."
Skill:
  _: "An action a character can use in battle or from the menu."
  anim: "The animation style: `slash`, `magic`, `heal`, `buff`, `debuff` or `none`."
  color: "The color that tints the skill's effect."
  crit: "The critical-hit chance as an expression. The default is the battle's critical rate; use `0` for none."
  cutin: "Show the user's picture and the skill name across the screen before the action, for big skills."
  desc: "A description shown to the player."
  effects: "What the skill does to each target, as a list of effects."
  fx: "The effect drawn on the targets, such as `slash`, `fire`, `heal` or `none`. The default depends on the element or `anim`."
  hit: "The chance to hit each target, as an expression. The default is 1."
  hits: "How many times the skill hits."
  message: "The message shown when the skill is used."
  mp: "The MP the skill costs."
  name: "The skill's name."
  sacrifice: "The user falls after using it, as in blowing itself up."
  scope: "Who it targets, such as `one_enemy`, `all_allies` or `self`."
  sfx: "The sound effect played when it is used."
  speed: "A bonus added to the user's speed when deciding turn order, as an expression."
  where: "Where it can be used: `battle`, `menu`, or both. The default is battle."
Slot:
  _: "An equipment slot such as weapon or armor."
  id: "The slot's ID, which items refer to in their `slot`."
  manual: "Leave this slot alone for the menu's best-equipment and recommendation features, for gear that cannot be compared by total stats."
  name: "The name shown in the equipment menu."
Song:
  _: "A piece of music, either a single track file or a modular song with one module per mood."
  bpm: "The tempo in beats per minute, for a modular song."
  dir: "The directory holding the modules of a modular song."
  file: "The audio file of a track song, played whole."
  loop_start: "The time in seconds the track loops back to."
  moods: "For a modular song, a map from mood name to its module file name, without `.ogg`, in `dir`."
  name: "The display name of the song."
Spot:
  _: "A named place to stand in a stage."
  at: "The feet position as `[x, y]` in background pixels."
  do: "Commands run when the party steps on the spot. A spot with `do` also appears as an entry in the location's menu."
  facing: "The direction the party faces when standing here."
  name: "The label of the spot's menu entry, used when it has `do`."
  once: "Run `do` only the first time."
  start: "Stand here when arriving without a named spot."
Stage:
  walk_speed: "Player walking speed in meters per second, shared by keyboard and click-to-walk. Omitted or 0 means 1.6; otherwise 0.1 to 6.4, finite. NPC speeds are independent."
  _: "A location shown as a painted background seen from a fixed camera, with people as small dolls walking in it."
  blocks: "Polygons where feet may not go, cut out of the walkable area."
  camera: "How many degrees the camera looks down, used to draw the dolls. The default is 30."
  depth: "A 16-bit gray picture of how near each background pixel is, as large as the background. Without it only `fronts` hide people."
  depth_bias: "How much nearer, from 0 to 1, the picture must be than the feet to hide them."
  exits: "Areas that leave the location when walked into, each tied to one of the location's exits."
  fronts: "Parts of the painting that stand up from the ground, such as pillars, hiding people behind them."
  people: "Where the location's people stand or walk in the stage."
  scale: "Person heights in pixels at two or more feet positions, defining how dolls scale with distance."
  spots: "Named places to stand, keyed by ID."
  things: "Things in the stage to look at, or location actions given a place."
  walk: "Polygons where feet may go."
StageExit:
  _: "Gives one of the location's exits an area of the stage; walking into it leaves."
  area: "The polygon of the exit area."
  to: "The ID of the exit in the location's `exits` that this area triggers."
StagePerson:
  _: "Places one of the location's people in the stage."
  at: "Where the person stands, as `[x, y]`."
  doll: "How the person looks as a small box doll: hair, extra parts and face cut."
  facing: "The direction the person faces."
  id: "The ID of the person in the location's `people`."
  path: "A loop of points the person walks, used instead of `at`."
  speed: "Walking speed along the path in meters per second. The default is 1.1."
Start:
  _: "The state a new game begins in."
  event: "An ID of events run when the game starts."
  gold: "The starting money."
  items: "The starting items, as a map from item ID to count."
  location: "An ID of locations where the party starts."
  party: "The IDs of actors who start in the party."
SFXCue:
  _: "A sound effect, written as its name or a map (the map needs schema version 4)."
  name: "The name of the sound effect."
  wait: "Holds the event until the sound ends."
Stand:
  _: "A portrait brought onto the stage of the novel window or taken off; `none` takes everyone off. Needs schema version 4."
  who: "The actor, or the name of a speaker whose picture is `face`."
  face: "A face of the actor, or a picture path for anyone else. The default is the actor's face."
  at: "Where it stands: `left`, `center`, `right` or a fraction of the screen's width. The default is the center."
  enter: "How it comes in: `fade` (the default) or `slide`."
  leave: "Takes it off: `fade` or `slide`."
WaitCue:
  _: "A pause, written as seconds or a map (the map needs schema version 4)."
  seconds: "How many seconds to wait."
  skip: "Whether skip mode passes the wait. The default is true."
Region:
  _: "A region of a campaign: its neighbours, its first owner and garrison, and its own numbers."
  defend: "The troop a general fights on marching here with an order of fight: battle, and whose members hold it, sharing its garrison, in a clash shown as units. An ID of troops."
  terrain: "The kind of ground (field, town, castle or any word): the background of a clash shown as units (clash.backgrounds)."
  name: "The name shown. The ID when omitted."
  next: "The regions it borders. A border is written on both regions unless one_way."
  one_way: "If true, next may name regions that do not name this one back."
  owner: "The faction holding it at the start, an ID of factions. Omitted for a free region."
  troops: "The garrison at the start."
  values: "The region's own numbers at the start (such as wealth), read and set as region.<id>.<name>."
  area: "The region's shape on the campaign map's picture, its pixels as [[x, y], ...] (three points or more): the map fills it in the owner's colour and draws its border, and a click inside chooses it. Areas may share borders but not overlap. Without it the region shows as its point's flag."
  landmark: "A picture under assets/ (cut out) the campaign map stands on the region's point: its city, fortress or village, with the owner's flag beside it; darkened with smoke while the region was fought over this turn or the last."
  landmark_scale: "The landmark's width as a share of the map picture's, 0 to 1. Default 0.12."
  landmark_ground: "How much the map settles the landmark onto the terrain (foot shadow, faded bottom edge, colours eased toward the ground), 0 to 1. Default 1."
