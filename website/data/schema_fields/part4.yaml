Generate:
  _: "How the floors of a dungeon are generated: maze size, rooms and the characters placed on each floor."
  floors: "Per-floor settings keyed by floor number: a seed for that floor or a hand-drawn map."
  height: "The height of the maze in cells. Use an odd number."
  loops: "The share of walls between corridors that are opened to make loops. The default is 0.08."
  place: "The other characters placed on the floor apart from the start, such as stairs and events."
  rooms: "How many rooms the maze has."
  seed: "The random seed of the map. When set, every save gets the same map; otherwise each save gets its own seed."
  size: "An expression of the floor number giving the side length of the maze on that floor, capped by `width` and `height` and at least 9. It makes early floors smaller."
  start: "The map character the party arrives at."
  width: "The width of the maze in cells. Use an odd number."
Grant:
  _: "A state that is given with a chance."
  chance: "An expression giving the probability that the state is given."
  state: "The ID of the state (an ID of states) to give."
Hurt:
  _: "A command that reduces a party member's HP outside battle."
  amount: "An expression giving the HP to remove, where `self` is the targeted member."
  who: "The party member to hurt, an actor ID, or `all`."
Item:
  _: "A thing the party carries: a consumable, a piece of equipment or a key item."
  color: "The color of the item's icon."
  command: "If `true`, an item with an `event` appears as an action at the top of the menu instead of in the item list. It shows only while `event_when` holds."
  consume: "Whether the item is used up when used. The default is `true`."
  desc: "The description shown for the item."
  element: "The element of the attack of a weapon."
  event: "The ID of the event (an ID of events) run when the item is used from the menu. The item is used up unless `consume` is `false`, and the menu closes. Required when `command` is `true`."
  event_when: "An expression that must hold for the item's event to be usable."
  kind: "The kind of item: `item`, `key`, or an equipment kind such as `sword` or `staff`."
  name: "The item's name."
  price: "The gold price in shops."
  short: "A short name used when items are listed together in suggestions. Defaults to `name`."
  slot: "The equipment slot the item goes into, for equipment."
  state_resist: "Chance multiplier by state while the item is equipped, as a map of state ID to number."
  states: "States that a weapon's attack may inflict, each with a chance."
  stats: "Stat bonuses the item gives when equipped."
  use: "What the item does when used, such as healing or damage to targets."
ItemCount:
  _: "An item and how many."
  count: "How many of the item. When omitted it is 1."
  item: "The ID of the item (an ID of items)."
Learn:
  _: "A command that teaches an actor a skill."
  actor: "The ID of the actor (an ID of actors) who learns the skill."
  skill: "The ID of the skill (an ID of skills) to learn."
Learning:
  _: "A skill that is learned at a certain level."
  level: "The level at which the skill is learned."
  skill: "The ID of the skill (an ID of skills) learned."
LevelScale:
  _: "Makes a troop tougher when the party's average level (rounded down) is above `level`. Past the cap, further levels make the battle easier again."
  level: "The level the battle is meant for."
  max: "The cap of the growth, for example 0.25 for at most 25 percent more."
  rate: "The growth per level above `level`, for example 0.05 for 5 percent."
  stats: "The stats that grow. By default `mhp`, `atk` and `mat`."
  unbounded: "If `true`, lifts the limit that bosses have on `max` so the foe keeps following the party's level further."
Location:
  _: "A place the party can be: a picture with people to talk to, things to do and ways out."
  actions: "Things the party can do here, shown as menu entries."
  area: "The name of the wider area this location belongs to."
  background: "The picture shown behind the location."
  battle_background: "The picture shown behind battles fought here."
  battle_music: "The song and mood for ordinary battles here. A troop's own music takes priority."
  desc: "The description of the location."
  dungeon: "If set, the location is a maze walked in first person instead of a menu."
  encounters: "The random battles met here."
  exits: "The ways out to other locations."
  map: "If set, shows the location as a picture with points and roads (needs schema version 3)."
  music: "The song and mood played here."
  name: "The location's name."
  no_menu: "If `true`, the main menu (status, equipment, save and so on) cannot be opened here."
  on_enter: "Commands run each time the party enters the location."
  outfit: "Characters talking here wear this outfit variant of their pictures when one exists, such as a winter coat. Face icons keep the usual pictures."
  people: "The people here who can be talked to."
  resume_to: "The ID of the location (an ID of locations) to start from when a save made here is loaded. By default it resumes here."
  safe: "If `true`, saving is allowed here."
  stage: "If set, shows the location as its painted background seen from a fixed camera and walked by small dolls (needs schema version 3)."
  talk_on_enter: "If `true`, one of the people's stories plays on each entry instead of a list of people to talk to, with people who have something new first."
MapPoint:
  _: "A point on a map location."
  at: "The position of the point on the map picture."
  at_point: "When `to` is a map location, the point of that map to stand on."
  do: "Commands run on arriving at the point."
  label: "The name shown for the point. When empty, the name of `to` is used."
  locked: "The text shown when the point is chosen while it is closed."
  marker: "A picture used as this point's marker instead of the map's."
  once: "If `true`, `do` runs only the first time the point is reached."
  start: "If `true`, the party stands at this point on a first visit."
  to: "The ID of the location (an ID of locations) the point leads into."
  when: "An expression that must hold for the point to be open. Roads through a closed point are closed too."
MemoCfg:
  _: "What a test player's note asks for and keeps."
  kinds: "The kinds of note the player can choose from."
  vars: "Numbers kept with each note, each given by an expression."
MemoKind:
  _: "A kind of test note."
  id: "The ID of the kind, kept in the note file."
  label: "The label shown for the kind."
MemoVar:
  _: "A number kept with each test note."
  name: "The name under which the number is kept."
  value: "An expression giving the number from the game state when the note is made."
Meter:
  _: "A gauge of a number, showing `value` out of `max` while `when` holds."
  actor: "The ID of the actor (an ID of actors) whose status page shows the meter. When empty, it shows on every page."
  color: "The color of the bar."
  full: "The text written after the bar when it is full."
  full_color: "The color the bar takes when it is full."
  label: "The name shown beside the gauge."
  marks: "Values marked on the bar, for example where something becomes possible."
  max: "The maximum of the gauge. The default is 100."
  max_value: "An expression giving a state-dependent maximum. When it evaluates, it overrides `max` and is rounded to at least 1, and the gauge shows current/maximum."
  value: "An expression giving the current value."
  when: "An expression that must hold for the meter to be shown."
MoodRule:
  _: "A rule choosing the music by the moment. The first rule that holds is used."
  mood: "The mood to play in the modular song currently playing."
  now: "If `true`, switches to the mood at once instead of waiting for the end of the module."
  play: "A song (a track or a modular song) to play instead. When no rule with `play` holds, the place's own song returns."
  song: "If set, the rule applies only while this song is playing."
  when: "An expression that must hold for the rule to apply."
Music:
  _: "The songs and the rules that choose the mood."
  bars: "The length of a module in bars. The default is 8."
  beats_per_bar: "The number of beats in a bar. The default is 4."
  mood_names: "Display names for moods, shown for one-shot songs in the gallery's music section. By default the mood ID is shown."
  one_shot: "The moods that play once instead of looping."
  rules: "Mood rules by context (such as `field` or `battle`), each a list of rules."
  songs: "The modular songs, keyed by song ID."
  volume: "The overall music volume."
MusicCue:
  _: "A song and the mood it starts in, written as `song`, `song/mood`, or a map."
  song: "An ID of `songs` to play. Written alone as `song` or `song/mood`."
  mood: "The mood of a modular song to play, one of the song's `moods`."
  fade: "In the `music` command, the seconds the song fades in, or out with `stop`. Needs schema version 4."
  stop: "In the `music` command, stops the music (with no song or mood). Needs schema version 4."
Passive:
  _: "A state that is put on an actor at the start of a battle while a condition holds."
  actor: "The ID of the actor (an ID of actors) who gets the state."
  level: "An expression giving the tier shown on the skill tree screen. When omitted, it is not shown. Its name is hidden while `when` does not hold."
  state: "The ID of the state (an ID of states) that is applied."
  when: "An expression that must hold for the state to be applied."
Person:
  _: "Someone at a location who can be talked to."
  bubbles: "Lines said now and then in a balloon over the person's doll on a stage. They affect only the screen (needs schema version 3)."
  id: "The person's ID, used by a stage to place them. It must be unique among the location's people and actions."
  image: "A picture of the person, a path under assets/."
  mark: "An expression that, while it holds, puts a mark next to the person's name in the talk list. What the mark means is up to the game."
  name: "The person's name."
  new: "An expression that holds while talking would give a new story. It is not shown on screen and is a hint for the autoplayer."
  talk: "The commands run when the player talks to the person."
  when: "An expression that must hold for the person to be present."
Picture:
  _: "A picture under assets/, optionally tinted and darkened. Written as a path or as a map."
  file: "The picture under `assets/`. A picture may be written as just this path."
  tint: "A color the picture is tinted with, such as `\"#c0d0ff\"`."
  brightness: "Brightness of the picture; 1 (the default) is unchanged and 0 is black in schema version 1 and later."
  blur: "Draw the picture blurred."
Profile:
  _: "A page of the character book: who a character is, shown on the Characters screen once its when holds (ADR 0031)."
  actor: "The actor the profile shows; by default the actor of the same ID."
  enemy: "The enemy the profile shows, for a foe in the book."
  name: "The name shown; by default the actor's or the enemy's name."
  title: "A short epithet shown under the name. It may hold `{expressions}`."
  picture: "A standing picture under `assets/` for a character who is neither an actor nor an enemy."
  faces: "The faces the screen can switch between: names of the actor's faces or of its puppet's faces. By default the actor's face."
  when: "The condition that unlocks the profile. Without it the profile is always unlocked; a locked profile is a shadow named ???. Under `--dev` every profile is unlocked."
  fields: "Lines of label and value, such as Role or Likes; the labels are the game's own."
  text: "The introduction. It may hold `{expressions}`."
  relations: "How the character sees the others: whom, what they call them, and a note."
ProfileField:
  _: "A line of a profile: a label and its value."
  label: "The label, such as Role or Likes."
  value: "The value. It may hold `{expressions}`."
ProfileRelation:
  _: "How a profile's character sees another character."
  who: "The other character: a profile ID, an actor ID, or `you`."
  calls: "What the character calls them."
  text: "A note on how the character sees them."
Order:
  _: "One of the player's orders in a campaign. It costs actions, may need a general and a target region, and runs its do with them bound as general and target."
  cost: "The actions it takes. Default 1."
  do: "The commands run after the march (if any), with general and target bound."
  fight: "clash_view to decide the march by a clash of units shown on its own screen (the generals against the members of the target's defend troop, at most four a side), or battle to decide it by the game's battle: the general alone against the target's defend troop. A win takes the region with the share of the troops of the HP left; a loss leaves the clash's lost. Omitted: by the numbers of clash."
  generals: "How many generals may march together (1 when omitted). After the first, the order asks who else goes, until March now is chosen or all are taken."
  on_draw: "Commands run after a march whose rounds ran out (a clash shown as units), before do: a general's word on it."
  on_lose: "Commands run after a march that failed, before do."
  on_win: "Commands run after a march that took the region, before do."
  general: "Who leads it: ready (joined, has not marched this turn, has troops), any (joined), or omitted for none."
  label: "The text shown in the menu."
  march: "If true, the general's troops march on the target before do (see clash)."
  per_turn: "How many times a turn the order may be given when campaign.count is orders (1 when omitted)."
  target: "The region it is given: border (not the player's, next to one of the player's), own, any, or omitted for none."
  until_taken: "If true, the march may be given again and again in a turn until a region is taken (each general still marches once)."
  when: "An expression that must hold for the order to be listed."
  where: "An expression over t (a region) that narrows the target."
OrderCmd:
  _: "The order command: the ID of an order of the campaign, and the general and the target region when they are not to be asked."
  general: "The general who leads it, an ID of campaign.generals."
  id: "The ID of the order in campaign.orders."
  target: "The target region, an ID of regions."
  with: "The generals who march with general, IDs of campaign.generals (an order whose generals is above 1)."
  tactics: "The tactics of the generals marching, by general (IDs of campaign.clash.tactics); each general's own when missing."
