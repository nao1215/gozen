Space:
  materials: "Up to 32 named opaque materials for building walls and roofs."
  wall_regions: "Up to 128 non-overlapping rectangular wall material assignments."
  roofs: "Up to 32 bounded gable, shed or flat roof primitives with indexed collision and occlusion."
  free_move: "Opt in to continuous walking and turning on this stacked space. Omit to retain grid movement."
  step_ticks: "Camera interpolation duration for one step at 60 updates per second. Omitted or 0 means 18 ticks; otherwise 1 to 120."
  turn_ticks: "Camera interpolation duration for a turn at 60 updates per second. Omitted or 0 means 18 ticks; otherwise 1 to 120, independent of step_ticks."
  _: "A bounded stack of equal-sized maps (schema version 8). Blank cells are open air; levels are ordered bottom to top."
  sky: "Optional sky panorama: horizontal wrapping, zenith at the top and horizon at the bottom. Supports picture tint and brightness."
  levels: "One to eight equal rectangular maps, each 3 to 64 cells wide and high."
  stairs: "Up to 128 non-overlapping bidirectional straight runs joining adjacent levels."
SpaceStair:
  _: "A staircase from a lower cell to a landing on the next level."
  level: "One-based lower level; an upper level must exist."
  x: "Zero-based lower endpoint column."
  y: "Zero-based lower endpoint row."
  facing: "Ascending direction: north, east, south or west."
  length: "Horizontal distance to the upper endpoint, from 3 to 8 cells. Keep the space above the run empty."
SpaceFreeMove:
  _: "Fixed 60 Hz walking controller with a circular footprint, stair support and optional held-input speed stages."
  speed: "Base speed in cells per simulation second, in (0,12]. Omitted or zero selects 1.6."
  turn_speed: "Turning sensitivity in degrees per simulation second, in (0,360]. Omitted or zero selects 90. Independent of walking speed."
  acceleration: "Seconds to interpolate between stage targets, from 0 to 5. Omitted selects 0.12; explicit zero changes targets immediately. Release stops promptly."
  stages: "At most 16 speed stages in strictly increasing hold-time order. Omit for constant speed. Successful sliding counts; release, reversal, blockage, focus loss, blocking UI and placement reset the stage."
SpaceSpeedStage:
  _: "A walking speed target selected after uninterrupted successful movement."
  after: "Positive finite hold time in simulation seconds, at most 3600 and strictly greater than the previous stage."
  speed: "Absolute target speed in cells per simulation second, in (0,12]."
SpaceMaterial:
  _: "An opaque facade or roof material. Pictures are batched into 256-pixel atlas tiles."
  picture: "Optional image, tint and brightness; alpha is composited against white."
  color: "Optional opaque base color, multiplied by picture tint and brightness."
  width: "World units per horizontal image repetition, in [0.125,128]; omitted or zero selects 1."
  height: "World units per vertical image repetition, in [0.125,128]; omitted or zero selects 1."
  origin_u: "World-space horizontal texture origin, in [-128,128]."
  origin_v: "World-space vertical texture origin, in [-128,128]."
SpaceWallRegion:
  _: "A non-overlapping grid rectangle assigning wall materials on one level. Decoration never changes collision."
  level: "One-based existing grid level."
  x: "Zero-based left column."
  y: "Zero-based top row."
  width: "Positive integer width in cells, inside the map."
  depth: "Positive integer depth in cells, inside the map."
  material: "Default named material for all wall faces in this region."
  north: "Optional material override for outward north faces."
  east: "Optional material override for outward east faces."
  south: "Optional material override for outward south faces."
  west: "Optional material override for outward west faces."
SpaceRoof:
  _: "A closed nonwalkable roof primitive with actual sides and underside; at most 32 roofs."
  filled: "Fill down to a horizontal underside to close gable ends; default false retains constant vertical thickness."
  shape: "gable, shed or flat; other shapes are rejected."
  level: "One-based base level, including the top of the last authored story."
  x: "Continuous left bound including eaves, inside the map."
  y: "Continuous top bound including eaves, inside the map."
  width: "Footprint width from 0.125 to 64 cells and inside the map."
  depth: "Footprint depth from 0.125 to 64 cells and inside the map."
  base: "Additional height above the anchored level, from 0 to 1.5."
  rise: "Positive roof rise up to 2 world units; exactly zero for flat roofs."
  thickness: "Vertical thickness in [0.01,0.5]; a filled roof uses it below its base."
  facing: "Uphill cardinal direction; a gable also rises from the opposite edge."
  material: "Named top and side material; omitted uses tile color."
  underside: "Named underside material; omitted uses wood color."
