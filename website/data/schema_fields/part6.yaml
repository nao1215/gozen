State:
  _: "A condition a battler is in, such as poison, sleep or a buff."
  again: "The chance, as an expression, of attacking once more after a normal attack. It can repeat up to three times in a row."
  bad: "Mark it as a bad state, so cures such as `remove_state: bad` can remove it."
  color: "The color of the state's badge."
  counter: "The chance, as an expression, of striking back with the attack skill when hit by a single-target physical attack."
  cover: "A condition under which the one with the state takes single-target physical attacks aimed at an ally, such as `b.hp_rate < 0.5`."
  damage_rate: "A multiplier for the damage the holder takes; 0.5 halves it and 0 blocks it (schema version 0 reads 0 as 1). The default is 1. Rates of several states multiply."
  desc: "A description shown in the status menu."
  endure: "How many times per battle the holder survives a lethal hit with 1 HP, as an expression."
  fatal: "The state kills the target at once. The chance is the effect's chance times the resistances."
  messages: "Battle messages for this state."
  name: "The state's name."
  on_turn_end: "Effects applied to the holder at the end of each turn, such as poison damage."
  on_turn_end_allies: "Effects applied at the end of each turn to every standing ally of the holder, including the holder."
  persist: "The state stays after the battle ends."
  remove_on_damage: "The chance that taking a hit removes the state."
  restrict: "How it limits actions: `skip` loses the action, `confuse` makes it act randomly, empty means no limit."
  restrict_chance: "With `restrict: skip`, the chance of losing the action. 0 means always."
  short: "The short badge shown next to the HP bar."
  state_resist: "A map from state ID to a multiplier on the chance of that state landing on the holder; `0` blocks it."
  stats: "Multipliers applied to the holder's stats while the state lasts."
  stats_by: "Stat multipliers given as expressions, such as `atk: \"1 + 0.05 * var.n\"`, combined with `stats`."
  turns: "How many turns the state lasts. 0 means until cured."
StateMsgs:
  _: "The battle messages of a state. `{target}` is replaced with the affected name."
  add: "Shown when the state is added."
  counter: "Shown when the holder counterattacks. `{user}` is the attacker."
  cover: "Shown when the holder covers an ally. `{user}` is the ally covered."
  remove: "Shown when the state ends."
  stay: "Shown when the state stops an action."
StateName:
  _: "A declared state name (`var.NAME` or `flag.NAME`, written in full), with its type and starting value."
  initial: "The starting value as a literal, not an expression."
  type: "The value type of the name: `bool`, `number` or `string`. A `flag.` name must be `bool`."
StateNames:
  _: "Optional declarations of the `var.*` and `flag.*` names a game uses."
  names: "The declared names, each with a type and an initial value."
  strict: "Reject `flag.*` and `var.*` names that are neither declared here nor generated by the engine."
StoneSet:
  _: "A combination of magic stones worn together by one person that grants a skill and stats while all are worn."
  desc: "A description of the combination."
  family: "An ID that groups sets into one series regardless of display name. By default sets with the same name form one series."
  for: "The actors this combination suits, used as the default wearer for stone suggestions."
  name: "The combination's name."
  only: "The set only takes effect when worn by someone listed in `for`."
  pitch: "A line the stone shop says when recommending it. Write it on the first set of a series."
  skill: "An ID of skills the set grants."
  stats: "Stats added while the whole set is worn."
  stones: "The IDs of items (stones) that make up the set."
TacticAction:
  _: "An action an ally can pick in the tactics screen, together with its automatic target."
  item: "An ID of items to use for this action."
  name: "The label shown to the player."
  target: "An ID of tactic targets used to choose who it acts on."
  use: "An ID of skills to use for this action."
TacticCondition:
  _: "A condition the player can choose for a tactics row. The expressions stay author-only."
  chance: "An expression for a random draw that must pass for the rule. Only for `template`."
  kind: "The kind of condition: `always`, `template`, `hp_below`, `hp_at_most`, `mp_below`, `mp_at_most`, `state`, `not_state`, `alive` or `dead`. The `hp_` and `mp_` kinds use the row's percentage."
  name: "The label shown to the player."
  once: "The resulting rule fires at most once per battle. Only for `template`."
  priority: "The priority of the resulting rule. Higher wins. Only for `template`."
  say: "A line shown before the action. Only for `template`."
  state: "An ID of states the condition checks for. Needed by `state` and `not_state`, and allowed only there."
  subject: "What the condition looks at: `self`, `allies`, `foes`, or `target` to narrow down a single target. Needed by every kind except `always` and `template`."
  weight: "The weight of the resulting rule when drawn among equals. Only for `template`."
  when: "The expression that makes the condition hold. Needed by `template`, and allowed only there."
TacticPreset:
  _: "A ready-made set of tactics rows the author provides for allies."
  description: "A short description shown to the player."
  name: "The preset's name."
  rows: "A map from the name of an ally's AI to up to five tactics rows for it."
TacticRow:
  _: "One row of a simple tactics setting. It refers to catalog entries by ID rather than storing expressions."
  action: "An ID of the tactic action to perform."
  condition: "An ID of the tactic condition under which the row applies."
  enabled: "Whether the row is active. It is off by default."
  percent: "The threshold percentage, needed only by conditions that use one."
  target: "An ID of the tactic target to aim at. It defaults to the `target` of the action, and cannot be set under simple tactics."
TacticTarget:
  _: "A selectable target tying a scope to a way of choosing among candidates."
  name: "The label shown to the player."
  scope: "The target scope, as for a skill's `scope`. `self` may also be used with `one_ally`."
  selector: "How to pick the target, kept hidden from the editing side."
Target:
  _: "How an AI rule picks a skill's target: a preset name such as `weakest`, or a map with `side`, `where`, `pick` and `by`."
  preset: "A named target: random, self, weakest, strongest, lowest_hp, lowest_hp_rate, highest_hp, ally_lowest_hp_rate, ally_dead or first. Written alone as the name."
  side: "Which side to choose from, `allies` or `foes` of the one acting; by default it follows the scope of the action."
  where: "An expression each candidate must satisfy."
  pick: "How to choose among the candidates: `min` or `max` of `by`, `first`, or `random` (the default). `min` and `max` need `by`."
  by: "An expression measured on each candidate, compared by `pick`."
Terms:
  _: "The words the menus use for basic stats and money."
  currency: "The name of the money."
  exp: "The word for experience points."
  hp: "The word for hit points."
  level: "The word for level."
  mp: "The word for magic points."
Thing:
  _: "Something in a stage to look at, or a location action given a place."
  action: "An ID of one of the location's actions to run instead of `do`."
  area: "The polygon of the stage where the thing can be used."
  ask: "The word on its button. The default is the standard examine label."
  do: "Commands to run when it is used."
  id: "The thing's ID."
  name: "The name shown to the player."
  once: "Run it only the first time."
  trigger: "How it is set off: `examine` (the default) or `step`."
  when: "A condition for it to be available."
Tile:
  _: "What one character of a dungeon map is: a floor, wall or door, with an optional picture and behavior."
  after: "With `once`, the character this tile becomes after use, such as an opened chest."
  ask: "The answer that sets off a `look` tile (one that asks first), beside the answer that does nothing. The default is the standard examine label."
  away: "Turn a flat picture's top away from the party whichever way it looks."
  do: "Commands run when the tile is triggered."
  else: "The character the tile becomes while `when` does not hold. The default is `.`."
  facing: "The direction the party faces on arriving here."
  flat: "Lay the picture on the floor of the cell, seen in perspective, instead of standing it up."
  hint: "Text added after the name when the tile is in front of the party, telling what stepping on it does."
  look: "How it looks: `floor` (the default), `wall` or `door`."
  mark: "The color on the map. The default is none, a plain cell."
  name: "The name shown when it is in front of the party."
  once: "Trigger it only once."
  picture: "The picture standing in the cell, or on the wall for `look: wall`."
  question: "The question a trigger tile asks. The default is its name."
  size: "The picture's height, where a wall is 1. The default is 0.6."
  slide: "Carry the party onward from this cell: `north`, `east`, `south`, `west`, or `facing` for ice."
  solid: "An expression; the party cannot walk in while it holds."
  spin: "Turn the party when it stops here: `right`, `left`, `back` or `random`."
  start: "The party arrives here when a move gives no position."
  symbol: "A letter drawn over the mark on the map, such as an arrow for stairs."
  trigger: "How it is set off: `step` (stepped on), `bump` (walked into) or `look` (asks first). The default is `look` for a wall, `bump` for a solid tile and `step` otherwise."
  when: "The tile is present while this holds; otherwise it becomes the `else` character."
TalkPortrait:
  _: "Where the speaker's standing picture or moving portrait stands beside the `box` message window, in fractions of the screen. A height above 1 with the bottom below the screen shows only the upper body. The speaker on the right stands mirrored."
  bottom: "Where its bottom edge stands, as a fraction of the screen height, from 0 to 4. The default is 120 pixels below the screen."
  height: "Its height as a fraction of the screen height, from 0 to 4. The default is 1.02."
  x: "Its horizontal center as a fraction of the screen width, from 0 to 1; the right speaker stands at 1 minus it. The default is 230 pixels right of the window's left end."
TitleText:
  _: "How the title screen letters the title and the subtitle. Sizes are in the screen's pixels; tracking is the space between letters as a part of the size."
  color: "The color that fills the letters. The default is the `ui` text color."
  edge: "The color of the letters' outline. The default is the `ui` window color."
  size: "The title's letter size in pixels. The default is 96."
  subtitle_size: "The subtitle's letter size in pixels. The default is 30."
  subtitle_tracking: "The space between the subtitle's letters, as a part of its size. The default is 0.3."
  tracking: "The space between the title's letters, as a part of its size. The default is 0.12."
TitleFigure:
  _: "A picture standing on the title screen."
  bottom: "Where its feet are, as a fraction of the screen height. The default is 1, the bottom of the screen."
  file: "The picture file."
  height: "Its height as a fraction of the screen height. The default is 0.95."
  x: "Its horizontal center as a fraction of the screen width."
Token:
  _: "The piece standing for the party on a map. Write a map, or the word `doll`."
  picture: "The picture of the party on the map; the leader's face (or doll) when left out."
  height: "The height of the token, as a share of the screen's height."
  doll: "Show the leader's doll instead of the face. Written alone as the word `doll`."
Trade:
  _: "The contents of a buy or sell command."
  count: "How many items. The default is 1."
  item: "An ID of items to trade."
  shop: "An ID of shops to trade with."
TreeNode:
  _: "A node of a skill tree: a skill whose level is the SP put into it, or a passive bonus."
  col: "The column (tier) where it is drawn."
  desc: "A description. It defaults to the skill's."
  id: "The node's ID, which other nodes refer to in `requires`. It defaults to the ID of `skill`; a node without `skill` must give one."
  max: "The highest level of the node. The default is 10."
  name: "The node's name. It defaults to the skill's."
  requires: "Nodes that must be raised to given levels before this one opens."
  row: "The row where it is drawn."
  skill: "An ID of skills learned at level 1. Leave empty for a passive node."
  stats: "Stats added for each level of the node."
