# Japanese contract text of data/schema/types.schema.json (x-type, x-contract) mapped to English for the Schema page.
# Keys are exact cells of the Default, Zero, Required, and Refers-to columns.
# The site build fails when a cell with Japanese text has no entry here.
# The test that generates the schema (TestSchemaCoverage) writes the cells into
# types.schema.json in English with this table, and fails on a cell without one.
# The Schema page writes two different defaults as one cell, "旧版 <v0>／新版 <v1>"
# with the English of both; those cells are at the end.
# v0 and v1 are schema_version 0 and schema_version 1 (version 2 reads like 1).
cells:
  "en（英語）": "`en` (English)"
  "en（英語）・ja（日本語）": "`en` (English) or `ja` (Japanese)"
  ".（床）": "`.` (floor)"
  "0（template の Rule 変換時に１）": "0 (1 when a template is turned into a rule)"
  "0（全頁を順に表示）": "0 (show every page in order)"
  "0（旧仕様）": "0 (the legacy spec)"
  "0（未管理）": "0 (not tracked)"
  "HP・MP・生死・状態条件で必須": "required for HP, MP, alive, and state conditions"
  "OK と NG の２札": "two tags, OK and NG"
  "TacticPreset の ID と定義": "preset ID and its TacticPreset"
  "a.agi × (0.8 + 0.4 × 乱数)": "a.agi * (0.8 + 0.4 * random)"
  "actors の ID を返す式": "expression that returns an `actors` ID"
  "actors または all": "`actors` or `all`"
  "actors または任意の名前": "`actors` or any name"
  "actor・face・name のいずれか必須": "one of actor, face, or name is required"
  "add_state だけに指定可": "only with add_state"
  "add・remove のいずれか必須": "add or remove is required"
  "ai の ID または Rule[]": "`ai` ID or Rule[]"
  "appear と併用不可": "not with appear"
  "assets/ のフォント": "font in assets/"
  "assets/ のモジュール曲ディレクトリ": "module song directory in assets/"
  "assets/ の一覧ファイル": "list file in assets/"
  "assets/ の画像": "image in assets/"
  "assets/ の画像。その絵の上の台詞と問いを数える": "image in assets/; lines and questions are counted on that picture"
  "assets/ の画像またはパターン": "image or pattern in assets/"
  "assets/ の画像またはパターン[]": "images or patterns in assets/"
  "assets/ の表情ディレクトリ": "face directory in assets/"
  "assets/ の音声": "sound in assets/"
  "battle.critical（両方省略なら会心なし）": "battle.critical (no critical hits if both are omitted)"
  "battle.retry を継承": "inherits battle.retry"
  "battle.variance を継承": "inherits battle.variance"
  "command が true なら必須": "required when command is true"
  "count と併用不可": "not with count"
  "dream の場合は薄い桃色": "pale pink for dream"
  "events のパターン[]": "`events` patterns"
  "face_shade を継承": "inherits face_shade"
  "faces 内の表情": "face in faces"
  "file なしでは bpm が必要、file と moods は併用不可": "bpm is required without file; file and moods do not mix"
