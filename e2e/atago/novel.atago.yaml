version: '1'
suite:
  name: Gozen novel games in check and play trace (ADR 0025 to 0029)
scenarios:
- name: the novel words at schema_version 3 ask for version 4
  steps:
  - fixture:
      file: old/game.yaml
      content: "schema_version: 3\nid: old\nstart: {location: room, party: [reader]}\nui: {message: novel, rollback: 4}\n"
  - fixture:
      file: old/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {}}
  - run:
      command: gozen check --only structure old
  - assert:
      exit_code: 1
      stderr:
        contains: 'ui.rollback needs schema_version: 4'
- name: version 4 takes the novel words
  steps:
  - fixture:
      file: new/game.yaml
      content: "schema_version: 4\nid: new\nstart: {location: room, party: [reader]}\nui: {message: novel, rollback: 4}\n"
  - fixture:
      file: new/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {}}
  - run:
      command: gozen check --only structure new
  - assert:
      exit_code: 0
- name: play trace shows the lines not read and what skipping did
  steps:
  - fixture:
      file: run.jsonl
      content: |
        {"t":"start","tick":0,"language":"en","game":"Novel","seed":1}
        {"t":"say","tick":10,"text":"The lamps are lit.","read":true}
        {"t":"skip","tick":12,"on":true}
        {"t":"say","tick":16,"who":"Courier","text":"Gold 5.","read":true}
        {"t":"skip","tick":20,"on":false,"why":"unread"}
        {"t":"say","tick":20,"text":"A bell rings far off.","read":false}
        {"t":"skip","tick":40,"scene":true,"on":true,"event":"story","line":3,"read":6,"lines":6}
        {"t":"skip","tick":52,"scene":true,"on":false,"why":"choice","event":"story","line":4}
        {"t":"end","tick":60}
  - run:
      command: gozen play trace run.jsonl --only say,skip
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 'The lamps are lit.'
        - 'A bell rings far off.  [unread]'
        - 'skip on'
        - 'skip off (unread)'
        - 'scene skip from story line 3 (6 of 6 lines read)'
        - 'scene skip off (choice) at line 4'
        not_contains: 'lit.  [unread]'
  - run:
      command: gozen play trace run.jsonl --check
  - assert:
      exit_code: 0
      stdout:
        contains: 'check: 0'
- name: play trace shows rolling back and loading in the middle of an event
  steps:
  - fixture:
      file: run.jsonl
      content: |
        {"t":"start","tick":0,"language":"en","game":"Novel","seed":1}
        {"t":"rollback","tick":30,"from":4,"to":3,"event":"story"}
        {"t":"rollback","tick":40,"from":1,"to":5,"event":"opening","back_into":true,"left":"story"}
        {"t":"resume","tick":50,"event":"story","line":3,"at":3}
        {"t":"end","tick":60}
  - run:
      command: gozen play trace run.jsonl --only rollback,resume
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 'back from line 4 to line 3 of story'
        - 'back from line 1 to line 5 of opening (the event before)'
        - 'load at line 3 of story (reached 3)'
  - run:
      command: gozen play trace run.jsonl --check
  - assert:
      exit_code: 0
- name: a save of a newer format is refused and one of version 1 is still read
  steps:
  - fixture:
      file: v3.json
      content: '{"format_version":3,"game_id":"cli-expedition","data_version":0,"state":{"actors":{"scout":{"id":"scout","level":1}},"party":["scout"],"location":"camp"}}'
  - fixture:
      file: v1.json
      content: '{"format_version":1,"game_id":"cli-expedition","data_version":0,"state":{"actors":{"scout":{"id":"scout","level":1}},"party":["scout"],"location":"camp"}}'
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" lesson -n 2 --state v3.json
  - assert:
      exit_code: 1
      stderr:
        contains: 'save format 3 is not supported (supported: 1 to 2)'
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" lesson -n 2 --state v1.json
  - assert:
      exit_code: 0
      stdout:
        contains: 'lesson: 2 battles'
- name: check reports the words of staging with their codes
  steps:
  - fixture:
      file: staged/game.yaml
      content: "schema_version: 4\nid: staged\nstart: {location: room, party: [reader]}\nui: {message: novel}\n"
  - fixture:
      file: staged/assets/fig.png
      content: "a file"
  - fixture:
      file: staged/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {}}
        events:
          scene:
            do:
              - stand: {who: Lamplighter, face: fig.png, at: up}
              - effect: wobble
              - wait: {seconds: -1}
              - music: {stop: true, fade: 1}
  - run:
      command: gozen check --format json --only structure staged
  - assert:
      exit_code: 1
      stdout:
        contains:
        - '"path": "events.scene.do[0].stand.at"'
        - '"path": "events.scene.do[1].effect"'
        - '"path": "events.scene.do[2].wait"'
        - '"code": "GZN1107"'
        - '"code": "GZN1106"'
        - 'or a reaction'
- name: the words of staging at schema_version 3 ask for version 4
  steps:
  - fixture:
      file: old3/game.yaml
      content: "schema_version: 3\nid: old3\nstart: {location: room, party: [reader]}\n"
  - fixture:
      file: old3/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {}}
        events: {scene: {do: [{stand: none}, {wait: {seconds: 1, skip: false}}]}}
  - run:
      command: gozen check --only structure old3
  - assert:
      exit_code: 1
      stderr:
        contains: ['stand needs schema_version: 4', 'wait as a map needs schema_version: 4']
- name: check lists every text not translated in json and lays out each language
  steps:
  - fixture:
      file: tongues/game.yaml
      content: "schema_version: 4\nid: tongues\nstart: {location: room, party: [reader]}\nwritten_in: en\nlanguages: [en, ja]\n"
  - fixture:
      file: tongues/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {name: Room}}
        events:
          scene:
            do:
              - say: Hi.
              - choice: [{label: Stay}]
  - fixture:
      file: tongues/lang/ja.yaml
      content: "text:\n  Hi.: and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on and the long road goes on\n  Room: Room\n"
  - run:
      command: gozen check --format json --only structure tongues
  - assert:
      exit_code: 0
      stdout:
        contains: ['"path": "events.scene.do[1].choice[0].label"', '"code": "GZN0111"', '"severity": "warning"']
  - run:
      command: gozen check --only layout tongues
  - assert:
      exit_code: 0
      stderr:
        contains: ['data/world.yaml [ja]']
        not_contains: ['data/world.yaml:']
- name: the language words at schema_version 3 ask for version 4
  steps:
  - fixture:
      file: old5/game.yaml
      content: "schema_version: 3\nid: old5\nstart: {location: room, party: [reader]}\nlanguages: [en, ja]\n"
  - fixture:
      file: old5/data/world.yaml
      content: |
        classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}
        actors: {reader: {class: walker}}
        skills: {attack: {}, guard: {}}
        locations: {room: {name: Room}}
        events:
          scene:
            do:
              - say: Hi.
              - choice: [{label: Stay}]
  - run:
      command: gozen check --only structure old5
  - assert:
      exit_code: 1
      stderr:
        contains: 'languages needs schema_version: 4'
