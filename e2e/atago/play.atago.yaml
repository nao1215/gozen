version: '1'
suite:
  name: Direct game startup contracts
scenarios:
- name: run help needs no game or display
  steps:
  - run:
      command: gozen help run
  - assert:
      exit_code: 0
      stdout:
        contains: ['gozen run <game-dir>', '--save-dir', '--dev']
      stderr: {equals: ''}
      changes: {created: [], modified: [], deleted: []}
- name: removed command path ${path} is not an alias
  matrix:
  - {path: play run}
  - {path: pack desktop}
  - {path: pack web}
  - {path: pack release}
  - {path: pack trial}
  - {path: play trace}
  - {path: play notes}
  steps:
  - run:
      command: gozen ${path} absent-game
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        contains: ['GZN2101']
      changes: {created: [], modified: [], deleted: []}
- name: reject invalid startup ${args}
  matrix:
  - args: ''
  - args: 'one two'
  - args: 'game --start camp'
  - args: 'game --dev --script missing'
  - args: 'game --dev --review'
  - args: '--seed bad game'
  - args: 'game --dev --answers x'
  - args: 'game --window -1'
  - args: 'game --dev --replay-battle 1'
  - args: 'game --dev --record unused.mp4'
  steps:
  - run:
      command: gozen run ${args}
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains:
        - '[GZN2201]'
        - 'gozen run --help'
- name: a missing game fails without a display or output files
  steps:
  - run:
      command: gozen run absent-game --mute
  - assert:
      exit_code: 1
      stdout:
        equals: ''
      stderr:
        contains: game.yaml
      changes:
        created: []
        modified: []
        deleted: []
