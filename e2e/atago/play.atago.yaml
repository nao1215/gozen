version: '1'
suite:
  name: Direct game startup contracts
scenarios:
- name: run help needs no game or display
  steps:
  - run:
      command: gozen help run
  - assert:
      exit_code: 0
      stdout:
        contains: ['gozen run <game-dir>', '--save-dir', '--dev']
      stderr: {equals: ''}
      changes: {created: [], modified: [], deleted: []}
- name: removed command path ${path} is not an alias
  matrix:
  - {path: play run}
  - {path: play shots}
  - {path: pack desktop}
  - {path: pack web}
  - {path: pack release}
  - {path: pack trial}
  - {path: play trace}
  - {path: play notes}
  steps:
  - run:
      command: gozen ${path} absent-game
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        contains: ['GZN2101']
      changes: {created: [], modified: [], deleted: []}
- name: reject invalid startup ${args}
  matrix:
  - args: ''
  - args: 'one two'
  - args: 'game --start camp'
  - args: 'game --dev --script missing'
  - args: 'game --dev --review'
  - args: '--seed bad game'
  - args: 'game --dev --answers x'
  - args: 'game --window -1'
  - args: 'game --dev --replay-battle 1'
  - args: 'game --dev --record unused.mp4'
  steps:
  - run:
      command: gozen run ${args}
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains:
        - '[GZN2201]'
        - 'gozen run --help'
- name: a missing game fails without a display or output files
  steps:
  - run:
      command: gozen run absent-game --mute
  - assert:
      exit_code: 1
      stdout:
        equals: ''
      stderr:
        contains: game.yaml
      changes:
        created: []
        modified: []
        deleted: []

- name: capture argument contract ${args}
  matrix:
  - {args: '', code: GZN2102}
  - {args: 'game extra', code: GZN2102}
  - {args: 'game', code: GZN2303}
  - {args: 'game --config jobs.yaml', code: GZN2303}
  - {args: 'game --out output', code: GZN2303}
  - {args: 'game --config jobs.yaml --out output --timeout 0s', code: GZN2201}
  - {args: 'game --config jobs.yaml --out output --format yaml', code: GZN2202}
  - {args: 'game --bin old-player', code: GZN2103}
  steps:
  - run:
      command: gozen capture ${args}
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr: {contains: '${code}'}
      changes: {created: [], modified: [], deleted: []}

- name: capture rejects an unknown selected job before creating output
  steps:
  - fixture:
      file: jobs.yaml
      content: 'shots: [{id: camp, start: camp}]'
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config jobs.yaml --out output --only missing --format json
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: GZN2402}
      changes: {created: [], modified: [], deleted: []}
