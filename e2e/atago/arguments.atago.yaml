version: '1'
suite:
  name: Gozen CLI argument and stream contracts
scenarios:
- name: help for ${sub} through gozen help
  matrix:
  - sub: check
  - sub: prompt
  - sub: mosaic
  - sub: version
  steps:
  - run:
      command: gozen help ${sub}
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 'Requirements:'
        - https://github.com/nao1215/gozen#gozen
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: gozen top-level help
  steps:
  - run:
      command: gozen --help
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 'Requirements:'
        - https://github.com/nao1215/gozen#gozen
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: help for ${sub}
  matrix:
  - sub: check
  - sub: layout
  - sub: sim
  - sub: curve
  - sub: floors
  - sub: trace
  - sub: book
  - sub: design
  - sub: memos
  - sub: release
  - sub: trial
  - sub: shots
  - sub: version
  steps:
  - run:
      command: gozen ${sub} --help
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 'Requirements:'
        - https://github.com/nao1215/gozen#gozen
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: invalid arguments for ${sub}
  matrix:
  - sub: check
  - sub: layout
  - sub: sim
  - sub: curve
  - sub: floors
  - sub: trace
  - sub: book
  - sub: design
  - sub: memos
  - sub: release
  - sub: trial
  - sub: shots
  - sub: version
  steps:
  - run:
      command: gozen ${sub} --unknown
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: unknown flag
      changes:
        created: []
        modified: []
        deleted: []
- name: gozen version prints one line
  steps:
  - run:
      command: gozen version
  - assert:
      exit_code: 0
      stdout:
        matches: '^gozen \S+\n$'
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: reject help for an unknown command
  steps:
  - run:
      command: gozen help absent
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: unknown command
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen check -no-layout without a game
  steps:
  - run:
      command: gozen check -no-layout
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: expects one directory
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen check -no-layout missing-game
  steps:
  - run:
      command: gozen check -no-layout missing-game
  - assert:
      exit_code: 1
      stdout:
        equals: ''
      stderr:
        contains: game.yaml
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen sim -n 0 unused troop
  steps:
  - run:
      command: gozen sim -n 0 unused troop
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: positive
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen check unused extra
  steps:
  - run:
      command: gozen check unused extra
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: expects one
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen curve unused location -grind NaN
  steps:
  - run:
      command: gozen curve unused location -grind NaN
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: finite
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen trial unused output -config ../escape.yaml
  steps:
  - run:
      command: gozen trial unused output -config ../escape.yaml
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: relative
      changes:
        created: []
        modified: []
        deleted: []
- name: reject gozen shots -raw unused list.yaml
  steps:
  - run:
      command: gozen shots -raw unused list.yaml
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: requires
      changes:
        created: []
        modified: []
        deleted: []
