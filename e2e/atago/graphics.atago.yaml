version: '1'
suite:
  name: Gozen actual screenshot capture
scenarios:
- name: shots captures the original sample through its runner
  tags:
  - graphics
  steps:
  - fixture:
      file: shots.yaml
      content: 'shots: [{id: camp, start: camp, wait: 2}]

        '
  - run:
      command: gozen play shots "${specdir}/fixtures/game" shots.yaml --raw --bin "${env:GOZEN_GAME_BIN}" --out captures --timeout
        30s
      timeout: 45s
  - assert:
      exit_code: 0
      stdout:
        contains: ok
      stderr:
        equals: ''
  - assert:
      image:
        path: captures/01_camp.png
        format: png
        width: 960
        height: 540
  - assert:
      image:
        path: captures/01_camp.jpg
        format: jpeg
        width: 960
        height: 540
  - assert:
      file:
        path: captures/shots.json
        json:
          path: $[0].status
          equals: ok

- name: run plays a directory with shared scripts and records its events
  tags: [graphics]
  steps:
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        shot camp
        press ok
        wait 12
        shot conversation
        quit
  - run:
      command: gozen run "${specdir}/fixtures/game" --dev --mute --seed 7 --start camp --script play.txt --shots "run shots" --save-dir "run saves" --trace run.jsonl
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
  - assert:
      image:
        path: run shots/camp.png
        format: png
        width: 960
        height: 540
  - assert:
      image:
        path: run shots/conversation.png
        format: png
        width: 960
        height: 540
  - run:
      command: gozen trace run.jsonl --only say
  - assert:
      exit_code: 0
      stdout:
        contains: The trail is clear.
      stderr:
        equals: ''

- name: run saves and resumes in a second CLI process
  tags: [graphics]
  steps:
  - fixture:
      file: save.txt
      content: |
        gap 12
        wait 10
        do open: save
        press ok
        wait 90
        quit
  - run:
      command: gozen run "${specdir}/fixtures/game" --dev --mute --start camp --gold 37 --script save.txt --shots first --save-dir saves
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: saves/save1.json
        json:
          path: $.state.gold
          equals: 37
  - fixture:
      file: load.txt
      content: |
        gap 12
        wait 10
        shot title
        press ok
        press ok
        wait 20
        shot restored
        do open: save
        press down
        press ok
        wait 90
        quit
  - run:
      command: gozen run --mute "${specdir}/fixtures/game" --dev --script load.txt --shots second --save-dir saves
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: saves/save2.json
        json:
          path: $.state.gold
          equals: 37
  - assert:
      file:
        path: saves/save2.json
        json:
          path: $.state.location
          equals: camp
  - assert:
      image:
        path: second/restored.png
        format: png
        width: 960
        height: 540

- name: a generated RPG has a playable conversation
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --id rpg-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        press ok
        wait 20
        shot conversation
        quit
  - run:
      command: gozen run game --dev --mute --start village --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - run:
      command: gozen trace trace.jsonl --only say
  - assert:
      exit_code: 0
      stdout: {contains: Welcome to your village.}

- name: a generated novel plays the chosen ending
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --template novel --id novel-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        read 2
        press down
        press ok
        wait 20
        shot choice
        read 3
        quit
  - run:
      command: gozen run game --dev --mute --event opening --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - run:
      command: gozen trace trace.jsonl --only say
  - assert:
      exit_code: 0
      stdout:
        contains:
        - You turn toward the lights of home.
        - Thank you for playing.

- name: a generated campaign changes ownership and advances a turn
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --template campaign --id campaign-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        wait 10
        order attack hero bridge
        read 1
        wait 20
        end_turn
        wait 60
        shot turn
        quit
  - run:
      command: gozen run game --dev --mute --start valley --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - assert:
      file:
        path: trace.jsonl
        contains:
        - '"t":"order"'
        - '"target":"bridge"'
        - '"result":"won"'
        - '"t":"end_turn"'
        - '"turn":2'
