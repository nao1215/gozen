version: '1'
suite:
  name: Gozen actual screenshot capture
scenarios:
- name: capture isolates jobs and publishes PNG and GIF despite a failed job
  tags: [graphics]
  steps:
  - fixture:
      file: capture jobs.yaml
      content: |
        seed: 7
        shots:
          - {id: camp, start: camp, wait: 2}
          - id: conversation
            event: finish
            line: 1
            wait: 2
            setup: [{set: {gold: 42}}]
          - id: animated
            start: camp
            wait: 2
            gif:
              fps: 10
              duration: 1s
              width: 320
              script: |
                press ok
          - {id: missing, event: absent}
          - {id: camp-again, start: camp, wait: 2}
  - run:
      command: gozen capture --config "capture jobs.yaml" "${specdir}/fixtures/game" --out "capture output" --timeout 30s --format json
      timeout: 45s
  - assert:
      exit_code: 1
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: capture}
        - {path: $.status, equals: failed}
        - {path: $.data.succeeded, equals: 4}
        - {path: $.data.failed, equals: 1}
        - {path: '$.data.items[1].status', equals: ok}
        - {path: '$.data.items[2].frames', equals: 10}
        - {path: '$.data.items[3].reason', equals: 'unknown event "absent"'}
        - {path: '$.data.items[4].status', equals: ok}
  - assert:
      image: {path: capture output/camp.png, format: png, width: 960, height: 540}
  - assert:
      image:
        path: capture output/camp-again.png
        similar_to: capture output/camp.png
        max_diff: 0.001
  - assert:
      image: {path: capture output/animated.gif, format: gif, width: 320, height: 180}
  - assert:
      file:
        path: capture output/missing.png
        exists: false
  - assert:
      file:
        path: capture output/shots.json
        json: {path: '$[3].status', equals: failed}
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config "capture jobs.yaml" --out jsonl --only camp --format jsonl
      timeout: 30s
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        equals: |
          {"version":1,"command":"capture","type":"item","id":"camp","status":"ok","data":{"n":1,"id":"camp","status":"ok","artifact":"camp.png","frames":1,"seed":7,"size":"960x540"}}
          {"version":1,"command":"capture","type":"summary","status":"ok","data":{"items":[{"n":1,"id":"camp","status":"ok","artifact":"camp.png","frames":1,"seed":7,"size":"960x540"}],"succeeded":1,"failed":0}}
  - assert:
      image:
        path: jsonl/camp.png
        similar_to: capture output/camp.png
        max_diff: 0.001
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config "capture jobs.yaml" --out "capture output" --format json
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      changes: {created: [], modified: [], deleted: []}

- name: run plays a directory with shared scripts and records its events
  tags: [graphics]
  steps:
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        shot camp
        press ok
        wait 12
        shot conversation
        quit
  - run:
      command: gozen run "${specdir}/fixtures/game" --dev --mute --seed 7 --start camp --script play.txt --shots "run shots" --save-dir "run saves" --trace run.jsonl
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
  - assert:
      image:
        path: run shots/camp.png
        format: png
        width: 960
        height: 540
  - assert:
      image:
        path: run shots/conversation.png
        format: png
        width: 960
        height: 540
  - run:
      command: gozen trace run.jsonl --only say
  - assert:
      exit_code: 0
      stdout:
        contains: The trail is clear.
      stderr:
        equals: ''

- name: run saves and resumes in a second CLI process
  tags: [graphics]
  steps:
  - fixture:
      file: save.txt
      content: |
        gap 12
        wait 10
        do open: save
        press ok
        wait 90
        quit
  - run:
      command: gozen run "${specdir}/fixtures/game" --dev --mute --start camp --gold 37 --script save.txt --shots first --save-dir saves
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: saves/save1.json
        json:
          path: $.state.gold
          equals: 37
  - fixture:
      file: load.txt
      content: |
        gap 12
        wait 10
        shot title
        press ok
        press ok
        wait 20
        shot restored
        do open: save
        press down
        press ok
        wait 90
        quit
  - run:
      command: gozen run --mute "${specdir}/fixtures/game" --dev --script load.txt --shots second --save-dir saves
      timeout: 30s
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: saves/save2.json
        json:
          path: $.state.gold
          equals: 37
  - assert:
      file:
        path: saves/save2.json
        json:
          path: $.state.location
          equals: camp
  - assert:
      image:
        path: second/restored.png
        format: png
        width: 960
        height: 540

- name: a generated RPG has a playable conversation
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --id rpg-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        press ok
        wait 20
        shot conversation
        quit
  - run:
      command: gozen run game --dev --mute --start village --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - run:
      command: gozen trace trace.jsonl --only say
  - assert:
      exit_code: 0
      stdout: {contains: Welcome to your village.}

- name: a generated novel plays the chosen ending
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --template novel --id novel-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        gap 12
        wait 10
        read 2
        press down
        press ok
        wait 20
        shot choice
        read 3
        quit
  - run:
      command: gozen run game --dev --mute --event opening --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - run:
      command: gozen trace trace.jsonl --only say
  - assert:
      exit_code: 0
      stdout:
        contains:
        - You turn toward the lights of home.
        - Thank you for playing.

- name: a generated campaign changes ownership and advances a turn
  tags: [graphics]
  steps:
  - run:
      command: gozen new game --template campaign --id campaign-play
  - assert: {exit_code: 0}
  - fixture:
      file: play.txt
      content: |
        wait 10
        order attack hero bridge
        read 1
        wait 20
        end_turn
        wait 60
        shot turn
        quit
  - run:
      command: gozen run game --dev --mute --start valley --script play.txt --shots shots --trace trace.jsonl
      timeout: 30s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - assert:
      file:
        path: trace.jsonl
        contains:
        - '"t":"order"'
        - '"target":"bridge"'
        - '"result":"won"'
        - '"t":"end_turn"'
        - '"turn":2'

- name: capture checks an asset that appears during animation and continues after rejection
  tags: [graphics]
  steps:
  - fixture:
      file: overlay/approvals.json
      content: '[{"file":"mote.png","approved":false,"required":false,"status":"pending"}]'
  - fixture:
      file: captures.yaml
      content: |
        shots:
          - id: transient
            start: camp
            wait: 2
            gif:
              duration: 1s
              fps: 30
              width: 320
              script: |
                wait 6
                do image: {file: mote.png}
                wait 2
                do image: {}
          - {id: clean, start: camp, wait: 2}
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config captures.yaml --overlay overlay --out output --format json
      timeout: 30s
  - assert:
      exit_code: 1
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.data.succeeded, equals: 1}
        - {path: $.data.failed, equals: 1}
        - {path: '$.data.items[0].reason', equals: 'assetfs: unapproved mote.png ()'}
        - {path: '$.data.items[1].status', equals: ok}
  - assert:
      file: {path: output/transient.gif, exists: false}
  - assert:
      image: {path: output/clean.png, format: png, width: 960, height: 540}

- name: capture times out one job and starts the next with fresh state
  tags: [graphics]
  steps:
  - fixture:
      file: captures.yaml
      content: |
        shots:
          - {id: slow, start: camp, script: 'wait 1000000'}
          - {id: quick, start: camp, wait: 2}
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config captures.yaml --out output --timeout 2s --format json
      timeout: 15s
  - assert:
      exit_code: 1
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.data.failed, equals: 1}
        - {path: '$.data.items[0].reason', equals: 'context deadline exceeded'}
        - {path: '$.data.items[1].status', equals: ok}
  - assert:
      file: {path: output/slow.png, exists: false}
  - assert:
      image: {path: output/quick.png, format: png, width: 960, height: 540}
- name: CLI restores a save written before public API retirement and continues playing
  tags: [graphics]
  steps:
  - fixture:
      file: saves/save1.json
      from: fixtures/pre-api-retirement.save
  - fixture:
      file: continue.txt
      content: |
        gap 12
        wait 10
        press ok
        press ok
        wait 20
        shot restored
        do set: {gold: gold + 5}
        do open: save
        press down
        press ok
        wait 90
        quit
  - run:
      command: gozen run "${specdir}/fixtures/game" --dev --mute --script continue.txt --shots restored --save-dir saves
      timeout: 30s
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      file:
        path: saves/save2.json
        json:
        - {path: $.state.gold, equals: 42}
        - {path: $.state.location, equals: camp}
  - assert:
      image: {path: restored/restored.png, format: png, width: 960, height: 540}

- name: a classless novel runs aliases and reactions, opens a journal and saves
  tags: [graphics]
  steps:
  - fixture:
      file: story/game.yaml
      content: |
        schema_version: 8
        id: narrative-contract
        screen: {width: 960, height: 540}
        title: Station
        start: {location: station}
        verbs: {greet: greeting}
        reactions: {rowan: rowan.yaml}
        screens:
          journal:
            title: Travel journal
            entries:
              - {label: Arrival, text: 'Visits: {var.visits}', do: [{set: {var.visits: 'var.visits + 1'}}]}
              - {label: Unopened, text: A later note., when: flag.later}
  - fixture:
      file: story/data/story.yaml
      content: |
        actors: {rowan: {name: Rowan}}
        locations: {station: {name: Station}}
        events:
          greeting:
            do: [{respond: {who: rowan, text: Hello}}]
  - fixture:
      file: story/assets/rowan.yaml
      content: |
        people:
          - id: rowan
            rules:
              - {id: repeated, when: tag.repeat > 0, say: [Welcome back.]}
              - {id: hello, say: [Welcome.]}
  - fixture:
      file: story.txt
      content: |
        gap 12
        wait 10
        do greet: true
        wait 30
        shot greeting
        press ok
        wait 10
        do greet: true
        wait 30
        press ok
        wait 10
        do open: journal
        wait 10
        press ok
        wait 10
        shot journal
        press cancel
        do open: save
        press ok
        wait 90
        quit
  - run:
      command: gozen run story --dev --mute --start station --seed 7 --script story.txt --shots shots --save-dir saves --trace story.jsonl
      timeout: 30s
  - assert:
      exit_code: 0
      stderr: {equals: ''}
  - assert:
      image: {path: shots/greeting.png, format: png, width: 960, height: 540}
  - assert:
      image: {path: shots/journal.png, format: png, width: 960, height: 540}
  - assert:
      file:
        path: saves/save1.json
        json: {path: $.state.party, equals: []}
  - assert:
      file:
        path: saves/save1.json
        json: {path: $.state.vars.visits, equals: 1}
  - run:
      command: gozen trace story.jsonl --only say
  - assert:
      exit_code: 0
      stdout: {contains: [Welcome., Welcome back.]}
      stderr: {equals: ''}
  - run:
      command: gozen trace story.jsonl --format json --only layout
  - assert:
      exit_code: 0
      stdout:
        json: {path: "$.data.records[0].t", equals: layout}
      stderr: {equals: ''}
- name: a call keeps tall hair in its view and draws a backdrop behind a picture self view
  tags: [graphics]
  steps:
  # A picture self view on the stage while the caller speaks, then small while the
  # participant speaks. Its hair rises 132 pixels above the face box: the layout
  # line's opaque top stays inside the view's clip both times (the stage's top is
  # at 76, the small view's at 346), and self_backdrop is drawn behind it.
  - fixture: {file: call/assets/hair.png, from: fixtures/call/hair.png}
  - fixture: {file: call/assets/room.png, from: fixtures/call/room.png}
  - fixture:
      file: call/assets/faces.json
      content: '{"version": 1, "model": "authored-geometric-fixture", "pictures": {"hair.png": {"box": [60, 140, 140, 220], "size": [200, 600], "sha256": "1fe2e170a62da1a14cce6c75215c3825daedd0954269f0b7da9e4e3043d99f1c"}}}'
  - fixture:
      file: call/game.yaml
      content: |
        schema_version: 11
        id: call-framing
        title: Call framing
        language: en
        screen: {width: 1280, height: 720, native: true}
        start: {location: room}
        ui: {message: novel}
        planning:
          calendar: {start: '2030-01-01', end: '2030-01-09', phases: [morning]}
          entities: {potter: {name: Potter, actor: potter}}
        screens:
          studio:
            title: Studio
            kind: ensemble
            view:
              order: [potter]
              chat: {title: Messages}
              call: {address: call.example.test, layout: full, captions: overlay, others: side, still: true, self: hair.png, self_label: Me, self_stage: true, self_backdrop: room.png}
  - fixture:
      file: call/data/world.yaml
      content: |
        actors:
          potter: {name: Potter}
          me: {name: Me}
        locations:
          room: {name: Room}
        events:
          meet:
            - call: {event: talk, ensemble: studio}
          talk:
            - say: {who: me, text: 'Can you hear me?'}
            - say: {who: potter, text: 'Loud and clear.'}
  - fixture:
      file: call.txt
      content: |
        wait 60
        shot stage
        press ok
        wait 60
        shot small
        quit
  - run:
      command: gozen run call --dev --mute --seed 7 --window 1 --event meet --script call.txt --shots shots --save-dir saves --trace call.jsonl
      timeout: 120s
  - assert:
      exit_code: 0
      file:
        path: call.jsonl
        contains: ['"pictures":["hair.png","room.png"]']
  - run:
      command: gozen trace call.jsonl --format json --only layout
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: '$.data.records[0].figures[0].clip[1]', equals: 76}
        - {path: '$.data.records[0].figures[0].content[1]', gte: 76}
        - {path: '$.data.records[1].figures[0].clip[1]', equals: 346}
        - {path: '$.data.records[1].figures[0].content[1]', gte: 346}
      stderr: {equals: ''}
- name: capture the office sample's management screens in a window
  tags: [graphics]
  steps:
  # One picture of each management screen, drawn by the real renderer: the standup
  # with its burnup, a peek, a carried ticket, the tickets and carousel, a message,
  # the full call with its shared screen, the calendar and the plan.
  - fixture:
      file: office.txt
      content: |
        gap 4
        wait 30
        do open: standup
        wait 30
        shot standup
        pick Next
        wait 20
        pick Daniel Cho
        wait 10
        shot peek
        press x
        wait 10
        pick Next
        wait 20
        pick Payments
        wait 10
        shot carry
        pick Daniel Cho
        wait 30
        press x
        wait 30
        do call: notify
        wait 30
        shot message
        pick Message: Elena Ruiz
        wait 20
        pick Call now
        wait 30
        shot call
        press ok
        wait 40
        shot share
        press ok
        wait 30
        press ok
        wait 30
        press ok
        wait 30
        press x
        wait 30
        do open: calendar
        wait 40
        shot calendar
        press x
        wait 30
        do open: timeline
        wait 40
        shot timeline
        press x
        wait 30
        do open: materials
        wait 40
        shot materials
        quit
  - run:
      command: gozen run "${specdir}/../../examples/office/game" --dev --mute --seed 7 --window 1 --start office --script office.txt --shots shots --save-dir saves
      timeout: 300s
  - assert:
      exit_code: 0
  - assert:
      image: {path: shots/share.png, format: png}
  - assert:
      image: {path: shots/calendar.png, format: png}
  - assert:
      image: {path: shots/materials.png, format: png}
- name: capture the workshop sample's planning screens in a window
  tags: [graphics]
  steps:
  - fixture:
      file: planning.txt
      content: |
        gap 4
        wait 30
        do open: studio
        wait 30
        shot studio
        press x
        wait 20
        do open: timeline
        wait 30
        shot timeline
        press x
        wait 20
        do open: calendar
        wait 30
        shot calendar
        # This compact calendar has no month-navigation control.
        wait 20
        press x
        wait 20
        do open: workshop
        wait 30
        shot entities
        press down
        wait 10
        press x
        wait 20
        do call: assembly
        wait 40
        shot assembly
        quit
  - run:
      command: gozen run "${specdir}/../../examples/workshop/game" --dev --mute --seed 7 --window 1 --start workshop --script planning.txt --shots shots --save-dir saves
      timeout: 300s
  - assert:
      exit_code: 0
  - assert:
      image: {path: shots/studio.png, format: png}
  - assert:
      image: {path: shots/calendar.png, format: png}
  - assert:
      image: {path: shots/assembly.png, format: png}

- name: capture differences state facts and never fail
  tags: [graphics]
  steps:
  - fixture:
      file: before.yaml
      content: |
        shots:
          - {id: same, start: camp, wait: 2}
          - {id: edited, start: camp, wait: 2}
          - {id: removed, start: camp, wait: 2}
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config before.yaml --out before
      timeout: 45s
  - assert: {exit_code: 0, stderr: {equals: ''}}
  - fixture:
      file: after.yaml
      content: |
        shots:
          - {id: same, start: camp, wait: 2}
          - {id: edited, event: finish, line: 1, wait: 2}
          - {id: added, start: camp, wait: 2}
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config after.yaml --out after --against before --format json
      timeout: 45s
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.data.failed, equals: 0}
        - {path: $.data.succeeded, equals: 3}
        - {path: $.data.comparison.changed, equals: 3}
        - {path: $.data.comparison.unchanged, equals: 1}
        - {path: '$.data.items[0].changed', equals: false}
        - {path: '$.data.items[1].diff_pixels', gt: 0}
        - {path: '$.data.items[2].change', equals: new}
        - {path: '$.data.items[3].change', equals: removed}
  - assert:
      image: {path: after/edited.diff.png, format: png, width: 960, height: 540}
  - assert:
      file:
        path: after/index.html
        contains: ['edited.previous.png', '<details>', 'edited.diff.png']
  - run:
      command: gozen capture "${specdir}/fixtures/game" --config after.yaml --out again --against after --format json
      timeout: 45s
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: '$.data.items[0].id', equals: same}
        - {path: '$.data.items[0].diff_pixels', equals: 0}
        - {path: '$.data.items[0].changed', equals: false}
        - {path: '$.data.items[1].id', equals: edited}
        - {path: '$.data.items[1].diff_pixels', equals: 0}
        - {path: '$.data.items[1].changed', equals: false}
        - {path: '$.data.items[2].id', equals: added}
        - {path: '$.data.items[2].diff_pixels', equals: 0}
        - {path: '$.data.items[2].changed', equals: false}
        - {path: $.data.comparison.changed, equals: 0}
        - {path: $.data.comparison.unchanged, equals: 3}
