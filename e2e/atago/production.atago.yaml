version: '1'
suite:
  name: Gozen production CLI contracts with original neutral inputs
scenarios:
- name: gozen prompt help does not read a missing catalog
  steps:
  - run:
      command: gozen prompt lint --config missing.yaml --help
  - assert:
      exit_code: 0
      stdout:
        contains: ['Requirements:', 'gozen#gozen']
      stderr:
        equals: ''
      changes: {created: [], modified: [], deleted: []}
- name: gozen mosaic help for ${sub}
  matrix:
  - sub: auto
  - sub: inspect
  - sub: list
  - sub: add
  - sub: grow
  steps:
  - run:
      command: gozen mosaic ${sub} --help
  - assert:
      exit_code: 0
      stdout:
        contains: ['Requirements:', 'gozen#gozen', 'CGO_ENABLED=1']
      stderr:
        equals: ''
      changes: {created: [], modified: [], deleted: []}
- name: gozen prompt builds neutral catalog and lints it
  steps:
  - run:
      command: gozen prompt --config "${specdir}/../../docs/examples/production/catalog.yaml" --scene landscape --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: prompt}
        - {path: $.data.positive, equals: "quiet garden, soft light"}
        - {path: $.data.dialect, equals: sdxl}
      stderr:
        equals: ''
  - run:
      command: gozen prompt --config "${specdir}/../../docs/examples/production/catalog.yaml" --scene portrait --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.data.positive, equals: "quiet garden, soft light, (traveler:1.5), adult"}
      stderr:
        equals: ''
  - run:
      command: gozen prompt lint --config "${specdir}/../../docs/examples/production/catalog.yaml" --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.command, equals: prompt lint}
        - {path: $.data, equals: []}
      stderr:
        equals: ''
      changes: {created: [], modified: [], deleted: []}
- name: gozen prompt missing prerequisite points to installation information
  steps:
  - run:
      command: gozen prompt --config missing.yaml
  - assert:
      exit_code: 1
      stderr:
        contains: ['missing.yaml', 'Requirements:', 'gozen#gozen']
      changes: {created: [], modified: [], deleted: []}
- name: gozen mosaic inference missing prerequisites writes no output
  steps:
  - fixture:
      file: game/assets/pattern.png
      from: ../../docs/examples/production/pattern.png
  - run:
      command: gozen mosaic auto --fix '' --tags '' --shape box --passes default --manual '' --out processed game pattern.png
  - assert:
      exit_code: 1
      stderr:
        contains: ['Requirements:', 'gozen#gozen']
      changes: {created: [], modified: [], deleted: []}
- name: gozen mosaic workflow preserves input and read-only operations write nothing
  steps:
  - fixture:
      file: game/assets/pattern.png
      from: ../../docs/examples/production/pattern.png
  - fixture:
      file: original.png
      from: ../../docs/examples/production/pattern.png
  - fixture:
      file: edits.yaml
      content: 'pattern.png: {skip: true, block: 4, add: [[1, 1, 7, 7], [14, 10, 8, 9]]}'
  - run:
      command: gozen mosaic auto --fix '' --tags '' --shape box --passes default --manual edits.yaml --out processed game pattern.png
  - assert:
      exit_code: 0
  - assert:
      file:
        path: game/assets/pattern.png
        equals_file: original.png
  - assert:
      dir:
        path: processed
        recursive: true
        contains: [pattern.png, report.json, masks/pattern.png.png, review.md]
  - run:
      command: gozen mosaic inspect --fix '' --tags '' --shape box --passes default --manual edits.yaml --out processed game pattern.png
  - assert:
      exit_code: 0
      stdout:
        contains: ['"status":"done"', '"output_block":4']
      changes: {created: [], modified: [], deleted: []}
  - run:
      command: gozen mosaic auto --fix '' --tags '' --shape box --passes default --dry-run --manual edits.yaml --out dry-output game pattern.png
  - assert:
      exit_code: 0
      changes: {created: [], modified: [], deleted: []}
  - run:
      command: gozen mosaic grow --fix '' --tags '' --shape box --passes default --manual edits.yaml --out processed --size 48 --rect 0,0,8,8 --by 2 game pattern.png
  - assert:
      exit_code: 0
  - run:
      command: gozen mosaic clear --fix '' --tags '' --shape box --passes default --manual edits.yaml --out processed game pattern.png
  - assert:
      exit_code: 1
      stderr:
        contains: 'Requirements:'
      changes: {created: [], modified: [], deleted: []}
- name: gozen mosaic rejects empty regions without changing the fix file
  steps:
  - fixture:
      file: game/assets/pattern.png
      from: ../../docs/examples/production/pattern.png
  - run:
      command: gozen mosaic add --fix '' --tags '' --shape box --passes default --manual edits.yaml --out processed --rect 80,80,4,4 game pattern.png
  - assert:
      exit_code: 1
      stderr:
        contains: 'rectangle does not intersect'
      changes: {created: [], modified: [], deleted: []}
- name: prompt selectors are fixed and keep explicit ID errors structured
  steps:
  - run:
      command: gozen prompt --select setting=studio --format json --config "${specdir}/../../docs/examples/production/catalog.yaml"
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.command, equals: prompt}
        - {path: $.status, equals: ok}
        - {path: $.data.positive, equals: plain backdrop}
      stderr: {equals: ''}
      changes: {created: [], modified: [], deleted: []}
  - run:
      command: gozen prompt --config "${specdir}/../../docs/examples/production/catalog.yaml" --select setting=missing --format jsonl
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json:
        - {path: $.command, equals: prompt}
        - {path: $.code, equals: GZN2402}
      changes: {created: [], modified: [], deleted: []}
- name: prompt validates arguments before reading the catalog
  matrix:
  - {args: '--select invalid', code: GZN2201}
  - {args: '--scene landscape --plan missing.yaml', code: GZN2301}
  - {args: '--scenes - --select setting=studio', code: GZN2301}
  steps:
  - run:
      command: gozen prompt --config missing.yaml --format json ${args}
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json:
        - {path: $.code, equals: '${code}'}
      changes: {created: [], modified: [], deleted: []}
- name: prompt JSON aggregates partial stdin batches in input order
  steps:
  - run:
      command: gozen prompt --config "${specdir}/../../docs/examples/production/catalog.yaml" --scenes - --format json
      stdin: |
        landscape
        missing
        landscape
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: prompt}
        - {path: $.status, equals: failed}
        - {path: '$.data[0].id', equals: landscape}
        - {path: '$.data[1].id', equals: missing}
        - {path: '$.data[2].id', equals: landscape}
        - {path: '$.data[2].result.positive', equals: 'quiet garden, soft light'}
      stderr: {equals: ''}
      changes: {created: [], modified: [], deleted: []}
- name: prompt empty stdin JSONL ends with one summary
  steps:
  - run:
      command: gozen prompt --config "${specdir}/../../docs/examples/production/catalog.yaml" --scenes - --format jsonl
      stdin: ''
  - assert:
      exit_code: 0
      stdout:
        equals: |
          {"version":1,"command":"prompt","type":"summary","status":"ok","data":{"succeeded":0,"failed":0}}
      stderr: {equals: ''}
      changes: {created: [], modified: [], deleted: []}
- name: model list is structured and does not fetch
  steps:
  - run:
      command: gozen models list --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.command, equals: models list}
        - {path: '$.data[0].name', equals: censor}
        - {path: '$.data[1].name', equals: face}
        - {path: '$.data[2].name', equals: head}
      changes: {created: [], modified: [], deleted: []}
- name: mosaic ${format} still publishes the manual instruction and review image
  matrix:
  - {format: json}
  - {format: jsonl}
  steps:
  - fixture:
      file: game/assets/pattern.png
      from: ../../docs/examples/production/pattern.png
  - run:
      command: gozen mosaic skip game pattern.png --manual edits.yaml --out processed --fix '' --tags '' --shape box --passes default --format ${format}
  - assert:
      exit_code: 0
      stdout:
        contains: ['"command":"mosaic skip"', '"status":"ok"']
      file:
        path: edits.yaml
        contains: 'skip: true'
  - assert:
      file:
        path: processed/manual/pattern.png.masked.png
        exists: true
