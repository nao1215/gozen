      file: g/game.yaml
      content: "schema_version: 2\nid: g\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: g/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {}}\n"
  - run:
      command: gozen check g
  - assert:
      exit_code: 0
      stdout:
        equals: "ok: 1 locations, 0 events, 1 actors, 2 skills, 0 items, 0 enemies, 0 troops, 0 ai sets\n"
      stderr:
        equals: ''
  - run:
      command: gozen check --format json g
