version: '1'
suite:
  name: Gozen diagnostic codes (ADR 0024), one scenario per code
scenarios:
- name: ${code} for an invalid command line, ${args}
  matrix:
  - {code: GZN2101, args: 'curve'}
  - {code: GZN2101, args: 'sim absent'}
  - {code: GZN2101, args: 'art mosaic absent'}
  - {code: GZN2102, args: 'check one two'}
  - {code: GZN2102, args: 'art mosaic auto'}
  - {code: GZN2103, args: 'sim battle --absent game lesson'}
  - {code: GZN2103, args: 'art mosaic auto --absent game'}
  - {code: GZN2104, args: 'sim battle game lesson -seed 9'}
  - {code: GZN2104, args: 'art prompt -config catalog.yaml'}
  - {code: GZN2105, args: '--help sim'}
  - {code: GZN2106, args: 'sim'}
  - {code: GZN2106, args: 'art mosaic'}
  - {code: GZN2201, args: 'sim battle game lesson -n 0'}
  - {code: GZN2201, args: 'sim dive game grotto --grind NaN'}
  - {code: GZN2201, args: 'sim battle game lesson --seed x'}
  - {code: GZN2202, args: 'check --format yaml game'}
  - {code: GZN2202, args: 'check --only fonts game'}
  - {code: GZN2301, args: 'play shots --raw game list.yaml'}
  - {code: GZN2302, args: 'pack trial game out --overlay overlay'}
  - {code: GZN2303, args: 'art prompt --scene landscape'}
  - {code: GZN2401, args: 'pack trial game out --config ../escape.yaml'}
  - {code: GZN2501, args: 'help GZN9999'}
  steps:
  - run:
      command: gozen ${args}
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: '[${code}]'
      changes: {created: [], modified: [], deleted: []}
- name: GZN2402 for a ${what} the game does not have
  matrix:
  - {what: troop, sub: sim battle, rest: lessn}
  - {what: location, sub: sim dive, rest: grot}
  - {what: dungeon, sub: sim floors, rest: grot}
  - {what: persona, sub: sim design, rest: --only nobody -o report}
  steps:
  - run:
      command: gozen ${sub} "${specdir}/fixtures/game" ${rest}
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: '[GZN2402]'
      changes: {created: [], modified: [], deleted: []}
- name: GZN2402 for a model art fetch does not know
  steps:
  - run:
      command: gozen art fetch nothing
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: '[GZN2402]'
      changes: {created: [], modified: [], deleted: []}
- name: gozen help explains a code
  steps:
  - run:
      command: gozen help GZN2402
  - assert:
      exit_code: 0
      stdout:
        contains: ['GZN2402 - the command line names something the game does not have', 'Fix: ', 'https://nao1215.github.io/gozen/errors/#gzn2402']
      stderr:
        equals: ''
- name: GZN1101 for a reference to a troop that is not defined
  steps:
  - fixture:
      file: g/game.yaml
      content: "schema_version: 2\nid: g\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: g/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {}}\nevents: {bad: {do: [{battle: wolves}]}}\n"
  - run:
      command: gozen check --only structure g
  - assert:
      exit_code: 1
      stderr:
        contains: '[GZN1101]'
