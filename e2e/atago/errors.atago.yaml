- name: GZN1401 for a broken line of a trace
  steps:
  - fixture:
      file: run.jsonl
      content: "{\n"
  - run:
      command: gozen play trace run.jsonl
  - assert:
      exit_code: 1
      stderr:
        contains: '[GZN1401]'
- name: GZN1402 and GZN1403 for the faults play trace --check finds
  steps:
  - fixture:
      file: run.jsonl
      content: "{\"t\":\"say\",\"tick\":0,\"who\":\"rin\",\"text\":\"Hello.\"}\n{\"t\":\"stand\",\"tick\":1,\"since\":0,\"speaker\":\"rin\",\"standing\":true,\"figures\":[]}\n{\"t\":\"music\",\"tick\":0,\"wanted\":\"bell\",\"song\":\"\"}\n{\"t\":\"end\",\"tick\":120}\n"
  - run:
      command: gozen play trace run.jsonl --check
  - assert:
      exit_code: 1
      stdout:
        contains: ['[GZN1402]', '[GZN1403]']
- name: GZN1404 for a line not read that skipping passed
  steps:
  - fixture:
      file: run.jsonl
      content: "{\"t\":\"skip\",\"tick\":0,\"on\":true}\n{\"t\":\"say\",\"tick\":4,\"text\":\"Hello.\",\"read\":false}\n{\"t\":\"end\",\"tick\":10}\n"
  - run:
      command: gozen play trace run.jsonl --check
  - assert:
      exit_code: 1
      stdout:
        contains: ['[GZN1404]', 'skip-unread', 'Hello.']
