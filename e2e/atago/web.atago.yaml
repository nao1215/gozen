version: '1'
suite:
  name: Gozen browser distribution
runners:
  browser:
    type: browser
    timeout: 90s
    browser_args: [enable-unsafe-swiftshader, use-angle=swiftshader, window-size=1100,700]
  # a browser whose languages are American English first
  english:
    type: browser
    timeout: 90s
    browser_args: [enable-unsafe-swiftshader, use-angle=swiftshader, window-size=1100,700, lang=en-US, accept-lang=en-US]
scenarios:
- name: a subdirectory export plays a choice and restores browser saves
  tags: [web]
  services:
  - name: site
    command: >-
      python3 -c "from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler; from pathlib import Path; s=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler); Path('address').write_text('http://127.0.0.1:'+str(s.server_port)); s.serve_forever()"
    ready: {file: address, store: origin, timeout: 5s}
  steps:
  - run: {command: 'gozen new game --id browser-roundtrip'}
  - assert: {exit_code: 0}
  - fixture:
      file: game/game.yaml
      content: |
        schema_version: 4
        id: browser-roundtrip
        title: 'A <new> journey'
        language: en
        screen: {width: 960, height: 540}
        start: {location: village, party: [hero], event: opening}
  - fixture:
      file: 'game/assets/space #%.png'
      from: fixtures/game/assets/mote.png
  - fixture:
      file: game/data/world.yaml
      content: |
        locations:
          village: {name: Village, safe: true, background: 'space #%.png'}
        events:
          opening:
            do:
              - choice:
                  - label: Take the bridge
                    do: [{set: {gold: 5}}]
                  - label: Take the path
                    do: [{set: {gold: 37}}]
  - run:
      command: 'gozen export game --target web --out site/games/example --runtime "${env:GOZEN_WEB_RUNTIME}" --format jsonl'
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: export}
        - {path: $.type, equals: summary}
        - {path: $.status, equals: ok}
        - {path: $.data.directory, equals: site/games/example}
        - {path: $.data.target, equals: web}
  - assert:
      file: {path: site/games/example/runtime-licenses/GO-LICENSE, contains: 'The Go Authors'}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/site/games/example/'
      - wait_visible: 'body:not(:has(#loading))'
      - title: true
  - assert: {value: {equals: 'A <new> journey'}}
  # the loading page counted the whole player and every file of the game
  - cdp:
      runner: browser
      actions:
      - eval: |
          ({player: goZenLoad.player.done > 0 && (goZenLoad.player.total === 0 || goZenLoad.player.done === goZenLoad.player.total),
            files: goZenLoad.files.total > 0 && goZenLoad.files.done === goZenLoad.files.total})
  - assert:
      value:
        json:
        - {path: $.player, equals: true}
        - {path: $.files, equals: true}
  - cdp:
      runner: browser
      actions:
      - eval: &controls |
          window.testFrames = (count) => new Promise(resolve => {
            const next = () => {
              if (--count === 0) resolve();
              else requestAnimationFrame(next);
            };
            requestAnimationFrame(next);
          });
          window.key = async (code) => {
            const canvas = document.querySelector('canvas');
            canvas.focus();
            canvas.dispatchEvent(new KeyboardEvent('keydown', {code, key: code, bubbles: true}));
            await testFrames(2);
            canvas.dispatchEvent(new KeyboardEvent('keyup', {code, key: code, bubbles: true}));
            await testFrames(15);
          };
          window.testSaved = async (slot) => {
            while (!localStorage.getItem('gozen/browser-roundtrip/save' + slot + '.json')) {
              await testFrames(1);
            }
            document.body.dataset.testSaved = 'true';
          };
          // A browser save is "gozen-time <time>", a newline, then the save's JSON.
          window.testSave = (slot) => {
            const v = localStorage.getItem('gozen/browser-roundtrip/save' + slot + '.json');
            if (!v.startsWith('gozen-time ')) throw new Error('save without its time: ' + v.slice(0, 40));
            return JSON.parse(v.slice(v.indexOf('\n') + 1));
          }; true
      - eval: |
          (async () => {
            await key('Enter');
            await key('ArrowDown');
            await key('Enter');
            await key('Escape');
            for (let i = 0; i < 4; i++) await key('ArrowDown');
            await key('Enter');
            await key('Enter');
            await testSaved(1);
          })()
      - wait_visible: 'body[data-test-saved=true]'
      - screenshot: {path: first.png, selector: canvas}
      - eval: "testSave(1)"
  - assert:
      value:
        json: {path: $.state.gold, equals: 37}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/site/games/example/'
      - wait_visible: 'body:not(:has(#loading))'
      - eval: *controls
      - eval: |
          (async () => {
            await key('Enter');
            await key('Enter');
            await key('Escape');
            for (let i = 0; i < 4; i++) await key('ArrowDown');
            await key('Enter');
            await key('ArrowDown');
            await key('Enter');
            await testSaved(2);
          })()
      - wait_visible: 'body[data-test-saved=true]'
      - screenshot: {path: second.png, selector: canvas}
      - eval: "testSave(2)"
  - assert:
      value:
        json: {path: $.state.gold, equals: 37}
  - cdp:
      runner: browser
      actions:
      - eval: "testSave(2).state.location"
  - assert: {value: {json: {path: '$', equals: village}}}
  - cdp:
      runner: browser
      actions:
      - screenshot: {path: restored.png, selector: canvas}
  - assert:
      image: {path: restored.png, format: png}

- name: a stream export fetches a voice only when its line comes
  tags: [web]
  services:
  # the server keeps the path of every request in requests.log as it is answered, with
  # when it came and when it was answered in arrivals.log, and answers a picture under
  # assets/zfiller/ twenty seconds late (pictures still coming in the background when the
  # show opens)
  - name: site
    command: |
      python3 -c '
      import time
      from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
      from pathlib import Path
      class Site(SimpleHTTPRequestHandler):
          def do_GET(self):
              came = time.time()
              if "/assets/zfiller/" in self.path:
                  time.sleep(20)
              super().do_GET()
              with open("arrivals.log", "a") as f:
                  f.write("%f %f %s\n" % (came, time.time(), self.path))
          def log_message(self, *args):
              with open("requests.log", "a") as f:
                  f.write(self.path + "\n")
      s = ThreadingHTTPServer(("127.0.0.1", 0), Site)
      Path("address").write_text("http://127.0.0.1:" + str(s.server_port))
      s.serve_forever()
      '
    ready: {file: address, store: origin, timeout: 5s}
  steps:
  - fixture:
      file: game/game.yaml
      content: "schema_version: 9\nid: stream-voices\ntitle: Voices\nlanguage: en\nstart: {location: booth, gold: 100}\nstreams: data/streams.yaml\nreactions: {host: talk.yaml}\n"
  - fixture:
      file: game/data/world.yaml
      content: "actors: {host: {name: Host, puppet: p/puppet.yaml}}\nlocations: {booth: {name: Booth, stream: lobby}}\n"
  - fixture:
      file: game/data/streams.yaml
      content: "voices: voice\ntiming: {say: 2, per_char: 0.1, chat: 2, ask: 10}\ntips: [10]\ncrowd: {names: [leaf], lines: [Hi], tip_lines: [Here], rate: 0.5}\nchannels: [{id: host, actor: host, room: room.png, frame: {cx: 32, top: 0, bottom: 96}, episodes: [streams/one.yaml]}]\n"
  # the reply to a tip has a field, so no recorded voice: it is read by speech synthesis
  - fixture: {file: game/assets/talk.yaml, content: "people:\n  - id: host\n    rules:\n      - {id: tip, kind: tip, say: [\"Thanks, {from}!\"]}\n"}
  - fixture: {file: game/assets/p/puppet.yaml, content: "base: base.png\nface: normal\nfaces: {normal: {}}\n"}
  - fixture: {file: game/assets/p/base.png, from: fixtures/puppet/base.png}
  - fixture: {file: game/assets/room.png, from: fixtures/game/assets/mote.png}
  - fixture: {file: tone.ogg, from: fixtures/game/assets/tone.ogg}
  # an episode of 40 lines, "Line 1." to "Line 40.", each with its voice (the first 16 hex
  # digits of the SHA-1 of the line)
  - run:
      command: |
        python3 -c '
        import hashlib, shutil
        from pathlib import Path
        lines = ["Line %d." % i for i in range(1, 41)]
        Path("game/streams").mkdir()
        Path("game/streams/one.yaml").write_text("title: Listen\nparts: [[" + ", ".join("{say: \"%s\"}" % l for l in lines) + "]]\n")
        Path("game/assets/voice/host").mkdir(parents=True)
        for l in lines:
            shutil.copy("tone.ogg", "game/assets/voice/host/%s.ogg" % hashlib.sha1(l.encode()).hexdigest()[:16])
        Path("game/assets/zfiller").mkdir()
        for i in range(30):
            Path("game/assets/zfiller/f%d.png" % i).write_bytes(bytes(range(256)) * 64)
        '
  - assert: {exit_code: 0}
  # the voices are the voices of lines: no GZN0119
  - run: {command: 'gozen check game'}
  - assert:
      exit_code: 0
      stderr: {not_contains: GZN0119}
  - run:
      command: 'gozen export game --target web --out site/games/voices --runtime "${env:GOZEN_WEB_RUNTIME}" --format jsonl'
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.status, equals: ok}
  - assert:
      file: {path: site/games/voices/game/files.json, contains: '"later":true'}
  # the page opens without fetching a voice
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/site/games/voices/'
      - wait_visible: 'body:not(:has(#loading))'
  - run: {command: "python3 -c 'print(sum(\"/assets/voice/\" in l for l in open(\"requests.log\")))'"}
  - assert: {stdout: {equals: "0\n"}}
  # watching (a new game, the name left empty, then the first card) fetches the voices of
  # the next lines ahead of them, a run of them where the show is, each once, not the
  # others: five within 8 seconds, where a line lasts 2.7 (said one by one, they would come
  # in 11)
  - cdp:
      runner: browser
      actions:
      - eval: *controls
      - eval: |
          (async () => {
            await key('Enter');
            await key('Enter');
            await key('Enter');
            document.body.dataset.watched = 'true';
          })(); true
      - wait_visible: 'body[data-watched=true]'
  - run:
      command: |
        python3 -c '
        import hashlib, time
        line = {hashlib.sha1(("Line %d." % i).encode()).hexdigest()[:16]: i for i in range(1, 41)}
        for _ in range(80):
            asked = [l.strip().rsplit("/", 1)[1][:16] for l in open("requests.log") if "/assets/voice/" in l]
            if len(set(asked)) >= 5:
                break
            time.sleep(0.1)
        got = {line[k] for k in set(asked)}
        # a run of lines with no gap, round from line 40 to line 1 as the show goes round
        run = any(got == {(s + i) % 40 + 1 for i in range(len(got))} for s in range(40))
        ok = 5 <= len(got) <= 12 and run and len(asked) == len(set(asked))
        # the first voice was asked for before a picture coming in the background was
        # answered: the pictures leave a browser connections for the files the game opens
        log = [l.split() for l in open("arrivals.log")]
        voice = min((float(c) for c, d, p in log if "/assets/voice/" in p), default=1e18)
        picture = min((float(d) for c, d, p in log if "/assets/zfiller/" in p), default=1e18)
        ok = ok and voice < picture
        print("a run of lines" if ok else (got, len(asked)))
        '
  - assert: {stdout: {equals: "a run of lines\n"}}
  # a tip: the reply, which has no recorded voice, is read by speech synthesis
  - cdp:
      runner: browser
      actions:
      - eval: |
          window.spoken = [];
          const speak = speechSynthesis.speak.bind(speechSynthesis);
          speechSynthesis.speak = (u) => { spoken.push(u.text); speak(u); }; true
      - eval: |
          (async () => {
            await key('ArrowDown');
            await key('Enter');
            await key('Enter');
            for (let i = 0; i < 300 && !spoken.some(t => t.startsWith('Thanks,')); i++) await testFrames(3);
            document.body.dataset.spoken = JSON.stringify(spoken);
          })(); true
      - wait_visible: 'body[data-spoken]'
      - eval: "JSON.parse(document.body.dataset.spoken).some(t => t.startsWith('Thanks,'))"
  - assert: {value: {equals: true}}
  # the progress of the page leaves the voices out
  - cdp:
      runner: browser
      actions:
      - eval: |
          (async () => {
            try {
              for (let i = 0; i < 300 && !goZenLoad.files; i++) await new Promise(resolve => setTimeout(resolve, 100));
              const files = await (await fetch('game/files.json', {cache: 'no-store'})).json();
              const want = files.filter(f => !f.later).reduce((n, f) => n + f.size, 0);
              document.body.dataset.total = String(goZenLoad.files.total === want);
            } catch (e) {
              document.body.dataset.total = String(e);
            }
          })(); true
      - wait_visible: 'body[data-total]'
      - eval: "document.body.dataset.total"
  - assert: {value: {json: {path: '$', equals: "true"}}}

- name: lines read by speech synthesis follow one another
  tags: [web]
  services:
  - name: site
    command: >-
      python3 -c "from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler; from pathlib import Path; s=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler); Path('address').write_text('http://127.0.0.1:'+str(s.server_port)); s.serve_forever()"
    ready: {file: address, store: origin, timeout: 5s}
  steps:
  - fixture:
      file: game/game.yaml
      content: "schema_version: 9\nid: stream-speech\ntitle: Speech\nlanguage: en\nstart: {location: booth, gold: 100}\nstreams: data/streams.yaml\nreactions: {host: talk.yaml}\n"
  - fixture:
      file: game/data/world.yaml
      content: "actors: {host: {name: Host, puppet: p/puppet.yaml}}\nlocations: {booth: {name: Booth, stream: lobby}}\n"
  # a voices folder, so the lines are read aloud from the start, but no voice of these lines:
  # each is read by speech synthesis, one after another
  - fixture:
      file: game/data/streams.yaml
      content: "voices: voice\ntiming: {say: 1, per_char: 0, chat: 1, ask: 10}\ntips: [10]\ncrowd: {names: [leaf], lines: [Hi], tip_lines: [Here], rate: 0.1}\nchannels: [{id: host, actor: host, room: room.png, frame: {cx: 32, top: 0, bottom: 96}, episodes: [streams/one.yaml]}]\n"
  - fixture: {file: game/streams/one.yaml, content: "title: Talk\nparts: [[{say: One.}, {say: Two.}, {say: Three.}, {say: Four.}, {say: Five.}, {say: Six.}, {say: Seven.}, {say: Eight.}]]\n"}
  - fixture: {file: game/assets/talk.yaml, content: "people:\n  - id: host\n    rules:\n      - {id: tip, kind: tip, say: [\"Thanks, {from}!\"]}\n"}
  - fixture: {file: game/assets/voice/host/0000000000000000.ogg, from: fixtures/game/assets/tone.ogg}
  - fixture: {file: game/assets/p/puppet.yaml, content: "base: base.png\nface: normal\nfaces: {normal: {}}\n"}
  - fixture: {file: game/assets/p/base.png, from: fixtures/puppet/base.png}
  - fixture: {file: game/assets/room.png, from: fixtures/game/assets/mote.png}
  - run:
      command: 'gozen export game --target web --out site/games/speech --runtime "${env:GOZEN_WEB_RUNTIME}" --format jsonl'
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.status, equals: ok}
  # the browser's speech synthesis as Chrome's can be: still speaking after an utterance has
  # ended (its end event come), until it is cancelled, and dropping unsaid an utterance
  # spoken just after a cancel
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/site/games/speech/'
      - wait_visible: 'body:not(:has(#loading))'
      - eval: |
          window.synth = {
            speaking: false, pending: false, delivered: [], dropped: [], quiet: 0,
            getVoices() { return []; },
            addEventListener() {}, removeEventListener() {}, resume() {},
            speak(u) {
              if (performance.now() < this.quiet) { this.dropped.push(u.text); return; }
              this.delivered.push(u.text);
              this.speaking = true;
              setTimeout(() => { if (u.onend) u.onend({type: 'end'}); }, 300);
            },
            cancel() { this.quiet = performance.now() + 50; this.speaking = false; },
          };
          Object.defineProperty(window, 'speechSynthesis', {value: synth, configurable: true}); true
      - eval: *controls
      - eval: |
          (async () => {
            await key('Enter');
            await key('Enter');
            await key('Enter');
            for (let i = 0; i < 300 && synth.delivered.length < 3; i++) await testFrames(3);
            // a tip with a message: its message read out, then the reply to it
            await key('ArrowDown');
            await key('Enter');
            for (const c of 'hi') {
              const canvas = document.querySelector('canvas');
              canvas.dispatchEvent(new KeyboardEvent('keydown', {code: 'Key' + c.toUpperCase(), key: c, bubbles: true}));
              await testFrames(2);
              canvas.dispatchEvent(new KeyboardEvent('keyup', {code: 'Key' + c.toUpperCase(), key: c, bubbles: true}));
              await testFrames(4);
            }
            await key('Enter');
            const after = () => synth.delivered.slice(synth.delivered.findIndex(t => t.includes('hi')));
            for (let i = 0; i < 400 && after().length < 3; i++) await testFrames(3);
            document.body.dataset.said = JSON.stringify({after: after(), dropped: synth.dropped});
          })(); true
      - wait_visible: 'body[data-said]'
      - eval: "JSON.parse(document.body.dataset.said)"
  # each line is said, the tip's message, then the reply to it, then the show's next line
  - assert:
      value:
        json:
        - {path: $.dropped, equals: []}
        - {path: '$.after[0]', equals: "\u201chi\u201d"}
        - {path: '$.after[1]', equals: "Thanks, Nameless viewer!"}

- name: a game of two languages opens in the browser's language the first time
  tags: [web]
  services:
  - name: site
    command: >-
      python3 -c "from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler; from pathlib import Path; s=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler); Path('address').write_text('http://127.0.0.1:'+str(s.server_port)); s.serve_forever()"
    ready: {file: address, store: origin, timeout: 5s}
  steps:
  # written in Japanese, offering Japanese and English
  - fixture:
      file: game/game.yaml
      content: "schema_version: 9\nid: stream-first-language\ntitle: First\nlanguage: ja\nlanguages: [ja, en]\nstart: {location: booth, gold: 100}\nstreams: data/streams.yaml\n"
  - fixture: {file: game/lang/en.yaml, content: "text:\n  ブース: Booth\n"}
  - fixture:
      file: game/data/world.yaml
      content: "actors: {host: {name: Host, puppet: p/puppet.yaml}}\nlocations: {booth: {name: ブース, stream: lobby}}\n"
  - fixture:
      file: game/data/streams.yaml
      content: "timing: {say: 1, per_char: 0, chat: 1, ask: 10}\ntips: [10]\ncrowd: {names: [leaf], lines: [Hi], tip_lines: [Here], rate: 0.1}\nchannels: [{id: host, actor: host, room: room.png, frame: {cx: 32, top: 0, bottom: 96}, episodes: [streams/one.yaml]}]\n"
  - fixture: {file: game/streams/one.yaml, content: "title: Talk\nparts: [[{say: One.}, {say: Two.}]]\n"}
  - fixture: {file: game/assets/p/puppet.yaml, content: "base: base.png\nface: normal\nfaces: {normal: {}}\n"}
  - fixture: {file: game/assets/p/base.png, from: fixtures/puppet/base.png}
  - fixture: {file: game/assets/room.png, from: fixtures/game/assets/mote.png}
  - run:
      command: 'gozen export game --target web --out site/games/first --runtime "${env:GOZEN_WEB_RUNTIME}" --format jsonl'
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.status, equals: ok}
  # a new game from the title, then the name asked in English: left empty, it is the English one, kept in the save; no
  # language is written in the settings, which were not changed
  - cdp:
      runner: english
      actions:
      - navigate: '${origin}/site/games/first/'
      - wait_visible: 'body:not(:has(#loading))'
      - eval: *controls
      - eval: |
          (async () => {
            const viewer = () => {
              for (let i = 0; i < localStorage.length; i++) {
                const m = /"viewer":\s*"([^"]*)"/.exec(localStorage.getItem(localStorage.key(i)));
                if (m) return m[1];
              }
              return '';
            };
            await key('Enter'); // the title's new game
            await key('Enter'); // the name, left empty
            for (let i = 0; i < 300 && !viewer(); i++) await testFrames(3);
            const config = localStorage.getItem('gozen/stream-first-language/config.json') || '';
            document.body.dataset.first = JSON.stringify({languages: navigator.languages, viewer: viewer(), language: config.includes('"language"')});
          })(); true
      - wait_visible: 'body[data-first]'
      - eval: "JSON.parse(document.body.dataset.first)"
  - assert:
      value:
        json:
        - {path: '$.languages[0]', equals: en-US}
        - {path: $.viewer, equals: Nameless viewer}
        - {path: $.language, equals: false}

- name: a page starts however its pieces come and keeps the game running as media come late
  tags: [web]
  services:
  # /v/MODE/ serves the export: "late" holds the sounds until the file release exists,
  # and the other modes send the gzipped player in pieces of 1, 1 and 1, or 2 bytes
  # first, uncompressed, undone by the host (Content-Encoding) or empty.
  - name: site
    command: |
      python3 -c '
      import gzip, time
      from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
      from pathlib import Path
      class Site(SimpleHTTPRequestHandler):
          def do_GET(self):
              parts = self.path.split("/", 3)
              if len(parts) < 4 or parts[1] != "v":
                  return super().do_GET()
              mode, rest = parts[2], parts[3]
              self.path, name = "/site/games/voices/" + rest, rest.split("?")[0]
              if mode == "late" and name.endswith((".ogg", ".wav.gz")):
                  while not Path("release").exists():
                      time.sleep(0.1)
              if mode == "late" or name != "gozen-player.wasm.gz":
                  return super().do_GET()
              b = Path("site/games/voices/gozen-player.wasm.gz").read_bytes()
              pieces = {"one": [b[:1], b[1:]], "ones": [b[:1], b[1:2], b[2:]], "two": [b[:2], b[2:]], "plain": [gzip.decompress(b)], "encoded": [b], "empty": []}[mode]
              self.send_response(200)
              self.send_header("Content-Type", "application/octet-stream")
              if mode == "encoded":
                  self.send_header("Content-Encoding", "gzip")
              self.end_headers()
              for piece in pieces:
                  self.wfile.write(piece)
                  self.wfile.flush()
                  time.sleep(0.3)
      s = ThreadingHTTPServer(("127.0.0.1", 0), Site)
      Path("address").write_text("http://127.0.0.1:" + str(s.server_port))
      s.serve_forever()
      '
    ready: {file: address, store: origin, timeout: 5s}
  steps:
  - fixture:
      file: game/game.yaml
      content: "schema_version: 9\nid: stream-late\ntitle: Late\nlanguage: en\nstart: {location: booth}\nstreams: data/streams.yaml\n"
  - fixture:
      file: game/data/world.yaml
      content: "actors: {host: {name: Host, puppet: p/puppet.yaml}}\nlocations: {booth: {name: Booth, stream: lobby}}\n"
  - fixture:
      file: game/data/streams.yaml
      content: "voices: voice\ntiming: {say: 2, per_char: 0.1, chat: 2, ask: 10}\ntips: [10]\ncrowd: {names: [leaf], lines: [Hi], tip_lines: [Here], rate: 0.5}\nchannels: [{id: host, actor: host, room: room.png, frame: {cx: 32, top: 0, bottom: 96}, episodes: [streams/one.yaml]}]\n"
  - fixture: {file: game/streams/one.yaml, content: "title: Listen\nparts: [[{say: 'Hello, listener.'}, {chat: [leaf, Hi there]}]]\n"}
  - fixture: {file: game/assets/p/puppet.yaml, content: "base: base.png\nface: normal\nfaces: {normal: {}}\n"}
  - fixture: {file: game/assets/p/base.png, from: fixtures/puppet/base.png}
  - fixture: {file: game/assets/room.png, from: fixtures/game/assets/mote.png}
  - fixture: {file: game/assets/voice/host/4710afdb1942b927.ogg, from: fixtures/game/assets/tone.ogg}
  # a second of silence, which the export gzips: still a sound, fetched after the game starts
  - run:
      command: >-
        python3 -c "import wave; w = wave.open('game/assets/quiet.wav', 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100); w.writeframes(bytes(88200)); w.close()"
  - assert: {exit_code: 0}
  - run:
      command: 'gozen export game --target web --out site/games/voices --runtime "${env:GOZEN_WEB_RUNTIME}" --format jsonl'
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.status, equals: ok}
  - assert:
      file: {path: site/games/voices/game/files.json, contains: '"file":"assets/quiet.wav.gz"'}
  # the game starts while its sounds are held back (the page tells in data-state when it
  # started or failed), and goes on drawing after they come
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/late/?fps'
      - eval: &started |
          (async () => {
            let state = 'still loading';
            for (let i = 0; i < 600; i++) {
              const loading = document.getElementById('loading');
              if (!loading) state = 'started';
              else if (loading.textContent.startsWith('Could not start')) state = loading.textContent;
              else {
                await new Promise(resolve => setTimeout(resolve, 100));
                continue;
              }
              break;
            }
            document.body.dataset.state = state;
          })(); true
      - wait_visible: &stated 'body[data-state]'
      - eval: &state "document.body.dataset.state"
  - assert: {value: {json: {path: '$', equals: started}}}
  - fixture: {file: release, content: "now\n"}
  - cdp:
      runner: browser
      actions:
      - eval: |
          (async () => {
            const wait = () => new Promise(resolve => setTimeout(resolve, 100));
            for (let i = 0; i < 300 && !(goZenLoad.files.done === goZenLoad.files.total); i++) await wait();
            window.gozenStats = undefined;
            let state = 'the game stopped';
            for (let i = 0; i < 50 && state !== 'running'; i++) {
              if (window.gozenStats) state = goZenLoad.files.done === goZenLoad.files.total ? 'running' : 'files missing';
              else await wait();
            }
            document.body.dataset.alive = state;
          })(); true
      - wait_visible: 'body[data-alive]'
      - eval: "document.body.dataset.alive"
  - assert: {value: {json: {path: '$', equals: running}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/one/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {json: {path: '$', equals: started}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/ones/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {json: {path: '$', equals: started}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/two/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {json: {path: '$', equals: started}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/plain/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {json: {path: '$', equals: started}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/encoded/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {json: {path: '$', equals: started}}}
  - cdp:
      runner: browser
      actions:
      - navigate: '${origin}/v/empty/'
      - eval: *started
      - wait_visible: *stated
      - eval: *state
  - assert: {value: {contains: 'Could not start'}}

- name: web export requires a runtime option
  steps:
