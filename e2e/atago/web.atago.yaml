- name: web export requires a runtime option
  steps:
  - run: {command: 'gozen export game --target web --out out'}
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr: {contains: '--runtime'}
      changes: {created: [], modified: [], deleted: []}

- name: an absent web runtime leaves no partial output
  steps:
  - run: {command: 'gozen export game --target web --out out --runtime absent'}
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      stderr: {contains: 'runtime.json'}
      changes: {created: [], modified: [], deleted: []}
