version: '1'
suite:
  name: gozen check --format json and the schema version 2 words
scenarios:
- name: a stream file names its mistakes with their file and line
  steps:
  - fixture:
      file: s/game.yaml
      content: "schema_version: 9\nid: stream-check\nstart: {location: booth}\nstreams: data/streams.yaml\n"
  - fixture:
      file: s/data/world.yaml
      content: "actors: {host: {name: Host, puppet: p/rig.yaml}}\nlocations: {booth: {stream: lobby}}\n"
  - fixture:
      file: s/data/streams.yaml
      content: "timing: {say: 2, per_char: 0.1, chat: 2, ask: 10}\ntips: [10]\ncrowd: {names: [leaf], lines: [Hi], tip_lines: [Here], rate: 0.5}\nchannels: [{id: host, actor: nobody, room: x.png, frame: {cx: 1, top: 0, bottom: 1}, episodes: [streams/one.yaml]}]\n"
  - fixture:
      file: s/streams/one.yaml
      content: "title: One\nparts:\n- - ask: {q: Which?, options: [{c: A, r: [\"{weeks}\"]}], npc: [[leaf, 3]]}\n"
  - fixture: {file: s/assets/p/rig.yaml, content: "base: base.png\nface: normal\nfaces: {normal: {}}\n"}
  - fixture: {file: s/assets/p/base.png, from: fixtures/game/assets/mote.png}
  - fixture: {file: s/assets/x.png, from: fixtures/game/assets/mote.png}
  - run:
      command: gozen check s --format json
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: '$.data[?(@.message =~ /unknown actor "nobody"/)].file', equals: data/streams.yaml}
        - {path: '$.data[?(@.message =~ /want 2 to 4 options/)].line', equals: 3}
        - {path: '$.data[?(@.message =~ /option 3 is not one/)].file', equals: streams/one.yaml}
        - {path: '$.data[?(@.message =~ /unknown \{weeks\}/)].code', equals: GZN1101}
- name: building materials and roofs validate through the public command
  steps:
  - run:
      command: gozen check "${specdir}/../../examples/space-buildings/game" --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
- name: opt-in continuous stacked space passes public validation
  steps:
  - fixture:
      file: free/game.yaml
      content: |
        schema_version: 8
        id: free-walk-check
        start: {location: room, party: [walker]}
  - fixture:
      file: free/data/world.yaml
      content: |
        classes: {visitor: {stats: {mhp: 10, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 10}}
        actors: {walker: {class: visitor}}
        skills: {attack: {}, guard: {}}
        locations:
          room:
            dungeon:
              tiles: {S: {start: true}}
              space:
                free_move: {speed: 1.6, turn_speed: 90, acceleration: 0.12, stages: [{after: 0.4, speed: 2.4}]}
                levels: ["#####\n#S..#\n#####"]
  - run:
      command: gozen check free --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
- name: stacked space with upright pictures validates in text and JSON
  steps:
  - run:
      command: gozen check "${specdir}/../../examples/space-town/game"
  - assert:
      exit_code: 0
      stderr: {equals: ''}
  - run:
      command: gozen check "${specdir}/../../examples/space-town/game" --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
- name: position level validates in text and JSON while unknown fields are rejected
  steps:
  - run:
      command: gozen new level-game --template rpg
  - assert:
      exit_code: 0
  - fixture:
      file: level-game/data/level-probe.yaml
      content: |
        events:
          level_probe:
            trigger: auto
            when: pos.level == 1
            do:
              - if: pos.level == 1
                then:
                  - say: Upstairs.
  - run:
      command: gozen check level-game
  - assert:
      exit_code: 0
      stderr: {equals: ''}
  - run:
      command: gozen check level-game --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
  - fixture:
      file: level-game/data/level-probe.yaml
      content: 'events: {level_probe: {do: [{if: "pos.unknown == 1", then: []}]}}'
  - run:
      command: gozen check level-game --format json
  - assert:
      exit_code: 1
      stdout:
        contains: ['GZN1103', 'pos has no field']
- name: check json on a sound game prints an empty list
  steps:
  - run:
      command: gozen check --format json --only structure "${specdir}/fixtures/game"
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr:
        equals: ''
- name: check json reports an error with file, line, column and path
  steps:
  - fixture:
      file: broken/game.yaml
      content: "schema_version: 2\nid: broken\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: broken/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {}}\nevents:\n  bad:\n    do:\n    - battle: wolves\n"
  - run:
      command: gozen check --format json --only structure broken
  - assert:
      exit_code: 1
      stdout:
        contains:
        - '"file":"data/world.yaml"'
        - '"line":8'
        - '"path":"events.bad.do[0].battle"'
        - '"severity":"error"'
        - wolves
      stderr:
        equals: ''
- name: check json warns of a stat set outside the development mode
  steps:
  - fixture:
      file: dev/game.yaml
      content: "schema_version: 2\nid: dev\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: dev/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {actions: [{label: Train, do: [{set: {actor.scout.level: 5, gold: 10}}, {pick: Train}]}]}}\n"
  - run:
      command: gozen check --format json --only structure dev
  - assert:
      exit_code: 0
      stdout:
        contains:
        - '"severity":"warning"'
        - actor.scout.level
        - development mode
        not_contains: '"severity":"error"'
- name: the schema version 2 words need schema_version 2
  steps:
  - fixture:
      file: old/game.yaml
      content: "schema_version: 1\nid: old\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: old/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {actions: [{label: Look, do: [{pick: Look}]}]}}\n"
  - run:
      command: gozen check --only structure old
  - assert:
      exit_code: 1
      stderr:
        contains: 'pick needs schema_version: 2'
- name: check rejects an unknown format
  steps:
  - run:
      command: gozen check --format xml "${specdir}/fixtures/game"
  - assert:
      exit_code: 2
      stdout:
        equals: ''
      stderr:
        contains: '[GZN2202]'
- name: a mistyped command is an error with the nearest command
  steps:
  - fixture:
      file: typo/game.yaml
      content: "schema_version: 2\nid: typo\nstart: {location: camp, party: [scout]}\n"
  - fixture:
      file: typo/data/world.yaml
      content: "classes: {walker: {stats: {mhp: 9, mmp: 0, atk: 1, def: 1, mat: 1, mdf: 1, agi: 1, luk: 1}, exp_for: level * 9}}\nactors: {scout: {class: walker}}\nskills: {attack: {}, guard: {}}\nlocations: {camp: {actions: [{label: Talk, do: [{sya: hi}, {set: {location: camp, party: [scout]}}]}]}}\n"
  - run:
      command: gozen check --only structure typo
  - assert:
      exit_code: 1
      stderr:
        contains: 'unknown field "sya" (did you mean "say"?)'
        not_contains: unknown name
- name: sim, curve and design print JSON for a test or an agent
  steps:
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" --troop lesson -n 4 --seed 2 --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.command, equals: sim battle}
        - {path: '$.data[0].troop', equals: lesson}
        - {path: '$.data[0].battles', equals: 4}
        - {path: '$.data[0].win_rate', equals: 1}
  - run:
      command: gozen sim dive "${specdir}/fixtures/game" --location grotto --floors 2 --battles 1 --boss 2:lesson --arrival-saves arrivals --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.command, equals: sim dive}
        - {path: '$.data.floors[1].boss', equals: lesson}
        - {path: '$.data.floors[1].boss_rate', equals: 1}
      changes:
        created:
        - arrivals/floor-2.json
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" --troop lesson -n 2 --state arrivals/floor-2.json --state arrivals/floor-2.json --as-is --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: '$.data[0].state', equals: arrivals/floor-2.json}
  - run:
      command: gozen sim design "${specdir}/fixtures/game" --format json --seed 3
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: sim design}
        - {path: '$.data.personas[0].seed', equals: 3}
        - {path: '$.data.personas[0].segments', equals: []}
      changes:
        created: []
  - run:
      command: gozen sim dive "${specdir}/fixtures/game" --location grotto --format xml
  - assert:
      exit_code: 2
      stderr:
        contains: '[GZN2202]'
- name: YAML complexity budgets warn without changing validation or game data
  steps:
  - fixture:
      file: garden/game.yaml
      content: |
        schema_version: 7
        id: garden-budget
        start: {location: garden}
  - fixture:
      file: garden/data/world.yaml
      content: 'locations: {garden: {name: Garden}}'
  - run:
      command: gozen check garden --only structure --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
  - fixture:
      file: garden/check-complexity.yaml
      content: 'file_lines: 2'
  - run:
      command: gozen check garden --only structure
  - assert:
      exit_code: 0
      stderr:
        contains: ['[GZN0122]', 'game.yaml:1:1', 'file lines = 3 (limit 2)']
      file:
        path: garden/game.yaml
        equals: "schema_version: 7\nid: garden-budget\nstart: {location: garden}\n"
  - run:
      command: gozen check garden --only structure --format json
      deterministic: {runs: 2, compare: [stdout, stderr, exit_code]}
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: '$.data[0].code', equals: GZN0122}
        - {path: '$.data[0].file', equals: game.yaml}
        - {path: '$.data[0].line', equals: 1}
        - {path: '$.data[0].severity', equals: warning}
  - fixture:
      file: garden/check-complexity.yaml
      content: 'file_lines: -1'
  - run:
      command: gozen check garden --only structure --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
  - fixture:
      file: garden/check-complexity.yaml
      content: 'file_linse: 2'
  - run:
      command: gozen check garden --only structure
  - assert:
      exit_code: 1
      stderr: {contains: ['check-complexity.yaml', 'file_linse']}
      stdout: {equals: ''}

- name: indexed state reads and small copied events expose hidden YAML expansion
  steps:
  - fixture:
      file: garden/game.yaml
      content: |
        schema_version: 10
        id: garden-indexed
        start: {location: garden}
  - fixture:
      file: garden/data/world.yaml
      content: |
        locations: {garden: {name: Garden, actions: [{label: Inspect, do: [{call: inspect_1}, {call: inspect_2}, {call: inspect_3}, {call: inspect_4}, {call: inspect_5}, {call: inspect_6}, {call: inspect_7}, {call: inspect_8}]}]}}
        events:
          inspect_1: {do: [{call: inspect}]}
          inspect_2: {do: [{call: inspect}]}
          inspect_3: {do: [{call: inspect}]}
          inspect_4: {do: [{call: inspect}]}
          inspect_5: {do: [{call: inspect}]}
          inspect_6: {do: [{call: inspect}]}
          inspect_7: {do: [{call: inspect}]}
          inspect_8: {do: [{call: inspect}]}
          inspect:
            do:
            - set: {var.total: 'var.checked_1 + var.checked_2 + var.checked_3 + var.checked_4 + var.checked_5 + var.checked_6 + var.checked_7 + var.checked_8'}
  - run:
      command: gozen check garden --only structure --format json
      deterministic: {runs: 2, compare: [stdout, stderr, exit_code]}
  - assert:
      exit_code: 0
      stdout:
        contains: ['same-shaped events blocks = 8', 'indexed state keys', 'var.checked_#']
      stderr: {equals: ''}
  - fixture:
      file: garden/check-complexity.yaml
      content: |
        indexed_names: -1
        repetitions: -1
        unused_definitions: -1
  - run:
      command: gozen check garden --only structure --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
- name: opt-in phone outcomes and colors validate
  steps:
  - fixture:
      file: phone/game.yaml
      content: |
        schema_version: 11
        id: phone-options
        language: en
        start: {location: studio}
        ui: {phone_accent: '#6750a4', phone_background: '#182430', phone_text: '#ffffff', phone_muted: '#cccccc'}
  - fixture:
      file: phone/data/world.yaml
      content: |
        locations: {studio: {name: Studio}}
        events:
          timeout:
            - phone: {app: lock, var: var.timeout, timeout: 8, timeout_result: retry}
            - phone: {app: banner, var: var.notice, timeout: 4, notices: [{text: Hello}]}
            - phone: {app: page, var: var.page, timeout: 4, rows: [{text: Hello}]}
            - phone: {app: chat, messages: [{mine: true, text: Hello}]}
  - run: {command: 'gozen check phone --format json'}
  - assert:
      exit_code: 0
      stderr: {equals: ''}
  - fixture:
      file: phone/data/world.yaml
      content: |
        locations: {studio: {name: Studio}}
        events:
          invalid:
            - phone: {app: lock, var: var.timeout, timeout: -1, timeout_result: woke}
            - phone: {app: banner, var: var.notice, timeout: 4, notices: [{text: Hello}, {text: Again}]}
            - phone: {app: chat, var: var.page, timeout: 4, messages: [{text: Hello}]}
            - phone: {app: page, timeout: 4, rows: [{text: Hello}]}
  - run: {command: 'gozen check phone --format json'}
  - assert:
      exit_code: 1
      stdout:
        contains: ['timeout must be finite positive', 'exactly one notice', 'needs var', 'timeout needs app']
  - fixture:
      file: phone/game.yaml
      content: |
        schema_version: 11
        id: phone-options
        ui: {phone_accent: not-a-color}
  - run: {command: 'gozen check phone --format json'}
  - assert:
      exit_code: 1
      stdout: {contains: ['phone_accent']}
- name: missing game inputs are fatal diagnostics in every format
  steps:
  - run: {command: 'gozen check absent-game --format text'}
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      stderr: {contains: GZN1110}
  - run: {command: 'gozen check absent-game --format json'}
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: GZN1110}
  - run: {command: 'gozen check absent-game --format jsonl --strict'}
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: GZN1110}
  - fixture: {file: directory-game/game.yaml/child, content: blocked}
  - run: {command: 'gozen check directory-game --only layout --format json'}
  - assert:
      exit_code: 1
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: GZN1110}
