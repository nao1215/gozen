      file: screens.txt
      content: |
        gap 1
        wait 10
        do call: {event: stock_visit, args: {amount: 2}}
        wait 10
        press z
        wait 4
        press down
        press z
        wait 12
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        snapshot
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --script screens.txt --trace screens.jsonl
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: screens.jsonl
        contains:
        - 'Stock 2'
        - 'Received 12'
        - 'Returned 2'
        - '"total":2'

- name: corrupted saved randomness is rejected before simulation
  steps:
  - fixture:
      file: damaged-random.json
      content: '{"format_version":3,"game_id":"cli-expedition","data_version":0,"rand":"YnJva2Vu","state":{"actors":{"scout":{"id":"scout","level":1}},"party":["scout"],"location":"camp"}}'
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" --troop lesson -n 2 --state damaged-random.json
  - assert:
      exit_code: 1
      stderr:
        contains: 'save random state:'
      stdout:
        equals: ''

- name: one candidate screen assigns two activity arguments
  steps:
  - fixture:
      file: targets.txt
      content: |
        gap 1
        wait 10
        do call: {event: assign_visit, args: {task: '"prepare"', resident: '"weaver"'}}
        wait 12
        press z
        wait 4
        press down
        press z
        wait 4
        press z
        wait 12
        press z
        wait 4
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        do call: {event: assign_visit, args: {task: '"shape"', resident: '"weaver"'}}
        wait 12
        press z
        wait 4
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        do say: 'Assignments {activity.prepare.assignee}/{activity.shape.assignee}'
        wait 4
        press z
        wait 12
        snapshot
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --script targets.txt --trace targets.jsonl
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: targets.jsonl
        contains:
        - 'Reviewed prepare'
        - 'Reviewed shape'
        - 'Assignments weaver/weaver'

- name: plain screen saves resume confirmation and the caller in another process
  steps:
  - fixture:
      file: save-screen.txt
      content: |
        gap 4
        wait 30
        press z
        wait 12
        press save
        press z
        wait 90
        press z
        wait 12
        press save
        press down
        press z
        wait 90
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --event stock_demo --script save-screen.txt --save-dir saves --trace saved.jsonl
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      file:
        path: saves/save1.json
        json: {path: $.cursor.event, equals: stock_demo}
  - assert:
      file:
        path: saves/save2.json
        json: {path: $.cursor.event, equals: stock_demo}
  - fixture:
      file: resume-screen.txt
      content: |
        gap 4
        wait 20
        press z
        press z
        wait 12
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        snapshot
        press z
        wait 12
        do open: save
        press down
        press down
        press z
        wait 90
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --script resume-screen.txt --save-dir saves --trace resumed.jsonl
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      file:
        path: resumed.jsonl
        contains: ['Returned 2', 'Returned 3', 'Total 2', '"total":2']
  - assert:
      file:
        path: saves/save3.json
        json: {path: $.state.vars.total, equals: 2}
