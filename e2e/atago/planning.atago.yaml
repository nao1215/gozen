- name: numeric planning inputs report source locations and fail check
  steps:
  - fixture:
      file: numeric/game.yaml
      content: |
        schema_version: 9
        id: numeric-workshop
        start: {location: room}
        planning:
          calendar: {start: '2030-07-31', end: '2030-08-02', phases: [morning]}
          activities: {clay: {effort: 2, observation: 'nil'}}
          ledgers: {hours: {retain: 2}}
  - fixture:
      file: numeric/data/world.yaml
      content: |
        locations: {room: {name: Workshop}}
        events:
          work:
            do:
            - plan: {op: progress, activity: clay, value: 'true'}
            - plan: {op: effort, activity: clay, value: 'false'}
            - plan: {op: record, ledger: hours, value: 'nil'}
  - run:
      command: gozen check numeric --format json
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: '$.data[?(@.line == 5)].file', equals: data/world.yaml}
        - {path: '$.data[?(@.line == 6 && @.file == "data/world.yaml")].message', equals: "planning value requires a number; use a numeric expression or an explicit conversion such as int(value)"}
        - {path: '$.data[?(@.line == 7)].message', equals: "planning value requires a number; use a numeric expression or an explicit conversion such as int(value)"}
        - {path: '$.data[?(@.file == "game.yaml")].message', equals: "planning value requires a number; use a numeric expression or an explicit conversion such as int(value)"}
- name: rule argument typos fail check before execution
  steps:
  - fixture:
      file: arguments/game.yaml
      content: |
        schema_version: 9
        id: workshop-arguments
        start: {location: room}
        planning:
          calendar: {start: '2030-07-31', end: '2030-08-02', phases: [morning]}
          activities: {clay: {effort: 2}}
          rules:
            work:
              params: [amount]
              do:
              - {op: progress, activity: clay, value: 'arg.amonut'}
  - fixture:
      file: arguments/data/world.yaml
      content: |
        locations: {room: {name: Workshop}}
  - run:
      command: gozen check arguments --format json
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: '$.data[0].file', equals: game.yaml}
        - {path: '$.data[0].line', equals: 11}
        - {path: '$.data[0].message', equals: '"arg.amonut": arg: rule arguments has no field "amonut" (known: amount)'}
- name: one typed event updates two residents without expanded bodies
  steps:
  - run:
      command: gozen check "${specdir}/../../docs/examples/event-arguments" --only structure
  - assert:
      exit_code: 0
      stderr:
        equals: ''
  - fixture:
      file: arguments.txt
      content: |
        gap 1
        wait 10
        do call: visit
        until idle
        snapshot
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --script arguments.txt --trace arguments.jsonl
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: arguments.jsonl
        contains:
        - 'Ready potter'
        - 'Ready weaver'
        - 'Returned potter/2'
        - 'Returned weaver/3'
        - 'Totals 2/3'
- name: typed screen arguments survive confirmation cancellation and nested close
  steps:
  - fixture:
      file: screens.txt
      content: |
        gap 1
        wait 10
        do call: {event: stock_visit, args: {amount: 2}}
        wait 10
        press z
        wait 4
        press down
        press z
        wait 12
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        snapshot
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --script screens.txt --trace screens.jsonl
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: screens.jsonl
        contains:
        - 'Stock 2'
        - 'Received 12'
        - 'Returned 2'
        - '"total":2'

- name: corrupted saved randomness is rejected before simulation
  steps:
  - fixture:
      file: damaged-random.json
      content: '{"format_version":3,"game_id":"cli-expedition","data_version":0,"rand":"YnJva2Vu","state":{"actors":{"scout":{"id":"scout","level":1}},"party":["scout"],"location":"camp"}}'
  - run:
      command: gozen sim battle "${specdir}/fixtures/game" --troop lesson -n 2 --state damaged-random.json
  - assert:
      exit_code: 1
      stderr:
        contains: 'save random state:'
      stdout:
        equals: ''

- name: one candidate screen assigns two activity arguments
  steps:
  - fixture:
      file: targets.txt
      content: |
        gap 1
        wait 10
        do call: {event: assign_visit, args: {task: '"prepare"', resident: '"weaver"'}}
        wait 12
        press z
        wait 4
        press down
        press z
        wait 4
        press z
        wait 12
        press z
        wait 4
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        do call: {event: assign_visit, args: {task: '"shape"', resident: '"weaver"'}}
        wait 12
        press z
        wait 4
        press z
        wait 4
        press z
        wait 12
        press x
        wait 4
        press z
        wait 12
        do say: 'Assignments {activity.prepare.assignee}/{activity.shape.assignee}'
        wait 4
        press z
        wait 12
        snapshot
        quit
  - run:
      command: gozen sim script "${specdir}/../../docs/examples/event-arguments" --start workshop --script targets.txt --trace targets.jsonl
  - assert:
      exit_code: 0
      stderr:
        equals: ''
      file:
        path: targets.jsonl
        contains:
        - 'Reviewed prepare'
        - 'Reviewed shape'
        - 'Assignments weaver/weaver'
