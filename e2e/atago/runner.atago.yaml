version: '1'
suite:
  name: authored scrolling game validation
scenarios:
- name: distinct authored courses validate through the public command
  steps:
  - run:
      command: gozen check "${specdir}/../../examples/runner/game" --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
  - run:
      command: gozen check "${specdir}/fixtures/runner" --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
- name: bounds and missing media fail without rewriting author data
  steps:
  - fixture: {file: game/game.yaml, from: fixtures/runner/game.yaml}
  - fixture: {file: game/data/world.yaml, from: fixtures/runner/data/world.yaml}
  - fixture: {file: game/assets/player.png, from: fixtures/runner/assets/player.png}
  - fixture: {file: game/assets/token.png, from: fixtures/runner/assets/token.png}
  - fixture: {file: game/assets/block.png, from: fixtures/runner/assets/block.png}
  - fixture: {file: game/assets/portrait.png, from: fixtures/runner/assets/portrait.png}
  - fixture: {file: game/assets/background.png, from: fixtures/runner/assets/background.png}
  - run:
      command: gozen check game --format json
  - assert:
      exit_code: 0
      stdout:
        json: {path: $.data, equals: []}
      stderr: {equals: ''}
  - run:
      command: >-
        python3 -c "from pathlib import Path; p=Path('game/game.yaml'); p.write_text(p.read_text().replace('    speed: 3','    speed: .inf',1))"
  - assert: {exit_code: 0}
  - run:
      command: gozen check game --format json
  - assert:
      exit_code: 1
      stdout: {contains: 'speed must be finite'}
      file: {path: game/game.yaml, contains: 'speed: .inf'}
  - run:
      command: >-
        python3 -c "from pathlib import Path; p=Path('game/game.yaml'); p.write_text(p.read_text().replace('speed: .inf','speed: 3')); Path('game/assets/player.png').unlink()"
  - assert: {exit_code: 0}
  - run:
      command: gozen check game --format json
  - assert:
      exit_code: 1
      stdout: {contains: 'assets/player.png'}
      file: {path: game/game.yaml, contains: 'player_image: player.png'}
- name: an unavailable game directory is reported
  steps:
  - run:
      command: gozen check missing-runner --format json
  - assert:
      exit_code: 1
