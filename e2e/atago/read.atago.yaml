version: '1'
suite:
  name: Gozen CLI checks and deterministic simulation
scenarios:
- name: '"${specdir}/fixtures/game" observable result'
  steps:
  - run:
      command: gozen check --only structure "${specdir}/fixtures/game"
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: Structure checked
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: check observable result
  steps:
  - run:
      command: gozen check "${specdir}/fixtures/game"
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: 'ok: 2 locations'
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: layout observable result
  steps:
  - run:
      command: gozen check --only layout "${specdir}/fixtures/game"
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: Layout checked
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: book observable result
  steps:
  - run:
      command: gozen book "${specdir}/fixtures/game"
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: ['# CLI expedition', 'start: camp, party scout, gold 0, items (none)', '## Locations', '## Enemies', '## Flow']
        not_contains: ['map[', '## Action rules', '## Music', '## Gallery']
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: sim observable result ${before} ${after}
  matrix:
  - {before: '--troop lesson', after: ''}
  - {before: '', after: '--troop=lesson'}
  - {before: '--troop=lesson --', after: ''}
  steps:
  - run:
      command: gozen sim battle -n 3 --seed 9 ${before} "${specdir}/fixtures/game" ${after}
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: win 100%
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: floors observable result ${before} ${after}
  matrix:
  - {before: '--location grotto', after: ''}
  - {before: '', after: '--location=grotto'}
  - {before: '--location=grotto --', after: ''}
  steps:
  - run:
      command: gozen sim floors --floor 1 --try 2 ${before} "${specdir}/fixtures/game" ${after}
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: seed   1
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: curve observable result ${before} ${after}
  matrix:
  - {before: '--location grotto', after: ''}
  - {before: '', after: '--location=grotto'}
  - {before: '--location=grotto --', after: ''}
  steps:
  - run:
      command: gozen sim dive --floors 1 --battles 1 --tries 1 ${before} "${specdir}/fixtures/game" ${after}
      deterministic:
        runs: 2
        compare:
        - stdout
        - stderr
        - exit_code
  - assert:
      exit_code: 0
      stdout:
        contains: Tap 1
      stderr:
        equals: ''
      changes:
        created: []
        modified: []
        deleted: []
- name: trace filters time and reports diagnostic failures
  steps:
  - fixture:
      file: trace.jsonl
      content: '{"t":"say","tick":60,"text":"The trail is clear."}

        {"t":"music","tick":120,"wanted":"bell","song":""}

        {"t":"end","tick":240}

        '
  - run:
      command: gozen trace trace.jsonl --only say --from 1 --to 1
  - assert:
      exit_code: 0
      stdout:
        contains:
        - '00:01.00'
        - The trail is clear.
        not_contains: music-late
      stderr:
        equals: ''
  - run:
      command: gozen trace trace.jsonl --check
  - assert:
      exit_code: 1
      stdout:
        contains: music-late
      stderr:
        contains: issues
- name: trace prints layout lines and does not judge them
  steps:
  - fixture:
      file: trace.jsonl
      content: '{"t":"layout","tick":120,"since":110,"figures":[{"picture":"lead.png","rect":[0,-40,400,800],"content":[40,-30,320,790],"clip":[0,0,1280,720],"alpha":1}],"texts":[{"text":"Pale","rect":[10,10,40,20],"size":15,"color":"#f0f4f8","back":"#e0e0e0","ratio":1.2},{"text":"Clear","rect":[10,40,40,20],"size":15,"color":"#f0f4f8","back":"#202020","ratio":15.1}]}

        {"t":"end","tick":240}

        '
  - run:
      command: gozen trace trace.jsonl --only layout
  - assert:
      exit_code: 0
      stdout:
        contains:
        - 1 figures, 2 texts
        - lead.png
        - lowest contrast 1.20 "Pale"
      stderr:
        equals: ''
  - run:
      command: gozen trace trace.jsonl --check
  - assert:
      exit_code: 0
      stderr:
        equals: ''
- name: trace check lets skipping pass lines not read when the setting says so
  steps:
  - fixture:
      file: trace.jsonl
      content: '{"t":"skip","tick":20,"on":true,"unread":true}

        {"t":"say","tick":21,"text":"Passed on purpose","read":false}

        {"t":"skip","tick":22,"on":false,"why":"choice"}

        {"t":"end","tick":60}

        '
  - run:
      command: gozen trace trace.jsonl --check
  - assert:
      exit_code: 0
      stdout:
        not_contains: skip-unread
      stderr:
        equals: ''
- name: malformed trace structures fail without panic
  steps:
  - fixture:
      file: trace.jsonl
      content: '{"t":"state","party":[3]}

        '
  - run:
      command: gozen trace trace.jsonl
  - assert:
      exit_code: 1
      stdout:
        equals: ''
      stderr:
        contains: invalid party member
        not_contains: panic
- name: breeding JSON reports unreachable species without creating artifacts
  steps:
  - run:
      command: gozen sim breed --format json "${specdir}/fixtures/game"
      deterministic: {runs: 2, compare: [stdout, stderr, exit_code]}
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: sim breed}
        - {path: $.status, equals: ok}
        - {path: $.data.reachable, equals: []}
        - {path: $.data.unreachable, equals: [mote]}
      changes: {created: [], modified: [], deleted: []}
  - run:
      command: gozen sim breed "${specdir}/fixtures/game" --format jsonl
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        equals: |
          {"version":1,"command":"sim breed","type":"item","id":"mote","status":"unreachable","data":{"id":"mote"}}
          {"version":1,"command":"sim breed","type":"summary","status":"ok","data":{"reachable":[],"unreachable":["mote"]}}
- name: route findings retain failed status in ${format}
  matrix:
  - {format: json}
  - {format: jsonl}
  steps:
  - run:
      command: gozen sim routes "${specdir}/fixtures/game" --fail-unreachable --format ${format}
      deterministic: {runs: 2, compare: [stdout, stderr, exit_code]}
  - assert:
      exit_code: 1
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: sim routes}
        - {path: $.status, equals: failed}
        - {path: $.data.unreachable_endings, equals: [clear]}
      changes: {created: [], modified: [], deleted: []}
- name: trace reads stdin and preserves filtered records in ${format}
  matrix:
  - {format: json}
  - {format: jsonl}
  steps:
  - run:
      command: gozen trace --format ${format} - --only say --only input --input --from 1 --to 1
      stdin: |
        {"t":"start","tick":0,"language":"en"}
        {"t":"say","tick":60,"text":"Keep this","read":false}
        {"t":"input","tick":120,"key":"z"}
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        contains: '"text":"Keep this"'
        not_contains: '"key":"z"'
      changes: {created: [], modified: [], deleted: []}
- name: trace structured checks retain diagnostic codes and failed exit
  steps:
  - run:
      command: gozen trace - --check --format json
      stdin: |
        {"t":"start","tick":0,"language":"en"}
        {"t":"voice","tick":60,"file":"missing.ogg","missing":true}
  - assert:
      exit_code: 1
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: trace}
        - {path: $.status, equals: failed}
        - {path: '$.data.issues[0].kind', equals: voice}
        - {path: '$.data.issues[0].tick', equals: 60}
        - {path: $.data.standing_pictures_checked, equals: false}
- name: trace rejects display filters in check mode before reading input
  steps:
  - run:
      command: gozen trace absent.jsonl --check --only say --format json
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: GZN2301}
- name: design rejects ${args} before reading the game
  matrix:
  - {args: '--seed 0', code: GZN2201}
  - {args: '--verbose', code: GZN2302}
  - {args: '--list --out report', code: GZN2301}
  steps:
  - run:
      command: gozen sim design missing-game ${args} --format json
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json: {path: $.code, equals: '${code}'}
      changes: {created: [], modified: [], deleted: []}
- name: generated floor JSON retains explicit zero seed and numbers
  steps:
  - run:
      command: gozen sim floors "${specdir}/fixtures/game" --location grotto --floor 1 --try 2 --format json
      deterministic: {runs: 2, compare: [stdout, stderr, exit_code]}
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: sim floors}
        - {path: '$.data[0].seed', equals: 0}
        - {path: '$.data[1].seed', equals: 1}
        - {path: '$.data[0].numbers.width', equals: 11}
        - {path: '$.data[0].numbers.height', equals: 11}
      changes: {created: [], modified: [], deleted: []}
- name: book JSON describes the whole game and lineage is an explicit section
  steps:
  - run:
      command: gozen book "${specdir}/fixtures/game" --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.version, equals: 1}
        - {path: $.command, equals: book}
        - {path: $.status, equals: ok}
        - {path: $.data.locations.camp.name, equals: Camp}
        - {path: $.data.monsters.mote.name, equals: Mote}
  - run:
      command: gozen book --section lineage "${specdir}/fixtures/game" --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: '$.data.monsters[0].id', equals: mote}
      changes: {created: [], modified: [], deleted: []}
- name: machine help registers options without opening inputs
  steps:
  - run:
      command: gozen help capture --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.command, equals: help}
        - {path: '$.data.commands[0].command', equals: capture}

      changes: {created: [], modified: [], deleted: []}
  - run:
      command: gozen help missing --format jsonl
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json:
        - {path: $.code, equals: GZN2101}

- name: trace sections report numbers without verdicts
  steps:
  - fixture:
      file: sections.jsonl
      content: |
        {"t":"section","tick":90,"name":"pictures","scope":"mark","frames":60,"ticks":60,"fps":60,"tps":60,"slow_frame_share":1,"heap_inuse_bytes":999999999,"allocations_per_frame":1234}
  - run:
      command: gozen trace sections.jsonl --only section
  - assert:
      exit_code: 0
      stdout:
        contains: 'pictures (mark): 60 frames, 60 ticks, 60.00 FPS, 60.00 TPS, heap 999999999 bytes, slow 1.0000, allocations/frame 1234.00'
  - run:
      command: gozen trace sections.jsonl --only section --format json
  - assert:
      exit_code: 0
      stdout:
        contains: '"allocations_per_frame":1234'
  - run:
      command: gozen trace sections.jsonl --check
  - assert:
      exit_code: 0
      stderr:
        equals: ''
- name: trace metrics reports facts from a recorded play
  steps:
  - run:
      command: gozen trace "${specdir}/fixtures/metrics.jsonl" --metrics --top 1 --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: '$.data.text_per_decision[0].characters', equals: 7}
        - {path: $.data.longest_read_only.ticks, equals: 480}
        - {path: '$.data.repeated_text[0].count', equals: 2}
        - {path: '$.data.climax_spacing[1].interval_ticks', equals: 60}
        - {path: '$.data.stalls[0].kind', equals: same_screen}
        - {path: '$.data.stalls[0].screen.tick', equals: 0}
        - {path: '$.data.sections[0].frames', equals: 300}
  - run:
      command: gozen trace "${specdir}/fixtures/metrics.jsonl" --metrics
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        contains:
        - 'facts, never verdicts'
        - '2x "Welcome"'
        - 'same_screen'
  # --stall-seconds is the shortest unchanged stretch reported: a one-second
  # threshold adds the short ones, a threshold longer than the play reports none.
  - run:
      command: gozen trace "${specdir}/fixtures/metrics.jsonl" --metrics --stall-seconds 1 --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.data.stall_seconds, equals: 1}
        - {path: $.data.stalls, length: 4}
        - {path: '$.data.stalls[0].kind', equals: no_observed_progress}
        - {path: '$.data.stalls[0].ticks', equals: 60}
  - run:
      command: gozen trace "${specdir}/fixtures/metrics.jsonl" --metrics --stall-seconds 9999 --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.data.stalls, length: 0}
- name: trace check judges a late song by --music-late
  steps:
  - fixture:
      file: trace.jsonl
      content: '{"t":"say","tick":60,"text":"The trail is clear."}

        {"t":"music","tick":120,"wanted":"bell","song":""}

        {"t":"end","tick":240}

        '
  # the song was asked for two seconds before the end and never heard
  - run:
      command: gozen trace trace.jsonl --check --music-late 1 --format json
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: $.status, equals: failed}
        - {path: '$.data.issues[0].kind', equals: music-late}
        - {path: '$.data.issues[0].code', equals: GZN1403}
  - run:
      command: gozen trace trace.jsonl --check --music-late 3 --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.status, equals: ok}
        - {path: $.data.issues, length: 0}
- name: simulation option ${name}
  matrix:
  # sim battle: the worn item raises nothing the fight needs, so the numbers stay whole
  - {name: 'battle --hp --streak --no-tree --gear', args: 'sim battle --troop lesson -n 3 --seed 9 --hp --streak 2 --no-tree --gear hatchet', path: '$.data[0].streak.p50', value: 2}
  - {name: 'battle --hp', args: 'sim battle --troop lesson -n 3 --seed 9 --hp', path: '$.data[0].hp_left.p50', value: 1}
  # sim dive: a guard before the stairs, a rest every two floors, a shop and the game's events
  - {name: 'dive --guards', args: 'sim dive --location pit --floors 2 --battles 1 --tries 1 --guards 1:lesson --rest 2 --shops stall --events', path: '$.data.floors[0].guard', value: lesson}
  steps:
  - run:
      command: gozen ${args} --format json "${specdir}/fixtures/outfitting"
      deterministic:
        runs: 2
        compare: [stdout, stderr, exit_code]
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.status, equals: ok}
        - {path: '${path}', equals: '${value}'}
      changes: {created: [], modified: [], deleted: []}
- name: floors --no-map prints the numbers without the maps
  steps:
  - run:
      command: gozen sim floors "${specdir}/fixtures/outfitting" --location pit --floor 1
  - assert:
      exit_code: 0
      stdout: {contains: ['11x11 open', '#']}
  - run:
      command: gozen sim floors "${specdir}/fixtures/outfitting" --location pit --floor 1 --no-map
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout: {contains: '11x11 open', not_contains: '#'}
- name: routes limits are reported, never mistaken for a full exploration
  steps:
  - run:
      command: gozen sim routes "${specdir}/../../examples/novel/game" --paths 1 --format json
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout:
        json:
        - {path: $.status, equals: ok}
        - {path: $.data.paths, equals: 1}
        - {path: $.data.truncated, equals: true}
  - run:
      command: gozen sim routes "${specdir}/../../examples/novel/game" --format json
  - assert:
      exit_code: 0
      stdout:
        json:
        - {path: $.data.paths, equals: 5}
        - {path: $.data.truncated, equals: false}
  # a path cut by --depth is a failure, not an ending
  - run:
      command: gozen sim routes "${specdir}/../../examples/novel/game" --depth 2 --format json
  - assert:
      exit_code: 1
      stdout:
        json:
        - {path: $.status, equals: failed}
        - {path: '$.data.errors[0]', matches: 'do not end'}
- name: batch plays cases with a one-game cache and rejects a cache of none
  steps:
  - fixture: {file: wait.txt, content: "wait 5\nquit\n"}
  - run:
      command: python3 -c "import json,sys; open('cases.jsonl','w').write(''.join(json.dumps({'id':i,'args':[g,'--start',s,'--script','wait.txt','--trace',i+'.jsonl']})+chr(10) for i,g,s in (('a',sys.argv[1],'camp'),('b',sys.argv[2],'depot'),('c',sys.argv[1],'camp'))))" "${specdir}/fixtures/game" "${specdir}/fixtures/outfitting"
  - assert: {exit_code: 0}
  - run:
      command: gozen sim batch --cases cases.jsonl --games 1
  - assert:
      exit_code: 0
      stderr: {equals: ''}
      stdout: {contains: ['"id":"a","status":"ok"', '"id":"b","status":"ok"', '"id":"c","status":"ok"', '"succeeded":3,"failed":0']}
  - assert: {file: {path: c.jsonl, contains: '"location":"camp"'}}
  - assert: {file: {path: b.jsonl, contains: '"location":"depot"'}}
  - run:
      command: gozen sim batch --cases cases.jsonl --games 0
  - assert:
      exit_code: 2
      stdout: {equals: ''}
      stderr:
        json:
        - {path: $.code, equals: GZN2201}
- name: faces --preview writes nothing for a game with no standing pictures
  steps:
  - run:
      command: gozen faces "${specdir}/fixtures/outfitting" --preview preview
  - assert:
      exit_code: 0
      stdout: {contains: nothing to do}
      changes: {created: [], modified: [], deleted: []}
