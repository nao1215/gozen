name: Website

# Builds the documentation site (website/) with Hugo, indexes it with Pagefind,
# and publishes it to GitHub Pages.
#
# The repository has a limited Actions budget while it is private (see
# docs/development/ci.md), so every job runs only once the repository is public,
# or when started by hand with workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/images/**"
      - "docs/schema.md"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/images/**"
      - "docs/schema.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: d9c8b17285ea4ec004d9f814273ea910f2051ce02c284993fd1f91ba455ae50d
      PAGEFIND_VERSION: 1.5.2
      PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/hugo.tar.gz" hugo
          sudo mv "${RUNNER_TEMP}/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build website
        # The commit is stamped into every page so the deploy can be verified
        # afterwards. Hugo reads HUGO_PARAMS_* as config overrides. The build
        # fails when docs/schema.md has a cell without English in
        # website/data/schema_en.yaml, or a page refers to a missing image.
        run: make website
        env:
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}

      - name: Index the site with Pagefind
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/pagefind.tar.gz" \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  ${RUNNER_TEMP}/pagefind.tar.gz" | sha256sum --check -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/pagefind.tar.gz" pagefind
          "${RUNNER_TEMP}/pagefind" --site website/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    if: ${{ github.event_name != 'pull_request' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A green deploy step means the artifact was accepted, not that the site a
  # reader loads is the one just built. This fetches the live site and checks
  # that the build commit matches and that the main pages are there.
  # The retry is bounded and fails loudly when the bound is reached.
  verify:
    if: ${{ github.event_name != 'pull_request' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      SITE: https://nao1215.github.io/gozen/
      EXPECTED_SHA: ${{ github.sha }}
      MAX_ATTEMPTS: "10"
      SLEEP_SECONDS: "20"
    steps:
      - name: Wait for the deployed commit to go live
        run: |
          attempt=1
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            # Hugo's minifier may drop the quotes around the attribute value,
            # so match the tag and then pull the 40-hex commit out of it.
            live=$(curl -fsSL --max-time 30 "${SITE}?cachebust=${GITHUB_RUN_ID}-${attempt}" \
              | grep -o 'gozen-build-commit[^>]*' \
              | grep -o '[0-9a-f]\{40\}') || live=""
            if [ "${live}" = "${EXPECTED_SHA}" ]; then
              echo "the live site is ${live}"
              exit 0
            fi
            echo "attempt ${attempt}/${MAX_ATTEMPTS}: live is '${live}', want '${EXPECTED_SHA}'"
            attempt=$((attempt + 1))
            [ "${attempt}" -le "${MAX_ATTEMPTS}" ] && sleep "${SLEEP_SECONDS}"
          done
          echo "::error::the deployed commit ${EXPECTED_SHA} did not appear on ${SITE} within $((MAX_ATTEMPTS * SLEEP_SECONDS))s" >&2
          exit 1

      - name: Check the main pages
        run: |
          fetch() {
            curl -fsSL --max-time 30 "${SITE}$1?cachebust=${GITHUB_RUN_ID}" | tr -s '[:space:]' ' '
          }
          require() {
            case "$1" in
              *"$2"*) ;;
              *) echo "::error::the deployed $3 page does not contain: $2" >&2; exit 1 ;;
            esac
          }

          schema=$(fetch schema/)
          for name in schema_version BattleCfg Command DataFile Location; do
            require "${schema}" "${name}" "schema"
          done

          commands=$(fetch commands/)
          for cmd in check layout sim curve floors trace book design memos release trial shots prompt mosaic version; do
            require "${commands}" "gozen ${cmd}" "commands"
          done

          loop=$(fetch edit-play-loop/)
          for flag in --dev --from-memo --autoplay --trace --replay F5 F7 F9; do
            require "${loop}" "${flag}" "edit-play-loop"
          done
          echo "the deployed pages are in place"
