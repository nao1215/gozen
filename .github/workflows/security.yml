name: Security

# govulncheck answers whether a known advisory in the standard library or a
# dependency is reachable from this module's call graph; gosec in golangci-lint
# looks at the code this repository writes. The vulnerability database changes
# every day, so the schedule catches a new advisory against the dependencies
# already in go.sum. While the repository is private the daily run is skipped to
# save the Actions budget (docs/development/ci.md); pushes and pull requests
# still scan.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # Tells the jobs below whether a pull request changes more than documentation
    # (scripts/ci_changes.sh, docs/development/ci.md). Jobs are skipped with `if`, not
    # with on.paths: a workflow that never starts leaves its required checks pending.
    # Fail-open: only an answer of false skips; a failure of this job runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: scope
        run: ./scripts/ci_changes.sh

  govulncheck:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' || !github.event.repository.private) }}
    name: govulncheck (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every Go line this module supports: a standard-library advisory is fixed in
    # a specific patch, so an advisory fixed in the newest Go can still be live for
    # someone building with the minimum. Keep the first entry equal to the go
    # directive in go.mod.
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26.10"
          - "stable"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Pinned so a scanner release cannot change the verdict on its own. The
      # advisory database is intentionally not pinned. The install step alone may
      # switch toolchains to build the scanner; the scan runs with the matrix Go.
      - name: Install govulncheck
        if: needs.changes.outputs.code != 'false'
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # ACCEPTED lists advisories this module is known to reach and has defended
      # against on its own side, one ID each, with why, which test holds the
      # defense, and when to remove it. Leave it empty when there are none. Any
      # other reachable advisory fails the job and prints the text report. cgo is
      # on so the ONNX bindings of the mosaic command are scanned too.
      - name: Scan the module
        if: needs.changes.outputs.code != 'false'
        env:
          ACCEPTED: ""
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          jq -e -s 'length > 0' "$RUNNER_TEMP/govulncheck.json" > /dev/null
          jq -r 'select(.finding != null and (.finding.trace[0].function // "") != "") | .finding.osv' \
            "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/called.txt"
          tr ' ' '\n' <<< "$ACCEPTED" | sed '/^$/d' > "$RUNNER_TEMP/accepted.txt"
          if grep -vxF -f "$RUNNER_TEMP/accepted.txt" "$RUNNER_TEMP/called.txt"; then
            echo "::error::govulncheck found an advisory that is not in ACCEPTED"
            govulncheck ./...
            exit 1
          fi

  codeql:
    # Code scanning uploads require GitHub Code Security on private repositories,
    # so the job runs only once the repository is public. govulncheck runs either way.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only write permission: publish code-scanning results for this job.
    # actions: read lets the CodeQL action read the workflow run it reports for.
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Initialize Go analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          build-mode: manual
      - name: Build the complete root module for extraction
        run: go build -trimpath -buildvcs=false ./...
      - name: Analyze Go
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:go
          # Fork PRs are analyzed without requesting a privileged upload.
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
