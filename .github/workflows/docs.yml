name: Docs

# README.md and the website must show what the code does now
# (docs/development/docs.md):
# - images: remake every picture of docs/images/manifest.yaml from the samples
#   under Xvfb and fail when a committed one is stale (make docs-images-check);
# - steps: run the shell steps of README.md and website/content against this
#   checkout (make docs-steps).
# The checks that need no display (the manifest against the references, the
# verify marks, the YAML examples, README links) run in go test ./... (CI).
#
# Like the other full jobs, these run once the repository is public, or by hand
# (docs/development/ci.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only superseded runs of the same pull request are canceled. Main and manual
# runs get separate groups so their verification always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOZEN_DOCS_SHARD: ${{ matrix.shard }}/4
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      # A pull request that changes only words, the website, workflows or tests outside
      # internal/dev/docs cannot change a picture, so it skips the remake. Any other
      # file (code, samples, scripts, the manifest, docs/images, unknown files) runs it,
      # and so does every push and manual run.
      - name: Decide whether the pictures can change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r f; do
            case "${f}" in
              "") ;;
              docs/images/* | internal/dev/docs/* | .github/workflows/docs.yml) run=true ;;
              *.md | website/* | .github/* | e2e/* | bench/* | skills/* | LICENSE | *_test.go) ;;
              *) run=true ;;
            esac
          done <<< "$files"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "remake the pictures: ${run}"
      - id: go
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main per revision, restoring the latest matching dependency cache.
      - name: Restore the Go caches of this job
        if: steps.scope.outputs.run == 'true'
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-part${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-part${{ matrix.shard }}-
            go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          xvfb: true
      - name: Install ffmpeg
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Shared captures stay together; all four shards cover the complete ledger.
      # Each runner also plays independent captures in parallel, one per CPU.
      - name: Remake the pictures and compare them with the committed ones
        if: steps.scope.outputs.run == 'true'
        run: make docs-images-check
      - name: Keep the fresh pictures of a failed check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images-${{ matrix.shard }}
          path: build/docs-images/out
          retention-days: 7
      - name: Save the Go caches of this job
        if: ${{ steps.scope.outputs.run == 'true' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Keep the existing required check name while testing every shard independently.
  images:
    needs: image-shards
    if: ${{ always() && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every image shard to pass
        env:
          RESULT: ${{ needs.image-shards.result }}
        run: test "$RESULT" = success

  steps:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main per revision, restoring the latest matching dependency cache.
      - name: Restore the Go caches of this job
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
      # One step runs the sample game under xvfb-run (website/content/install.md).
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        with:
          xvfb: true
      - name: Run the steps of README.md and the website
        run: make docs-steps
        env:
          CGO_ENABLED: "1"
      - name: Save the Go caches of this job
        if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
