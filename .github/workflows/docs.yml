name: Docs

# README.md and the website must show what the code does now
# (docs/development/docs.md):
# - images: remake every picture of docs/images/manifest.yaml from the samples
#   under Xvfb and fail when a committed one is stale (make docs-images-check);
# - steps: run the shell steps of README.md and website/content against this
#   checkout (make docs-steps).
# The checks that need no display (the manifest against the references, the
# verify marks, the YAML examples, README links) run in go test ./... (CI).
#
# The fast check of the pictures runs in the CI workflow (docs-images-fresh): it
# compares the hashes of what makes each picture with docs/images/inputs.sum, so a
# change that can alter a picture fails there until make docs-images has rewritten
# that file. The full remake here therefore runs when a push or pull request changes
# docs/images (the pictures, the manifest or inputs.sum), the code that makes them
# (internal/dev/docs) or this workflow, and every night, to prove that the hashes and
# the pictures still agree (a new ffmpeg or runner image is not in the hashes).
#
# Like the other full jobs, these run once the repository is public, or by hand
# (docs/development/ci.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Only superseded runs of the same pull request are canceled. Main and manual
# runs get separate groups so their verification always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOZEN_DOCS_SHARD: ${{ matrix.shard }}/4
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      # Only a change to docs/images, internal/dev/docs or this workflow can make a
      # picture differ from what inputs.sum says it was made from: every other input
      # is in the hashes, which docs-images-fresh of the CI workflow checks. Nightly,
      # manual runs and an unreadable diff always remake everything.
      - name: Decide whether the pictures can change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != pull_request ] && [ "${EVENT}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r f; do
            case "${f}" in
              docs/images/* | internal/dev/docs/* | .github/workflows/docs.yml) run=true ;;
            esac
          done <<< "$files"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "remake the pictures: ${run}"
      - id: go
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main per revision, restoring the latest matching dependency cache.
      - name: Restore the Go caches of this job
        if: steps.scope.outputs.run == 'true'
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-part${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-part${{ matrix.shard }}-
            go-${{ runner.os }}-images-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
      # The Azure mirror can keep transferring at very low speed without timing out.
      # Prefer the official Ubuntu HTTPS archive, retaining the runner's fallbacks.
      - name: Prefer the Ubuntu archive mirror
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              -e '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|s/priority:1/priority:2/' \
              -e '\|^https://archive\.ubuntu\.com/ubuntu/|s/priority:2/priority:1/' \
              /etc/apt/apt-mirrors.txt
          fi
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          xvfb: true
      - name: Install ffmpeg
        if: steps.scope.outputs.run == 'true'
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
      # Shared captures stay together; all four shards cover the complete ledger.
      # Each runner also plays independent captures in parallel, one per CPU.
      - name: Remake the pictures and compare them with the committed ones
        if: steps.scope.outputs.run == 'true'
        run: |
          if ! make docs-images-check; then
            echo "::error file=docs/images/manifest.yaml,title=Stale documentation pictures::The log above names each stale picture. Run make docs-images (or ONLY=name,... make docs-images) and commit the pictures with docs/images/inputs.sum; the fresh pictures are in the artifact docs-images-${GOZEN_DOCS_SHARD%%/*}."
            exit 1
          fi
      - name: Keep the fresh pictures of a failed check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images-${{ matrix.shard }}
          path: build/docs-images/out
          retention-days: 7
      - name: Save the Go caches of this job
        if: ${{ steps.scope.outputs.run == 'true' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Keep the existing required check name while testing every shard independently.
  images:
    needs: image-shards
    if: ${{ always() && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every image shard to pass
        env:
          RESULT: ${{ needs.image-shards.result }}
        run: test "$RESULT" = success

  steps:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether executable documentation can change
        id: scope
        run: ./scripts/ci_changes.sh
      - id: go
        if: steps.scope.outputs.docs_runtime != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main per revision, restoring the latest matching dependency cache.
      - name: Restore the Go caches of this job
        if: steps.scope.outputs.docs_runtime != 'false'
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
      # One step runs the sample game under xvfb-run (website/content/install.md).
      - if: steps.scope.outputs.docs_runtime != 'false'
        uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        with:
          xvfb: true
      - name: Run the steps of README.md and the website
        if: steps.scope.outputs.docs_runtime != 'false'
        run: make docs-steps
        env:
          CGO_ENABLED: "1"
      - name: Save the Go caches of this job
        if: ${{ steps.scope.outputs.docs_runtime != 'false' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
