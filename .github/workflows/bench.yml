name: Benchmark

on:
  pull_request:
  workflow_dispatch:

# Cancel only superseded pull-request comparisons; manual runs finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# gozen is measured end to end with himorime, from bench/himorime.yaml.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds it and the head with the same Go, and
# measures both in interleaved rounds on this runner, so a noisy neighbour
# slows both revisions instead of one. The job fails when the head is slower,
# uses more CPU time or more memory than the base beyond the tolerance of the
# suite with 95% confidence; a difference too close to call is inconclusive
# and does not fail it. The comparison is written to the job summary.
#
# Started by hand or with changed benchmark definitions, the job measures
# the ref it runs on without comparing.
# While the repository is private, pull requests skip the job to save the
# Actions budget (docs/development/ci.md).
jobs:
  changes:
    # Tells the jobs below whether a pull request changes more than documentation
    # (scripts/ci_changes.sh, docs/development/ci.md). Jobs are skipped with `if`, not
    # with on.paths: a workflow that never starts leaves its required checks pending.
    # Fail-open: only an answer of false skips; a failure of this job runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: scope
        run: ./scripts/ci_changes.sh

  bench:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: nao1215/setup-himorime@14aeeb3fe55ad42cf29ee0802d578820faac3897 # v0.1.2
        with:
          version: v0.5.2
      - name: Check whether the benchmark definition is comparable
        if: github.event_name == 'pull_request'
        id: definition
        env:
          BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BENCH_BASE_SHA" HEAD -- bench/himorime.yaml; then
            echo 'comparable=true' >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
            echo 'Benchmark definition changed; measuring this revision without a baseline comparison.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare the base with the head
        if: github.event_name == 'pull_request' && steps.definition.outputs.comparable == 'true'
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request' || steps.definition.outputs.comparable == 'false'
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: himorime-report
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
