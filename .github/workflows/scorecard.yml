# OpenSSF Scorecard. Results are published to api.scorecard.dev (for the README badge) and uploaded to code scanning; both are free for public repositories.
# publish_results: true makes the Scorecard API verify this file: no workflow-level env/defaults or write permissions, one ubuntu job, and only the steps below.
# Publishing and code scanning need a public repository, so the job is skipped while the repository is private (docs/development/ci.md).
name: Scorecard

on:
  # Only the default branch is supported.
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  branch_protection_rule:
  # Re-score on demand after changing repository settings that fire no event (rulesets, security settings).
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
