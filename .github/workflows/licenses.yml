name: licenses

# Dependency license gate. Every module linked into what this repository ships
# must carry a license that go-licenses can identify, and that license must not
# be copyleft that reaches the whole binary (GPL, LGPL: a statically linked Go
# binary cannot be relinked, so LGPL's exception does not help) or forbidden
# outright (AGPL, non-commercial Creative Commons, Commons Clause).
#
# Reciprocal licenses (MPL-2.0, EPL) are allowed: they bind only the files they
# cover, and the release archives ship those modules' source next to the binary
# (go-licenses save copies it), which is what they ask for.
#
# The check runs per GOOS because the set of linked modules differs by target
# (Ebitengine and its audio libraries pick different packages per platform).
# Keep the matrix equal to the goos list of .goreleaser.yml. There is no
# schedule: go.sum pins every version, so the verdict only changes when a pull
# request changes the dependencies. While the repository is private the job runs
# only on manual dispatch, to save the Actions budget (docs/development/ci.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: licenses (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # stable, not the go.mod minimum: go-licenses needs Go 1.23 to build and
      # the module graph it reads does not depend on the toolchain version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # Pinned so a classifier update cannot change the verdict on its own.
      # Installed before GOOS is set: the tool itself runs on the runner.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      # Gozen is a library and a command, so the whole module is checked
      # ("./..." includes ./cmd/gozen, which the release archives ship).
      # CGO_ENABLED matches the goreleaser builds: the released gozen has no
      # ONNX inference (ADR 0016), and the cgo adapter adds no module.
      # IGNORED lists package paths whose license go-licenses cannot classify
      # but a human has read, one per entry, with the license chosen and why it
      # is acceptable in a comment. An ignored module is also skipped by
      # go-licenses save, so .goreleaser.yml must copy its license text into
      # the bundle by hand. Leave it empty when there are none.
      #
      # GOROOT is set explicitly because go-licenses recognizes the standard
      # library by path prefix: after a toolchain switch (go.mod asking for a
      # newer patch than the runner has) it would otherwise report every
      # stdlib package as "does not have module info".
      - name: Check dependency licenses
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
          IGNORED: ""
        run: |
          GOROOT="$(go env GOROOT)"
          export GOROOT
          args=()
          for m in $IGNORED; do args+=(--ignore "$m"); done
          go-licenses check --disallowed_types=forbidden,restricted,unknown "${args[@]}" ./...
