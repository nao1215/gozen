name: Release Smoke

# Builds the GoReleaser artifacts in snapshot mode (nothing is published) and
# runs them, on every pull request and push to main, so a packaging mistake is
# found before a tag: the contents and checksums of every archive and package on
# Linux, and the binary (gozen --version, gozen help, gozen version, gozen check)
# on Linux, macOS and Windows. Building is cross-compilation and happens once on
# Ubuntu; the macOS and Windows binaries run on their own runners.
#
# The Release workflow calls the same jobs before it publishes a tag.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Tells the jobs below whether a pull request changes more than documentation
    # (scripts/ci_changes.sh, docs/development/ci.md). Jobs are skipped with `if`, not
    # with on.paths: a workflow that never starts leaves its required checks pending.
    # Fail-open: only an answer of false skips; a failure of this job runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: scope
        run: ./scripts/ci_changes.sh

  smoke:
    name: Smoke-test artifacts on Linux
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Published binaries are built with the newest Go, not go.mod's minimum,
      # so users of a prebuilt artifact get the current runtime and its fixes.
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # Tag releases and manual verification always use clean caches.
          cache: false

      # Only branch CI restores this cache. Main is its only writer; release
      # calls from tags never restore or save it.
      - name: Restore snapshot build caches
        id: snapshot-cache
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-

      - name: Install package inspection and desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xvfb xauth libgl1 libegl1 libasound2t64

      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Build artifacts (snapshot, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: xvfb-run --auto-servernum --error-file=/dev/stderr ./scripts/smoke_artifacts.sh dist

      - name: Upload artifacts for the macOS and Windows smoke jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Save snapshot build caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.snapshot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.snapshot-cache.outputs.cache-primary-key }}

  smoke-cross:
    name: Smoke-test artifacts on ${{ matrix.os }}
    needs: smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-snapshot
          path: dist

      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3

      - name: Smoke-test the macOS artifacts
        if: runner.os == 'macOS'
        run: ./scripts/smoke_artifacts.sh dist

      - name: Smoke-test the Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $zip = Get-ChildItem "dist/gozen_*_windows_$arch.zip" | Select-Object -First 1
          if (-not $zip) { throw "no Windows $arch archive" }
          $out = Join-Path $env:RUNNER_TEMP gozen
          Expand-Archive -Path $zip.FullName -DestinationPath $out
          foreach ($f in 'gozen.exe', 'LICENSE', 'THIRD_PARTY_LICENSES/github.com/hajimehoshi/ebiten/v2/LICENSE') {
            if (-not (Test-Path (Join-Path $out $f))) { throw "$($zip.Name) has no $f" }
          }
          $exe = Join-Path $out gozen.exe
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notlike 'gozen v*') { throw "gozen --version printed '$version'" }
          $help = & $exe help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notlike '*Usage*') { throw "gozen help failed" }
          $version = & $exe version
          if ($LASTEXITCODE -ne 0 -or $version -notlike 'gozen v*') { throw "gozen version printed '$version'" }
          & $exe check e2e/atago/fixtures/game
          if ($LASTEXITCODE -ne 0) { throw "gozen check failed" }
          $runtimeZip = Get-ChildItem "dist/gozen-runtime_*_windows_$arch.zip" | Select-Object -First 1
          if (-not $runtimeZip) { throw "no Windows runtime archive" }
          $runtimeDir = Join-Path $env:RUNNER_TEMP gozen-runtime
          Expand-Archive -Path $runtimeZip.FullName -DestinationPath $runtimeDir
          $env:GOZEN_RUNTIME = $runtimeDir
          $env:GOZEN_EXE_SUFFIX = '.exe'
          $env:PATH = $out + [IO.Path]::PathSeparator + $env:PATH
          atago run --ci --parallel 1 --tag desktop e2e/atago/desktop.atago.yaml
          if ($LASTEXITCODE -ne 0) { throw "packaged desktop gameplay failed" }
