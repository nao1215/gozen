name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only superseded runs of the same pull request are canceled. Main and manual
# runs get separate groups so their verification always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Tells the jobs below whether a pull request changes more than documentation
    # (scripts/ci_changes.sh, docs/development/ci.md). Jobs are skipped with `if`, not
    # with on.paths: a workflow that never starts leaves its required checks pending.
    # Fail-open: only an answer of false skips; a failure of this job runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: scope
        run: ./scripts/ci_changes.sh

  quick:
    # Cheap check for private pushes: vet and tests on Linux under Xvfb.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event.repository.private && github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        with:
          xvfb: true
      - run: go vet ./...
      - run: xvfb-run --auto-servernum go test -count=1 ./...
  docs-checks:
    # A pull request that changes only documentation skips the jobs above. The checks
    # that read the documentation run here instead: the README, links, code blocks and
    # pictures list (internal/dev/docs), the generated errors page (internal/diag) and
    # the pages that the schema tests read (internal/layer2/gamedata).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/dev/docs/... ./internal/diag/... ./internal/layer2/gamedata/...

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not stable: gofmt's output differs between Go releases, so the
      # formatting check runs on one pinned Go. make lint builds and runs
      # golangci-lint with LINT_GO of the Makefile; keep this equal to it so no
      # toolchain is downloaded.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Install pinned development tools
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx install zizmor==1.31.1
      - name: Check architecture, API, modules, workflows, analysis, and formatting
        run: make lint

  unit:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26.10", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          go-version: ${{ matrix.go }}
      # One module: the gozen command and its internal implementations are tested.
      - run: go test ./...
        if: needs.changes.outputs.code != 'false'
        env:
          CGO_ENABLED: "1"

  build:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
          # The browser build (play.New with localStorage saves; ADR 0021).
          - os: ubuntu-latest
            goos: js
            goarch: wasm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Portable builds omit ONNX inference. Native cgo builds are checked below.
      # arm64 rows are cross-builds, not runtime verification.
      - run: go build -trimpath -buildvcs=false ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  graphics:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        with:
          xvfb: true
      # The release binary (checksum checked) instead of go install: no build in each job.
      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.2
      - name: Render on Linux with Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --error-file=/dev/stderr make graphics
      # The Go Zen sample's screens take minutes; they run only when started by hand.
      - name: Render the Go Zen sample on Linux with Xvfb
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum --error-file=/dev/stderr make go-zen-graphics
      - name: Render the novel sample on Linux with Xvfb
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum --error-file=/dev/stderr make novel-graphics
      - name: Render the campaign sample on Linux with Xvfb
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum --error-file=/dev/stderr make campaign-graphics
      # Native desktop execution is required on Windows/macOS; failures remain fatal.
      # Local Linux results do not establish these runners can render.
      - name: Render on the native desktop
        if: runner.os != 'Linux'
        run: go test -tags=graphics ./play ./puppet -run TestGraphics -count=1
      - name: Capture the CLI screenshot pipeline on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --error-file=/dev/stderr make e2e-graphics
      - name: Capture the CLI screenshot pipeline on the native desktop
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, build/atago | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          go build -trimpath -buildvcs=false -ldflags=-compressdwarf=false -o "bin/gozen$suffix" ./cmd/gozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -ldflags=-compressdwarf=false -o "bin/gozen-game$suffix" ./play/testdata/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $PWD bin) + [IO.Path]::PathSeparator + $env:PATH
          $env:GOZEN_GAME_BIN = Join-Path $PWD "bin/gozen-game$suffix"
          Push-Location build/atago
          try {
            atago run --ci --parallel 1 --tag graphics ../../e2e/atago
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

  cli-e2e:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          go-version: stable
      # The release binary (checksum checked) instead of go install: no build in each job.
      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        if: needs.changes.outputs.code != 'false'
        with:
          version: v0.25.2
      - name: Build and exercise native CLI binaries
        if: needs.changes.outputs.code != 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, build/atago | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          go build -trimpath -buildvcs=false -ldflags=-compressdwarf=false -o "bin/gozen$suffix" ./cmd/gozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $PWD bin) + [IO.Path]::PathSeparator + $env:PATH
          Push-Location build/atago
          try {
            atago run --ci --parallel 4 --skip-tag graphics ../../e2e/atago
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

  inference-build:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Compile the native ONNX adapters and run available inference tests
        run: go test -v ./internal/mosaic/... -run TestONNX -count=1
        env:
          CGO_ENABLED: "1"
      - name: Build the inference-capable CLI
        run: go build -trimpath -buildvcs=false -ldflags=-compressdwarf=false -o bin/ ./cmd/gozen
        env:
          CGO_ENABLED: "1"

  race:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main once per Go and go.sum.
      - name: Restore the Go caches of this job
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      # -short skips the heavy tests (covSlow); the full run without -race is in the test job.
      - name: Check non-graphics contracts for races
        run: go test -race -short ./...
        env:
          CGO_ENABLED: "1"
      - name: Save the Go caches of this job
        if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  examples:
    # Full matrix while public, or on manual dispatch. Private repositories have a
    # limited Actions budget, so pushes there run only the quick job below.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Compile all examples, including the graphical host
        run: go build -trimpath -buildvcs=false ./examples/...
      - name: Run the minimal embedded game
        run: go run ./examples/minimal
      - name: Run the headless save and restore example
        run: go run ./examples/headless

  go-zen:
    # examples/go-zen, examples/novel and examples/campaign are modules of their own (they use this
    # checkout through a replace), so ./... and ./examples/... above do not reach them.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/go-zen/go.mod
          cache: false
      # This job's own Go caches. setup-go keeps one cache per Go version and go.sum for
      # every job, saved by whichever job ends first (often a short cross-build), so the
      # builds of this job would not be in it. Saved from main once per Go and go.sum.
      - name: Restore the Go caches of this job
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
      - name: Vet, check and test the Go Zen sample (its screens are in the graphics job)
        run: make go-zen
      - name: Vet, check and test the novel sample (its screens are in the graphics job)
        run: make novel
      - name: Vet, check and test the campaign sample (its screens are in the graphics job)
        run: make campaign
      - name: Save the Go caches of this job
        if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
