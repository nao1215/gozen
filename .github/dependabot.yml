version: 2
updates:
  # examples/go-zen and examples/novel are modules of their own; their go.sum is checked
  # in CI (make go-zen, make novel).
  - package-ecosystem: gomod
    directories:
      - /
      - /examples/go-zen
      - /examples/novel
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
