# generated by octocov init
coverage:
  paths:
    - coverage.out
  # Measured with -coverpkg=./... across the whole module (about 51.7% when this
  # file was written), so cross-package tests count toward the package they
  # exercise. Keep this below the measured value and raise it as coverage grows.
  acceptable: 50%
  # Not part of the library or the gozen command: sample games, the generators
  # and checkers under internal/dev, and the test fixture game.
  exclude:
    - "**/examples/**"
    - "**/internal/dev/**"
    - "**/internal/testgame/**"
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  hideFooterLink: false
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
