<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A playable sample made with Gozen.">
<meta name="theme-color" content="#10181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gozen sample</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #10181c; color: #f4f1e6; font-family: sans-serif;
    /* a swipe must not scroll, zoom or pull the page, and a long press must not select */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { touch-action: none; }
  /* above the game's canvas, which the program makes as soon as it starts */
  #loading { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 1rem;
    align-items: center; justify-content: center; padding: 0 16px; text-align: center;
    font-size: 1.2rem; background: #10181c; }
  #bar { width: min(24rem, 80vw); height: 0.5rem; background: #2a363c; border-radius: 0.25rem; overflow: hidden; }
  #bar div { width: 0; height: 100%; background: #c9a85a; }
  #hint { font-size: 0.9rem; color: #b8b4a6; max-width: 28em; }
</style>
</head>
<body>
<div id="loading">
  <div id="note">Loading game...</div>
  <div id="bar"><div></div></div>
  <div id="hint">The game is about @DOWNLOAD_MB@ MB to download. The sound starts once you first touch the screen or press a key.</div>
  <noscript>This game needs JavaScript and WebAssembly.</noscript>
</div>
<script src="../runtime/wasm_exec.js"></script>
<script>
  "use strict";
  // The program calls these when the game starts, draws its first frame, or cannot start.
  // goZenTimes keeps the startup times for scripts/web_play_check.mjs.
  const note = document.getElementById("note");
  const bar = document.querySelector("#bar div");
  const mb = (n) => (n / 1e6).toFixed(1);
  window.goZenTimes = {};
  window.goZenStarting = (title) => {
    document.title = title;
    goZenTimes.starting = performance.now();
    note.textContent = "Starting the game...";
    bar.style.width = "100%";
  };
  window.goZenReady = () => {
    goZenTimes.ready = performance.now();
    document.getElementById("loading").remove();
  };
  window.goZenFail = (msg) => { note.textContent = "Could not start: " + msg; };
  // Long presses and right clicks would open menus over the game.
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // The size of gozen-player.wasm, written in by make website: the server may send it
  // compressed, and then its Content-Length is not what is read.
  const wasmSize = Number("@WASM_SIZE@") || 0;
  // The program is counted as it comes in and compiled while it does.
  const counted = (res) => {
    if (!res.ok) throw new Error(`gozen-player.wasm: ${res.status} ${res.statusText}`);
    if (!wasmSize || !res.body) return res;
    let got = 0;
    const reader = res.body.getReader();
    const body = new ReadableStream({
      async pull(c) {
        const { done, value } = await reader.read();
        if (done) { c.close(); return; }
        got += value.length;
        note.textContent = `Loading the program: ${mb(got)} MB / ${mb(wasmSize)} MB`;
        bar.style.width = `${Math.min(100, (100 * got) / wasmSize)}%`;
        c.enqueue(value);
      },
    });
    return new Response(body, { headers: { "Content-Type": "application/wasm" } });
  };

  note.textContent = "Loading the program...";
  if (typeof WebAssembly !== "object") {
    note.textContent = "Could not start: this browser cannot run WebAssembly.";
  } else {
    const go = new Go();
    // Fetch a plain .gz file so static hosts need not configure Content-Encoding.
    // DecompressStream restores the wasm response for instantiateStreaming.
    const wasm = fetch("../runtime/gozen-player.wasm.gz").then((res) => {
      if (!res.ok) throw new Error(`gozen-player.wasm.gz: ${res.status} ${res.statusText}`);
      if (!res.body || typeof DecompressionStream !== "function") throw new Error("This browser cannot decompress the WebAssembly download.");
      return new Response(res.body.pipeThrough(new DecompressionStream("gzip")), { headers: { "Content-Type": "application/wasm" } });
    });
    WebAssembly.instantiateStreaming(wasm.then(counted), go.importObject).then((r) => {
      go.run(r.instance);
    }).catch((e) => {
      note.textContent = "Could not start: " + e;
    });
  }
</script>
</body>
</html>
