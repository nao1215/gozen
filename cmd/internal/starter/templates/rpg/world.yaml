    image: mote.png
    stats: {mhp: 20, mmp: 0, atk: 2, def: 1, mat: 1, mdf: 1, agi: 2, luk: 1}
    gold: 3
    ai: [{use: attack}]
troops:
  practice: {members: [mote]}
