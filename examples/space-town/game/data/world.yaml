locations:
  inn:
    name: Lantern Inn
    dungeon:
      depth: 16
      darkness: 0.1
      floor: '#b8ac8b'
      ceiling: '#9d917c'
      tiles:
        S: {start: true, facing: north}
        N:
          name: Innkeeper
          picture: innkeeper.png
          size: 0.6
          solid: true
          trigger: look
          once: true
          after: '.'
          do: [{set: {var.greetings: 'var.greetings + 1'}}]
        B:
          name: Guest bed
          picture: bed.png
          size: 0.4
          solid: true
          trigger: look
          do: [{set: {flag.bed_seen: true}}]
      space:
        render_width: 480
        daylight: 0.8
        lights:
          - {level: 2, x: 4, y: 3, height: 1.1, radius: 3, flicker: 0.2}
        materials:
          boards: {color: '#8a5a32'}
          glass: {color: '#f0c070', glow: 0.5}
        openings:
          - {level: 1, x: 1, y: 6, face: south, along: 1.3, bottom: 0.45, width: 1.4, height: 0.7, depth: 0.2, material: glass}
        floor_regions:
          - {level: 1, x: 2, y: 2, width: 5, depth: 4, material: boards}
          - {level: 2, x: 3, y: 2, width: 3, depth: 3, material: boards}
        levels:
          - |
              ..........
              .#######..
              .#.....#..
              .#.....#..
              .#.....#..
              .#.....#..
              .##..N##..
              ..........
              ...S......
              ..........
          - |
              __________
              __#####___
              __#...#___
              __#..B#___
              __#...#___
              ____...___
              ____.N.___
              __________
              __________
              __________
        stairs: [{level: 1, x: 3, y: 7, facing: north, length: 3, material: boards}]
