text:
  "After the Pass": "峠を越えて"
  "A quiet night at the tavern, after a long winter's work.": "冬の長い仕事を終えた、酒場の静かな夜。"
  "You": "あなた"
  "Brenna": "ブレンナ"
  "Wren": "レン"
  "Hedda": "ヘッダ"
  "The Copper Kettle": "銅のやかん亭"
  "You climb the last stretch of the hill with the wind at your back. Snow squeaks under every step.": "風を背に、丘の最後の坂を登る。一歩ごとに雪がきゅっと鳴る。"
  "Below you the village is dark, all but one window. Its light is copper-colored and steady, like a lantern left out for someone.": "眼下の村は暗く、明かりのある窓はひとつだけ。誰かのために置かれたランタンのように、銅色の光がじっと灯っている。"
  "Eleven days on the pass. That window is the first thing in all that time that has looked like home.": "峠で過ごした十一日。その間に見たもので、家のように見えたのはあの窓が初めてだ。"
  "You stamp the snow off your boots and push the door open. Warmth rolls over you, woodsmoke and baked apples and something with onions in it.": "ブーツの雪を踏み落として、扉を押し開ける。薪の煙と焼きリンゴ、それに玉ねぎの入った何かの匂いが、温かさと一緒に押し寄せてくる。"
  "The fire is roaring. Every chair in the room stands upside down on its table, except the ones pulled up around the hearth.": "暖炉の火が勢いよく燃えている。椅子はどれもテーブルの上に逆さまに載っていて、暖炉のまわりに引き寄せた数脚だけが残っている。"
  "Door. Shut it. You're letting the winter in.": "扉。閉めな。冬が入ってくるよ。"
  "There. Sit. I closed at nine, so anyone knocking now is ours.": "よし。座りな。店は九時に閉めたから、今叩く客はうちの客だ。"
  "Ale's on the counter. Cider's warming. The stew has been waiting since sundown, and so have I.": "エールはカウンターに。シードルは温めてある。シチューは日暮れから待ってるよ。あたしもね。"
  "The door bangs open again behind you, hard enough to rattle the shutters.": "背後で扉がまた勢いよく開き、鎧戸ががたがたと鳴る。"
  "HEDDA! Tell me that's cheese. Tell me that is an actual wheel of actual cheese!": "ヘッダ！ それチーズだろ。本物のチーズの塊だって言ってくれ！"
  "I have dreamed about it since the second night. Everyone else can have the stew. I'm moving in next to that rind.": "二日目の夜からずっと夢に見てたんだ。シチューはみんなにやる。あたしはそのチーズの皮の隣に住む。"
  "Armor off at the table, Brenna. Last time you dented my bench.": "テーブルでは鎧を脱ぎな、ブレンナ。この前はベンチを凹ませたろう。"
  "This is my party armor! It's polished! Look at it, it's practically a tablecloth!": "これは宴会用の鎧だぞ！ ぴかぴかだ！ ほら、もうほとんどテーブルクロスだろ！"
  "She clanks into a chair. The chair holds, bravely.": "彼女はがしゃんと椅子に腰を下ろす。椅子は健気に持ちこたえた。"
  "The door opens a third time, much more politely. Snow has frosted a pair of round glasses, and a purple braid swings in after them.": "扉がもう一度、今度はずっと礼儀正しく開く。雪で曇った丸眼鏡と、そのあとから紫の三つ編みが揺れて入ってくる。"
  "I checked the roofline on the way in. Snow load is acceptable. Nobody will need to dig this tavern out tonight.": "入る前に屋根の線を確認しました。積雪の荷重は許容範囲です。今夜、この酒場を掘り出す必要はないでしょう。"
  "I am here under protest, for the record. I had plans involving a book and a blanket.": "念のため言っておきますが、私は抗議の上でここにいます。本と毛布の予定があったので。"
  "Your book's by the fire. I put it there before you thought of it.": "あんたの本なら暖炉のそばだよ。あんたが思いつく前に置いといた。"
  "...That is irritatingly accurate. Thank you.": "……腹立たしいほど正確ですね。ありがとうございます。"
  "Hedda pours without asking. Ale for Brenna, a deep red wine for Wren, hot cider for you, with a cinnamon stick standing in it.": "ヘッダは何も聞かずに注いでいく。ブレンナにはエール、レンには深い赤のワイン、あなたにはシナモンスティックを立てた熱いシードル。"
  "Three mugs and one glass rise off the counter, and then everyone looks at you.": "三つのジョッキとひとつのグラスがカウンターから持ち上がり、全員の目があなたに向く。"
  "Somebody gets the first toast. Make it a good one.": "最初の乾杯は誰かのもの。いいのを頼むよ。"
  "Well? What do we drink to first?": "さあ、何に最初の乾杯をする？"
  "To Brenna's shield": "ブレンナの盾に"
  "You turn your cup toward the big dented shield propped beside the hearth.": "暖炉のそばに立てかけてある、凹んだ大きな盾にカップを向ける。"
  "My shield? Oh, you've gone and made me soft. Look, I'm tearing up. That's the cider steam.": "あたしの盾に？ おいおい、柔らかくなっちまうだろ。ほら、涙が出てきた。これはシードルの湯気のせいだ。"
  "Eleven days, every drift, every slide, and it never once complained. Best shield in the north. I'll hear no arguments.": "十一日間、吹きだまりも滑落も全部受けて、一度も文句を言わなかった。北で一番の盾だ。異論は聞かないぞ。"
  "The shield did not complain. You complained. Constantly.": "盾は文句を言いませんでした。文句を言ったのはあなたです。ずっと。"
  "Quietly! I complained quietly!": "小声でだよ！ 小声で言ってただけだ！"
  "Everyone drinks, Brenna loudest.": "みんなが杯を空ける。いちばん豪快なのはブレンナだ。"
  "To Wren's maps": "レンの地図に"
  "You lift your cup toward Wren, and the roll of maps sticking out of her satchel.": "レンと、彼女の鞄から突き出た地図の筒に向けてカップを掲げる。"
  "My maps? You are toasting paper.": "私の地図に？ 紙に乾杯するのですか。"
  "Paper with strong opinions about ridgelines, admittedly. Very well. I accept.": "稜線について強い意見を持った紙ではありますが。いいでしょう。受け取ります。"
  "She accepts! Look at her ears, they've gone pink!": "受け取るってさ！ 見ろよ、耳がピンクになってる！"
  "My ears are pink because of the cold.": "耳が赤いのは寒さのせいです。"
  "It's warm in here, Wren.": "ここは暖かいよ、レン。"
  "Wren takes a long, dignified sip of wine and says nothing more.": "レンは威厳たっぷりにワインをゆっくり一口飲み、それきり何も言わない。"
  "To Hedda, for keeping the door open": "扉を開けておいてくれたヘッダに"
  "You lift your cup toward the counter, and the woman behind it.": "カウンターと、その向こうの女主人にカップを掲げる。"
  "Me? Don't.": "あたしに？ やめとくれ。"
  "I lit a fire and I unlocked a door. That is the entire trick.": "火をおこして、扉の鍵を開けただけさ。種はそれだけだよ。"
  "Best trick in the world!": "世界一の手品だな！"
  "Drink your ale before I change my mind about the cheese.": "チーズを出すのをやめたくなる前に、エールを飲みな。"
  "She turns away to the stove, but not before you see her smile.": "彼女はかまどのほうへ背を向けるが、その前に笑ったのがあなたには見えた。"
  "Hedda sets the cheese board down with a thump, then goes back to the counter and lines up a few bottles along its edge.": "ヘッダはチーズの板をどんと置くと、カウンターへ戻って、その縁に瓶を数本並べる。"
  "You look down at the edge of the wooden counter. A few dark bottles with red caps stand around one stemmed glass of pale golden ale, a little foam on top.": "あなたは木のカウンターの縁を見下ろす。赤い栓をした黒っぽい瓶が数本、脚つきのグラスをひとつ囲んでいる。グラスには淡い金色のエールが入り、上に少し泡が乗っている。"
  "The light is warm and brown. For a while nobody says anything. There is only the fire, and the wind giving up against the shutters.": "光は温かい茶色をしている。しばらく誰も何も言わない。聞こえるのは暖炉の火と、鎧戸に負けて弱まっていく風の音だけ。"
  "Nine wagons. Do you remember? Nine! And old Corrin swore the pass would be open by noon.": "荷馬車は九台だぞ。覚えてるか？ 九台！ なのに爺さんのコリンは、昼までには峠が開くって言い張ってたんだ。"
  "It was open by noon. Noon of the following Thursday.": "確かに昼には開きました。翌週の木曜日の昼に。"
  "Brenna laughs so hard she has to put her mug down.": "ブレンナは笑いすぎて、ジョッキを置かなければならなくなる。"
  "And the village at the far end? They got their grain?": "それで、向こうの村は？ ちゃんと穀物は届いたのかい。"
  "Grain, lamp oil, and every crate of winter medicine. Every sack, Hedda. Not one dropped.": "穀物もランプ油も、冬の薬の箱も全部だ。袋ひとつ落としてないぞ、ヘッダ。"
  "Good. Then it was worth the cold.": "そうかい。なら、凍えた甲斐はあったね。"
  "Worth it. Sure. Though...": "甲斐はあった。そりゃあな。でも……"
  "She picks at the cheese rind and, for once, takes her time.": "彼女はチーズの皮をつまみながら、珍しくゆっくり言葉を選ぶ。"
  "Fourth day. The lead wagon started to slide on the ice, toward the drop. I got my shield down against the wheel and I just held on.": "四日目だ。先頭の馬車が氷の上を、崖のほうへ滑り出した。車輪に盾を噛ませて、とにかく踏ん張った。"
  "Everyone says, great, Brenna's a wall. Nobody asks what the wall is thinking.": "みんな、さすがブレンナは壁だって言う。壁が何を考えてるかは誰も聞かない。"
  "What was the wall thinking?": "壁は何を考えていたのですか。"
  "Mostly 'please don't let go,' over and over. My knees shook inside the armor the whole way down. I never told you.": "ほとんど『頼むから離れるな』をくり返してた。下りの間ずっと、鎧の中で膝が震えてたんだ。言ってなかったけどな。"
  "So when you drank to my shield first tonight, I almost couldn't take it. A shield only looks steady because someone is scared behind it.": "だから今夜、最初に盾に乾杯してくれたとき、受け取れそうになかった。盾が動じて見えるのは、後ろで誰かが怖がってるからなんだ。"
  "But I'll take it. For both of us. Me and the shield.": "でも受け取るよ。あたしと盾、二人分な。"
  "Scared, and stayed. That's what brave is.": "怖くても、踏みとどまった。それが勇気ってもんだよ。"
  "...Ha. Okay. Okay! Somebody pass the cheese before I get soppy.": "……はは。よし。よし！ 湿っぽくなる前に、誰かチーズ回してくれ。"
  "Since we are confessing, I will say one thing, and deny it by morning.": "告白の流れなので、ひとつだけ言います。朝には否定しますが。"
  "Sixth night. The whiteout. Every landmark was buried, and the map was useless. I told you all to turn back.": "六日目の夜。ホワイトアウトでした。目印はすべて埋もれ、地図は役に立たなくなった。私は皆さんに引き返そうと言いました。"
  "I put the map down. I stopped. I was prepared to sit in the snow until someone else decided for me.": "地図を置いて、足を止めました。誰かが代わりに決めてくれるまで、雪の上に座っているつもりでした。"
  "And I held the lantern.": "で、あたしがランタンを持ってた。"
  "You held the lantern and sang off-key. It helped. Do not tell anyone it helped.": "あなたはランタンを持って、音程の外れた歌を歌っていました。助かりました。助かったことは誰にも言わないでください。"
  "Someone put the map back in my hands. They said, 'Read it again. We'll wait.'": "誰かが地図を私の手に戻したのです。『もう一度読んで。待ってるから』と。"
  "Her eyes rest on you for a moment, and that is all she says about it.": "彼女の視線が一瞬あなたの上にとどまる。そのことについて、彼女が言うのはそれだけだ。"
  "Forty minutes later the wind dropped and the old cairn showed through the white. Anyway. This wine is acceptable.": "四十分後、風が止んで、白い景色の向こうに古いケルンが見えました。まあ、それはそれとして。このワインは悪くありません。"
  "She said acceptable! That's a hug, in Wren!": "悪くないって言ったぞ！ レン語だと、それは抱きしめたってことだ！"
  "It is a statement about the vintage.": "それは年代についての所見です。"
  "Thirty winters I've kept this door. People come back from the cold different. Better, mostly.": "この扉を守って三十の冬だ。寒さから戻ってくる人は、どこか変わってるもんさ。たいていは、いいほうにね。"
  "Three of you went up that mountain. Three of you came down. I count that as a good map.": "三人で山に登って、三人で下りてきた。あたしはそれを、いい地図だと数えるよ。"
  "Time slips by the way it does beside a good fire. The stew is gone. The cheese is gone, mostly thanks to Brenna.": "いい火のそばでは、時間はこんなふうに過ぎていく。シチューはもうない。チーズもない。ほとんどブレンナのおかげで。"
  "Snow has piled against the windows. The fire has sunk to a bed of orange coals, and the room is quiet in the way a room is after it has been loud.": "窓には雪が積もっている。火は橙色の熾火に落ち着き、部屋は賑やかだったあとの静けさに包まれている。"
  "Brenna is propped in her chair, yawning without admitting it. Wren has wandered off to study the barrels, glass in hand.": "ブレンナは椅子にもたれて、認めないままあくびをしている。レンはグラスを手に、樽を眺めに行ってしまった。"
  "Past midnight. Door's locked. Nobody has to be anywhere.": "真夜中を過ぎたよ。鍵もかけた。どこへ行く必要もない。"
  "The last hour's the best one. Spend it however you like.": "最後の一時間がいちばんいいのさ。好きなように過ごしな。"
  "One more round with Brenna at the bar": "カウンターでブレンナともう一杯"
  "Share the barrels with Wren": "樽のそばでレンと過ごす"
  "Help Hedda close up": "ヘッダの店じまいを手伝う"
  "Wren drifts off to the barrels with her glass. Hedda vanishes into the back with a lantern, humming something. You and Brenna are left at the bar.": "レンはグラスを持って樽のほうへ行ってしまう。ヘッダは鼻歌まじりに、ランタンを提げて奥へ消えた。カウンターには、あなたとブレンナが残る。"
  "One more round. Just one. For the road. The road is two hundred yards of snow, but it's still a road.": "もう一杯だけ。一杯だけだ。道中の分な。道中っていっても雪道を二百歩ほどだけど、道は道だ。"
  "Hey. Hey, you. Thanks for the ice. On the fourth day, I mean. I didn't say it then, so I'm saying it now.": "なあ。なあ、あんた。氷のときはありがとな。四日目のことだ。あのとき言えなかったから、今言う。"
  "You never made a fuss when my hands shook. You just stood where I could see you. Do you know how much that is?": "手が震えてても、あんたは騒がなかった。あたしから見える場所に立っててくれただけだ。それがどれだけ大きいか、分かるか？"
  "She fills two mugs too full and slaps hers down on the bar. Foam runs down the sides, and she does not even look.": "彼女は二つのジョッキになみなみと注ぎ、自分のをカウンターにどんと置く。泡が縁を伝ってこぼれるが、見向きもしない。"
  "Here's to the next job. I'll be terrified of that one too, and I'll go anyway. Shh, don't tell the shield.": "次の仕事に乾杯だ。それもきっと怖いけど、行くさ。しーっ、盾には内緒だぞ。"
  "Brenna sits at the bar in her armor, eyes shut, mouth wide open in a laugh, both fists raised high in a cheer.": "ブレンナは鎧のままカウンターに座り、目を閉じて大口を開けて笑い、両の拳を高く突き上げている。"
  "Her mug stands forgotten beside her, ale foaming over the rim and splashing across the wood. The fire glows behind her, and a plate of cheese cubes waits on the counter.": "ジョッキは忘れられたまま脇に立ち、エールが縁から泡立ってこぼれ、木の上に飛び散っている。背後では火が赤く灯り、カウンターには角切りのチーズの皿が待っている。"
  "To the Kettle! To the cheese! To eleven days, and every last one of them behind us!": "やかん亭に！ チーズに！ 十一日間に、そのぜんぶがもう後ろだってことに！"
  "You raise your own mug. Ale spills. Neither of you cares.": "あなたも自分のジョッキを掲げる。エールがこぼれる。二人とも気にしない。"
  "Brenna wanders off to rattle the bar stools and beg Hedda for the last of the cheese. The barrels by the wall are suddenly very quiet.": "ブレンナはスツールをがたがた鳴らしながら、ヘッダに残りのチーズをねだりに行く。壁際の樽のあたりが、急に静かになる。"
  "Barrels. The only sensible seats in the room. They are taller than the chairs, so you can see everything.": "樽です。この部屋で唯一まともな席です。椅子より高いので、全体がよく見えます。"
  "Sit. I saved you the good one. It does not wobble. I tested it.": "どうぞ。いいのを取っておきました。ぐらつきません。確かめましたので。"
  "You sit. It does not wobble. Wren pours a second glass of red with great care and pushes it across to you.": "あなたが座る。確かにぐらつかない。レンは二杯目の赤ワインを丁寧に注いで、あなたのほうへ押しやる。"
  "Do not tell the others I enjoyed myself. I will say it was a field assessment.": "楽しんだことは、他の方には言わないでください。現地調査だったと言います。"
  "Findings. The company is competent. The cheese is exceptional. The room is warm. I rank it above most mountains.": "所見です。一行は有能。チーズは特級。部屋は暖かい。たいていの山より上位に位置づけます。"
  "She sits among the barrels, holding her glass of red up in one hand. On the barrel top beside her waits a plate with a wedge of yellow cheese full of holes.": "彼女は樽に囲まれて座り、赤ワインのグラスを片手に掲げている。隣の樽の上には、穴の開いた黄色いチーズの塊を載せた皿が待っている。"
  "She smiles softly, and for once the smile stays where it is, plain and unhidden.": "彼女はやわらかく微笑む。今度ばかりは、その笑みを隠さずにそのままにしている。"
  "I used to think a map was how you knew where you were. Tonight I do not need one for this part. Noted.": "地図は、自分の居場所を知るためのものだと思っていました。今夜のこの部分には、必要ありません。覚えておきます。"
  "Thank you. For the sixth night. For waiting. Please do not make a speech.": "ありがとうございます。六日目の夜のことです。待ってくれたことも。お願いですから、演説はしないでください。"
  "You don't. You lift your glass. She lifts hers and gives a small nod, as if signing a document.": "あなたはしない。ただグラスを掲げる。彼女も自分のグラスを上げ、書類に署名するように小さくうなずく。"
  "Brenna has fallen asleep sitting up, armor and all. Wren steers her toward the stairs, one patient hand on her pauldron, and gives you a small nod over her shoulder.": "ブレンナは鎧を着たまま、座ったまま眠ってしまった。レンが肩当てに手を添えて根気よく階段のほうへ連れて行き、肩越しにあなたへ小さくうなずく。"
  "You stayed. Most of them go straight up to bed. Fine. Take a cloth.": "残ったね。たいていはまっすぐ寝に行くもんだ。いいさ。布巾を取りな。"
  "Chairs go up on the tables. Mugs go in the basin. Wipe the rings off the wood.": "椅子はテーブルの上へ。ジョッキはたらいに。木についた輪染みを拭いとくれ。"
  "You stack mugs and wipe rings while Hedda moves along the room, lowering the lamps one at a time.": "あなたはジョッキを重ね、輪染みを拭く。ヘッダは部屋を歩きながら、ランプをひとつずつ落としていく。"
  "Thirty winters, and I still count the mugs at the end. Habit. Nobody's ever stolen one.": "三十の冬になるけど、閉めるときにはまだジョッキを数えるんだ。癖でね。一個も盗られたことはないよ。"
  "They think I run a tavern. I run a door. Somebody has to hold it open.": "みんなはあたしが酒場をやってると思ってる。やってるのは扉さ。誰かが開けておかなきゃね。"
  "When the last mug is dry, Hedda pours a little pale ale into one clean glass and sets it on the counter among a few bottles. The lamp turns them all to gold.": "最後のジョッキが乾くと、ヘッダは磨いたグラスに淡いエールを少し注ぎ、数本の瓶のあいだのカウンターに置く。ランプの光が、それらをすべて金色に染める。"
  "Look at that. Glass, bottle, light. Ordinary things.": "ごらん。グラスに、瓶に、明かり。ありふれたものさ。"
  "That's what I keep from a night like this. Not the coin. This.": "こういう夜に、あたしの手元に残るのはこれだ。金じゃない。これだよ。"
  "Last cider's on the house. Don't tell the others. I'll deny it.": "最後のシードルはおごりだ。みんなには内緒だよ。聞かれたら否定する。"
  "The fire is down to one orange eye. Hedda unbolts the door, and the cold slips in, clean and quiet.": "火は橙色の小さな目ひとつになった。ヘッダが扉のかんぬきを外すと、冷たい空気が澄んで静かに滑り込む。"
  "You drank to me first tonight. Nobody does that. Mind the ice on the step.": "今夜は最初にあたしに乾杯してくれたね。そんな人はいないんだよ。段の氷に気をつけな。"
  "Go on, now. Sleep. The door will be open again after the thaw. You know that.": "さあ、行きな。ゆっくり寝るんだよ。雪解けのあとも、この扉は開いてる。分かってるだろう。"
  "You step out under a sky scrubbed clean of clouds. Snow squeaks under your boots, and the warmth goes with you.": "雲がきれいに拭い去られた空の下へ出る。ブーツの下で雪が鳴り、温もりがいっしょについてくる。"
  "Behind you, one lamp at a time, the copper window goes dark. The night is cold, and you are not.": "背後で、銅色の窓の明かりがひとつ、またひとつと消えていく。夜は冷たいが、あなたは寒くない。"
