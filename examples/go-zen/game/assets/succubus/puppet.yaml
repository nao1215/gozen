base: base.png
head: {center: [240, 48], radius: 35, neck: [240, 86]}
hair:
  - {rect: [200, 14, 80, 155]}
soft_sway:
  - {ellipse: [192, 80, 90, 56], root: top, follow: body, axis: y, stiffness: 38, damping: 5, amount: 0.8, limit: 3, idle: {amplitude: 1.2, period: 1.6}}
motion:
  hit: soft_only
  # Only the soft region moves: an omitted block would use the default motion, so the
  # body's breath, sway and tilt are turned off by name.
  breath: {depth: 0}
  sway: {angle: 0, shift: 0}
  tilt: {angle: 0}
