schema_version: 12
id: meadow-courier
title: Meadow courier
language: en
screen: {width: 540, height: 900}
start: {location: lodge, event: opening}
state:
  strict: true
  names:
    var.score: {type: number, initial: 0}
    var.best_score: {type: number, initial: 0}
    var.lives: {type: number, initial: 0}
    var.stock: {type: number, initial: 0}
    var.stage: {type: number, initial: 0}
    flag.completed: {type: bool, initial: false}
    flag.failed: {type: bool, initial: false}
    flag.cancelled: {type: bool, initial: false}
runners:
  trail:
    title: Meadow courier
    width: 9
    view_rows: 16
    player_row: 13
    start_x: 4.5
    radius: 0.15
    speed: 3
    steer_speed: 7
    steer_start: 3.5
    ramp_ticks: 12
    boost_rate: 0.5
    boost_max: 1.3
    lives: 2
    max_lives: 4
    life_every: 4
    stock: 1
    max_stock: 3
    retry_rows: 4
    clear_ticks: 20
    finish_rows: 16
    finish_speed: 4
    finish_steer_speed: 8
    ahead: '.........'
    player_image: player.png
    player_color: '#6bddaa'
    background: background.png
    pickup_sound: item
    action_sound: magic
    fail_sound: hit
    finish_sound: win
    visuals:
      board_background: true
      board_color: '#18334266'
      canvas_color: '#142b34'
      player_size: [1, 1]
      player_offset: [0, 0]
      board: [20, 80, 360, 640]
      portrait: [390, 100, 130, 160]
      idle: [portrait.png]
      ready_ticks: 30
      cutin: token.png
      cutin_ticks: 20
      reactions:
        pickup: {event: pickup, images: [portrait.png], ticks: 30, priority: 1, every: 2}
        crash: {images: [block.png], ticks: 60, priority: 3, every: 0}
        stage_clear: {images: [token.png], ticks: 40, priority: 2, every: 0}
    tiles:
      '.': {kind: empty, value: 0, color: '#183342'}
      '#': {kind: wall, value: 0, image: block.png, color: '#537080'}
      '+': {kind: pickup, value: 10, image: token.png, color: '#ffcb5c'}
      'L': {kind: life, value: 20, image: player.png, color: '#6bddaa'}
      'A': {kind: stock, value: 5, image: token.png, color: '#77bfee'}
    stages:
      - id: first_route
        speed: 3
        steer_speed: 7
        background: background.png
        clear: true
        rows:
          - '.........'
          - '....+....'
          - '..#...#..'
          - '....+....'
          - '.#.....#.'
          - '...+.....'
          - '.....+...'
          - '..#...#..'
          - '....L....'
          - '.........'
          - '..+...+..'
          - '....A....'
      - id: second_route
        speed: 4
        steer_speed: 8
        background: background.png
        clear: true
        rows:
          - '....A....'
          - '..+...+..'
          - '.........'
          - '....L....'
          - '..#...#..'
          - '.....+...'
          - '...+.....'
          - '.#.....#.'
          - '....+....'
          - '..#...#..'
          - '....+....'
          - '.........'
