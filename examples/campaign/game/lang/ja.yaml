text:
  "Five Banners": "五つの旗"
  "Take the land in ten turns": "十ターンで大地を手に入れろ"
  "Corin": "コリン"
  "Hilde": "ヒルデ"
  "Sable": "セーブル"
  "Vessa": "ヴェッサ"
  "Raven envoy": "大鴉の使者"
  "General": "将軍"
  "Attack": "攻撃"
  "Guard": "防御"
  "The Five Banners": "五つの旗"
  "Ten turns to take a land of walled cities, farm plains, elf woods, dwarf mines and black moors. Our banner flies over Ashvale alone.": "十ターンで、城壁の街、麦の平野、エルフの森、ドワーフの鉱山、黒い荒野を手に入れる。私たちの旗が立つのはアッシュヴェイルだけだ。"
  "Five regions and three banners. Ours is the smallest.": "五つの地方に三つの旗。うちが一番小さいな。"
  "Then we stop being small. Pick the marches with care, Corin.": "なら、小さいのは今日までだ。進軍路は慎重に選べ、コリン。"
  "Always. Hilde, you hold the line. I will draw the map.": "いつもそうしてる。ヒルデは戦線を頼む。地図は僕が描く。"
  "Draw it kindly. My feet have to walk it.": "優しく描いてくれ。歩くのは私の足なんだ。"
  "A rider reins in at the gate, a woman with a battered hat and a long line of spears behind her.": "門の前で馬が止まる。使い込んだ帽子の女と、その後ろに槍の長い列。"
  "Sable, captain of the Gray Company. Three hundred spears and nowhere to stand.": "灰色隊の隊長、セーブルだ。槍が三百本、立つ場所はなし。"
  "Will the Crown have us? We are cheaper than a siege, I promise.": "王冠は雇ってくれるかい？ 包囲戦よりは安上がりだよ。"
  "Take her in": "迎え入れる"
  "Send her away": "断る"
  "Wise. Now point us at someone.": "賢明だね。さあ、誰を殴ればいい？"
  "Keep your spears pointed outward, mercenary.": "槍は外に向けておけよ、傭兵。"
  "Then take this for the road, and good luck.": "なら、これを路銀にしな。幸運を祈るよ。"
  "Word of the Crossway reaches the treetop houses, and an elf of the forest climbs down to meet us.": "十字路の知らせが樹上の家々に届き、森のエルフが一人、降りてきて私たちを迎える。"
  "You hold the crossing now. My forest answers to whoever keeps the roads open.": "十字路はあなたたちのものね。この森は、道を開けておく人に従うわ。"
  "Your supply lines are a mess, by the way. I know every path under these trees. I will fix them.": "ところで、あなたたちの補給線はひどいものよ。この木々の下の道なら全部知ってる。私が直すわ。"
  "Welcome, Vessa. We needed someone to say that out loud.": "ようこそ、ヴェッサ。それをはっきり言ってくれる人が必要だった。"
  "A knight in black armor rides in from the moors under a white flag and bows exactly as deep as protocol requires.": "黒い鎧の騎士が荒野から白旗を掲げて現れ、作法どおりぴったりの深さで一礼する。"
  "I bring word from Deepwell. The Raven offers two winters of peace.": "ディープウェルより言伝を。大鴉は二度の冬の和平を申し出ております。"
  "Will the Crown take it?": "王冠はお受けになりますか。"
  "Accept the truce": "休戦を受ける"
  "Refuse": "断る"
  "Then we will meet in the field.": "ならば、戦場でお会いしましょう。"
  "Five banners, one colour. It is over.": "五つの旗が、ひとつの色になった。終わりだ。"
  "And my feet are finally done walking.": "これで私の足もやっと休める。"
  "The Crown's flag rises over every region, and for once the land is quiet.": "王冠の旗がすべての地方にはためき、大地はひさしぶりに静まった。"
  "Ashvale has fallen. The Crown is no more.": "アッシュヴェイルは陥ちた。王冠は滅んだ。"
  "We ran out of time, not courage. Remember that.": "足りなかったのは時間で、勇気じゃない。それは覚えておいてくれ。"
  "End turn": "ターン終了"
  "Crown": "王冠"
  "Raven": "大鴉"
  "Stag": "牡鹿"
  "Ashvale": "アッシュヴェイル"
  "Brookford": "ブルックフォード"
  "Crossway": "十字路"
  "Highhill": "ハイヒル"
  "Deepwell": "ディープウェル"
  "Develop": "開発する"
  "Draft 150 for 50 gold": "50 ゴールドで 150 人を徴兵する"
  "Raven Knight": "大鴉の騎士"
  "Pale Guard": "青白き衛兵"
  "Stag Brute": "牡鹿の巨獣"
  "Hill Wolf": "丘の狼"
  "Bandit": "山賊"
  "Ford Rat": "浅瀬の大鼠"
  "Volley": "一斉射撃"
  "Rally": "立て直し"
  "Charge": "突撃"
  "Dark Lance": "黒き槍"
  "The region is ours. Hold it well, and don't let it go to your heads.": "この地方は手に入れた。しっかり守ろう。浮かれるのは、その後でいい。"
  "We fell back. Next time I go in front of you, Corin, no argument.": "退くぞ。次は私が前に出る。コリン、文句は聞かん。"
  "Time ran out and they still hold it. Fine, they'll see us again soon.": "時間切れか。敵はまだ踏みとどまっている。まあいい、すぐまた会うことになる。"
