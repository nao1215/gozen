base: base.png
head: {center: [410, 123], radius: 57, neck: [402, 197]}
soft_sway:
  - {ellipse: [352, 270, 214, 132], root: top, follow: body, axis: y, stiffness: 38, damping: 5, amount: 0.8, limit: 3, idle: {amplitude: 1.2, period: 1.6}}
