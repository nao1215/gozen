actors:
  martin: {name: Martin Shaw, faces: martin}
  elena: {name: Elena Ruiz, faces: elena}
  daniel: {name: Daniel Cho, faces: daniel}
  iris: {name: Iris Vale, faces: iris}
  nora: {name: Nora Quinn, faces: nora}
  mia: {name: Mia Hart, faces: mia}
locations:
  office: {name: Office, background: bg/office.jpg}
events:
  sprint_review:
    - say: {who: martin, text: 'Sprint review. Show what is done, not what is nearly done.'}
  opening:
    - say: {who: martin, text: Morning. Ten days to the client demo.}
    - open: standup
  notify:
    - message: {who: elena, text: 'The client wants one more field on the booking form. Can we talk now?', event: decision, tag: DM}
    - open: tickets
  decision:
    - choice:
      - label: Call now
        do: [{call: {event: review, ensemble: team_call}}]
      - label: After lunch
        do: [{set: {var.later: 1}}]
  review:
    - say: {who: elena, text: 'It is a phone number field. Small, but it touches the API.', ensemble: team_call}
    - call_view: {share: {who: elena, picture: share/form.png}}
    - say: {who: elena, text: This is the form. The new field goes at the bottom., ensemble: team_call}
    - call_view: {share: {who: elena, picture: ''}}
    - say: {who: daniel, text: I can add it after the payments work. Not before., ensemble: team_call}
    - say: {who: nora, text: Then I test both on the same day., ensemble: team_call}
    - set: {var.reviewed: 1}
  # A muted choice on the call (choice muted): the answers wait behind Unmute,
  # or a click on the struck mic; left muted for eight seconds, Martin keeps
  # quiet and the muted commands run.
  review_floor:
    - say: {who: daniel, text: 'Payments first, the form after. Any objections?', ensemble: team_call}
    - choice:
      - label: Friday is too tight for both.
        do: [{set: {var.floor: 1}}]
      - label: Agreed. Payments first.
        do: [{set: {var.floor: 2}}]
      muted:
        seconds: 8
        do: [{set: {var.floor: 3}}]
    - if: var.floor == 3
      then: [{say: {who: daniel, text: 'Nobody? Payments first, then.', ensemble: team_call}}]
      else: [{say: {who: daniel, text: Noted. I will update the plan., ensemble: team_call}}]
  # A call that rings out (ring): left alone for eight seconds it stops and the
  # phone goes down with missed, which runs the call's missed sets.
  phone_missed:
    - say: {who: martin, text: The phone buzzes on the desk in the middle of the review.}
    - phone:
        app: lock
        var: var.client_call
        notices:
        - {app: Phone, icon: apps/oncall.png, title: Harbor Bank, text: Incoming call, call: true, ring: 8, set: {var.callback: 0}, missed: {var.callback: 1}}
    - if: 'var.client_call == "missed"'
      then: [{say: {who: martin, text: Missed it. I will call them back after the review.}}]
      else: [{say: {who: martin, text: 'Martin Shaw, Harbor app team.'}}]
  # The phone command: every app one after another (the captures start each
  # with --event). Each waits until the phone is put down, but a banner.
  phone_tour:
    - call: {event: phone_chat}
    - call: {event: phone_feed}
    - call: {event: phone_video}
    - call: {event: phone_puppet}
    - call: {event: phone_shop}
    - call: {event: phone_bank}
    - call: {event: phone_lock}
    - call: {event: phone_call}
    - call: {event: phone_sso}
    - call: {event: phone_timeline}
    - call: {event: phone_banner}
    - call: {event: phone_support}
    - call: {event: phone_contact}
  # The phone command (ADR 0057): a chat held upright, a photo feed and a video
  # turned on its side. Each waits until the phone is put down.
  phone_chat:
    - say: {who: martin, text: My phone buzzes. The team chat.}
    - phone:
        app: chat
        title: Harbor app team
        messages:
        - {day: Today}
        - {from: Elena Ruiz, icon: icons/elena.png, text: The client liked the demo build., time: '9:12'}
        - {from: Elena Ruiz, icon: icons/elena.png, text: They want the booking form live by Friday., time: '9:12'}
        - {mine: true, text: Friday is tight. What about payments?, time: '9:15', read: true}
        - {from: Daniel Cho, icon: icons/daniel.png, text: Payments first. The form can wait one day., time: '9:20'}
        - {from: Nora Quinn, icon: icons/nora.png, picture: share/form.png, time: '9:31'}
        - {from: Mia Hart, icon: icons/mia.png, text: The client says thanks. Here is the call where we showed them the form., time: '10:02'}
        - {from: Mia Hart, icon: icons/mia.png, time: '10:02', video: {frames: [clips/call/*.jpg], fps: 6, text: 'Booking demo, client side'}}
    - say: {who: martin, text: One day. I can sell one day.}
  phone_feed:
    - say: {who: martin, text: Lunch. Mia is posting again.}
    - phone:
        app: feed
        title: Photos
        posts:
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo1.jpg, likes: 128, text: 'Monday fit. Ready for the client call.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo2.jpg, likes: 342, text: 'Friday means denim.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo3.jpg, likes: 96, text: 'Coffee run before the demo.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo4.jpg, likes: 210, text: 'New boots, same deadlines.'}
        - {who: mia.hart, icon: icons/mia.png, video: {frames: [clips/cutin/*.jpg], fps: 12}, likes: 902, text: 'Game night with the team. Ox finally landed Shield Rush.'}
        - {who: mia.hart, icon: icons/mia.png, video: {picture: bg/pantry.jpg, puppet: clip3/puppet.yaml, zoom: 1.6, seconds: 8, bounce: [1, 3.5, 6]}, likes: 904, text: 'Pantry dance break. Do not tell Martin.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo5.jpg, likes: 505, text: 'Rooftop break between meetings.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo6.jpg, likes: 77, text: 'Booth duty at the expo.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo7.jpg, likes: 188, text: 'Sweater weather in the office.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo8.jpg, likes: 640, text: 'Dressed up for the launch dinner.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo9.jpg, likes: 233, text: 'Weekend, no laptop. Almost.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo10.jpg, likes: 412, text: 'Last day of the sprint. We shipped.'}
    - say: {who: martin, text: She posts more than she emails.}
  phone_video:
    - say: {who: martin, text: Mia sent a clip from game night.}
    - phone:
        app: video
        hold: landscape
        video: {frames: [clips/battle/*.jpg], fps: 12, text: 'Game night: the Brass Warden fight'}
    - say: {who: martin, text: Three seconds of a boss fight. Back to the booking form.}
  # The same phone with a puppet clip, pages, the lock screen and a banner.
  phone_puppet:
    - say: {who: martin, text: 'Friday evening. Mia, in the team chat again.'}
    - phone:
        app: chat
        title: Mia Hart
        messages:
        - {day: Friday}
        - {from: Mia Hart, icon: icons/mia.png, text: 'Practicing the launch party dance in the pantry. Do not laugh.', time: '18:40'}
        - {from: Mia Hart, icon: icons/mia.png, time: '18:41', video: {picture: bg/pantry.jpg, puppet: clip3/puppet.yaml, zoom: 1.6, text: 'Launch party dance practice', seconds: 6, bounce: [1.5, 3, 4.5]}}
        - {mine: true, text: 'Looks ready for the launch. I did not see a thing.', time: '18:45', read: true}
    - say: {who: martin, text: The launch party will be fine.}
  phone_shop:
    - say: {who: martin, text: Mia wants a second opinion on the team shirts.}
    - phone:
        app: page
        url: harbor-outfitters.example/team
        rows:
        - {text: Harbor Outfitters, size: large, bold: true}
        - {text: 'Team wear, autumn line. Free delivery over $100.', size: small}
        - {pictures: [phone/photo1.jpg, phone/photo2.jpg, phone/photo3.jpg, phone/photo4.jpg, phone/photo6.jpg, phone/photo7.jpg]}
        - {item: {icon: apps/shop.png, title: Team hoodie, text: 'Navy · S to XL', value: '$58'}}
        - {item: {icon: apps/shop.png, title: Denim jacket, text: 'Washed blue · M, L', value: '$89'}}
        - {button: Add six hoodies to the cart}
    - say: {who: martin, text: Six hoodies. The budget line says merchandise. Close enough.}
  phone_bank:
    - say: {who: martin, text: The contractor invoice is due today.}
    - phone:
        app: page
        title: Harbor Bank
        color: '#1f5fbf'
        var: var.transfer
        rows:
        - {text: Business account balance, size: small}
        - {text: '12,480,000', size: large, bold: true}
        - {text: Transfer to confirm, bold: true}
        - {item: {icon: apps/bank.png, title: Blue Tide Ltd., text: 'Invoice 0420 · today', value: '-3,000,000'}}
        - {text: Recent, bold: true}
        - {item: {icon: apps/bank.png, title: Harbor Travel, text: 'Client deposit · yesterday', value: '+8,000,000'}}
        - {item: {icon: apps/bank.png, title: Office rent, text: 'Standing order · Mar 1', value: '-1,200,000'}}
        - {text: 'The transfer leaves at 15:00 and cannot be undone after that.', size: small}
        - {button: Confirm transfer, id: confirm}
        - {button: Not now, id: later}
    - if: 'var.transfer == "confirm"'
      then: [{say: {who: martin, text: Paid. Blue Tide gets their money on time.}}]
      else: [{say: {who: martin, text: Later. Elena will ask about it at three.}}]
  phone_lock:
    - say: {who: martin, text: Morning. The lock screen is already busy.}
    - phone:
        app: lock
        time: '7:12'
        date: Tuesday, March 14
        notices:
        - {app: Harbor Bank, icon: apps/bank.png, title: Deposit received, text: '+8,000,000 from Harbor Travel'}
        - {app: Team chat, icon: icons/elena.png, title: Elena Ruiz, text: Can we move the standup to ten? The client call ran over.}
        - {app: Calendar, icon: apps/calendar.png, title: Client demo in one hour, text: 'Meeting room B · 9:30'}
    - say: {who: martin, text: 'Standup at ten, then.'}
  phone_call:
    - say: {who: martin, text: '2:14 at night. The phone lights up on the desk.'}
    - phone:
        app: lock
        time: '2:14'
        date: Wednesday, March 15
        var: var.oncall
        notices:
        - {app: Monitor, icon: apps/monitor.png, title: API error rate 6%, text: 'booking-api is over the 5% threshold for five minutes.'}
        - {app: Monitor, icon: apps/monitor.png, title: API error rate 9%, text: 'booking-api: still rising.'}
        - {app: On-call, icon: apps/oncall.png, title: On-call · API error rate, text: Incoming call, call: true}
        - {app: On-call, icon: apps/oncall.png, title: On-call · API error rate, text: 'Incoming call, second try', call: true, set: {var.woke_twice: 1}}
    - if: 'var.oncall == "answer"'
      then: [{say: {who: martin, text: I am up. Opening the dashboard.}}]
      else: [{say: {who: martin, text: Daniel is on call too. He will take it.}}]
  phone_sso:
    - say: {who: martin, text: 'A sign-in request. Who works on production at this hour?'}
    - phone:
        app: page
        title: Sign-in check
        color: '#2c3e50'
        var: var.sso
        rows:
        - {item: {icon: apps/signin.png, title: Harbor ID, text: Production console}}
        - {text: Approve sign-in to the production console?, size: large, bold: true}
        - {text: 'Daniel Cho · laptop · Lisbon · 23:48', size: small}
        - {text: Approve only a sign-in you started or expected., size: small}
        - {button: Approve, id: approve}
        - {button: Deny, id: deny}
    - if: 'var.sso == "approve"'
      then: [{say: {who: martin, text: Approved. Daniel said he would fix the payment job tonight.}}]
      else: [{say: {who: martin, text: Denied. I message Daniel to ask first.}}]
  phone_timeline:
    - say: {who: martin, text: The booking app is down. People notice before we do.}
    - phone:
        app: feed
        title: Timeline
        posts:
        - {who: sam.travels, icon: avatars/sam.png, time: 2h, text: 'Trying to book a table for tonight and the app just spins. Anyone else?', likes: 48, replies: 12, reposts: 5}
        - {who: harbor.booking, icon: apps/timeline.png, time: 1h, text: 'We know some bookings fail right now. We are on it and will post here when it is fixed.', likes: 210, replies: 64, reposts: 88}
        - {who: lena_k, icon: avatars/lena.png, time: 58m, text: 'Third time this month. I am calling the restaurant like it is 1999.', likes: 131, replies: 9, reposts: 20, set: {flag.liked_complaint: true}}
        - {who: dev.ops.dan, icon: avatars/dan.png, time: 45m, text: 'Whoever is on call at the booking team tonight: you have my sympathy.', likes: 302, replies: 15, reposts: 41}
        - {who: priya.eats, icon: avatars/priya.png, time: 40m, text: 'The booking app ate my reservation and my patience. Calling instead.', likes: 64, replies: 7, reposts: 3}
        - {who: harbor.booking, icon: apps/timeline.png, time: 20m, text: 'Update: payments are back. Table bookings are still slow, and we are fixing that next.', likes: 156, replies: 31, reposts: 40}
        - {who: tom_the_cook, icon: avatars/tom.png, time: 12m, text: 'Our kitchen got four walk-ins who said the app was down. Free advertising, I suppose.', likes: 89, replies: 6, reposts: 11}
        - {who: night.shift.nurse, icon: avatars/nurse.png, time: 5m, text: 'Booked a table for tomorrow at 2 a.m. because that is when I have time. Worked first try.', likes: 41, replies: 2}
        - {who: m.ortega, icon: avatars/maria.png, time: 1m, text: 'Booked fine five minutes ago. Back up?', likes: 17, replies: 3}
    # A like is kept: a tap on the complaint (and no second tap) sets the flag.
    - if: flag.liked_complaint
      then: [{say: {who: martin, text: 'I just liked a complaint about our own app. From my own account.'}}]
    - say: {who: martin, text: Back up. Now the review of what broke.}
  phone_banner:
    - say: {who: martin, text: 'Back to the plan: payments first, then the form.'}
    - phone: {app: banner, notices: [{app: Team chat, icon: icons/nora.png, title: Nora Quinn, text: 'Acceptance tests are green. Ship it?', event: banner_reply}]}
    - say: {who: martin, text: A notification slides in while I talk. The scene goes on.}
    - say: {who: martin, text: 'I can read it later, or tap it now.'}
  banner_reply:
    - say: {who: martin, text: Nora's tests are green. Good news for once.}
  phone_support:
    - say: {who: martin, text: Iris draws at night. Her supporter page is new.}
    - phone: &iris_page
        app: page
        url: sketchboard.example/iris
        rows:
        - {picture: bg/meeting.jpg}
        - {item: {icon: icons/iris.png, title: Iris Vale, text: 'Illustration, office life, small comics', value: 320 supporters}}
        - {text: 'Monthly sketches of a small app team. Supporters see the full pages.', size: small}
        - {item: {icon: apps/studio.png, title: Coffee tier, text: 'A sketch a month, early posts', value: '$3 / mo'}}
        - {item: {icon: apps/studio.png, title: Studio tier, text: 'Full comic pages and process files', value: '$8 / mo'}}
        - {button: Support Iris, set: {flag.iris_supported: true}}
        - {text: Posts, bold: true}
        - {pictures: [phone/photo1.jpg, phone/photo5.jpg, phone/photo9.jpg]}
        - {pictures: [phone/photo2.jpg, phone/photo8.jpg, phone/photo10.jpg], locked: '!flag.iris_supported', label: Supporters only}
    - say: {who: martin, text: Coffee tier. The full pages open.}
    - phone: *iris_page
    - say: {who: martin, text: She drew the standup. Daniel is asleep in it.}
  phone_contact:
    - say: {who: martin, text: 'At the launch party Mia holds out her phone. "Company chat is for work. Scan this."'}
    - phone:
        app: page
        title: Add contact
        color: '#3d8bf2'
        var: var.contact
        rows:
        - {item: {icon: icons/mia.png, title: Mia Hart, text: 'Account manager · client side'}}
        - {qr: 'https://github.com/nao1215/gozen', caption: Scan to add Mia}
        - {text: 'Or add her here. Your number goes to her as well.', size: small}
        - {button: Add Mia, id: add, set: {flag.mia_contact: true}}
    - if: flag.mia_contact
      then:
      - say: {who: martin, text: 'Added. A message comes in before I put the phone away.'}
      - phone:
          app: chat
          title: Mia Hart
          messages:
          - {day: Today}
          - {from: Mia Hart, icon: icons/mia.png, text: 'This is Mia. Now you have my number, not only my work account.', time: '21:04'}
          - {mine: true, text: 'Saved. Thanks for tonight.', time: '21:05', read: true}
      else:
      - say: {who: martin, text: Maybe later.}
profiles:
  martin: {name: Martin Shaw, picture: martin/normal.png, affiliation: Harbor app team, text: Engineering manager. Keeps the plan honest., fields: [{label: Role, value: Manager}, {label: Since, value: '2024'}]}
  elena: {name: Elena Ruiz, picture: elena/normal.png, affiliation: Harbor app team, text: Owns the backlog and the client requests., fields: [{label: Role, value: Product owner}]}
  daniel: {name: Daniel Cho, picture: daniel/normal.png, affiliation: Harbor app team, text: Builds the booking API., fields: [{label: Role, value: Backend engineer}]}
  iris: {name: Iris Vale, picture: iris/normal.png, affiliation: Harbor app team, text: Draws the screens and checks them on phones., fields: [{label: Role, value: Designer}]}
  nora: {name: Nora Quinn, picture: nora/normal.png, affiliation: Harbor app team, text: Writes and runs the acceptance tests., fields: [{label: Role, value: QA engineer}]}
  mia: {name: Mia Hart, picture: mia/normal.png, affiliation: Client side, text: Account manager. Talks to the client., fields: [{label: Role, value: Account manager}]}
