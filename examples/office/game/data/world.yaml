actors:
  martin: {name: Martin Shaw, faces: martin}
  elena: {name: Elena Ruiz, faces: elena}
  daniel: {name: Daniel Cho, faces: daniel}
  iris: {name: Iris Vale, faces: iris}
  nora: {name: Nora Quinn, faces: nora}
  mia: {name: Mia Hart, faces: mia}
locations:
  office: {name: Office, background: bg/office.jpg}
events:
  sprint_review:
    - say: {who: martin, text: 'Sprint review. Show what is done, not what is nearly done.'}
  opening:
    - say: {who: martin, text: Morning. Ten days to the client demo.}
    - open: standup
  notify:
    - message: {who: elena, text: 'The client wants one more field on the booking form. Can we talk now?', event: decision, tag: DM}
    - open: tickets
  decision:
    - choice:
      - label: Call now
        do: [{call: {event: review, ensemble: team_call}}]
      - label: After lunch
        do: [{set: {var.later: 1}}]
  review:
    - say: {who: elena, text: 'It is a phone number field. Small, but it touches the API.', ensemble: team_call}
    - call_view: {share: {who: elena, picture: share/form.png}}
    - say: {who: elena, text: This is the form. The new field goes at the bottom., ensemble: team_call}
    - call_view: {share: {who: elena, picture: ''}}
    - say: {who: daniel, text: I can add it after the payments work. Not before., ensemble: team_call}
    - say: {who: nora, text: Then I test both on the same day., ensemble: team_call}
    - set: {var.reviewed: 1}
  # The phone command (ADR 0057): a chat held upright, a photo feed and a video
  # turned on its side. Each waits until the phone is put down.
  phone_chat:
    - say: {who: martin, text: My phone buzzes. The team chat.}
    - phone:
        app: chat
        title: Harbor app team
        messages:
        - {from: Elena Ruiz, icon: icons/elena.png, text: The client liked the demo build.}
        - {from: Elena Ruiz, icon: icons/elena.png, text: They want the booking form live by Friday.}
        - {mine: true, text: Friday is tight. What about payments?}
        - {from: Daniel Cho, icon: icons/daniel.png, text: Payments first. The form can wait one day.}
        - {from: Nora Quinn, icon: icons/nora.png, picture: share/form.png}
        - {from: Mia Hart, icon: icons/mia.png, text: The client says thanks. Here is the call where we showed them the form.}
        - {from: Mia Hart, icon: icons/mia.png, video: {frames: [clips/call/*.jpg], fps: 6, text: 'Booking demo, client side'}}
    - say: {who: martin, text: One day. I can sell one day.}
  phone_feed:
    - say: {who: martin, text: Lunch. Mia is posting again.}
    - phone:
        app: feed
        title: Photos
        posts:
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo1.jpg, likes: 128, text: 'Monday fit. Ready for the client call.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo2.jpg, likes: 342, text: 'Friday means denim.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo3.jpg, likes: 96, text: 'Coffee run before the demo.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo4.jpg, likes: 210, text: 'New boots, same deadlines.'}
        - {who: mia.hart, icon: icons/mia.png, video: {frames: [clips/cutin/*.jpg], fps: 12}, likes: 902, text: 'Game night with the team. Ox finally landed Shield Rush.'}
        - {who: mia.hart, icon: icons/mia.png, video: {picture: bg/pantry.jpg, puppet: clip3/puppet.yaml, zoom: 1.6, seconds: 8, bounce: [1, 3.5, 6]}, likes: 904, text: 'Pantry dance break. Do not tell Martin.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo5.jpg, likes: 505, text: 'Rooftop break between meetings.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo6.jpg, likes: 77, text: 'Booth duty at the expo.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo7.jpg, likes: 188, text: 'Sweater weather in the office.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo8.jpg, likes: 640, text: 'Dressed up for the launch dinner.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo9.jpg, likes: 233, text: 'Weekend, no laptop. Almost.'}
        - {who: mia.hart, icon: icons/mia.png, picture: phone/photo10.jpg, likes: 412, text: 'Last day of the sprint. We shipped.'}
    - say: {who: martin, text: She posts more than she emails.}
  phone_video:
    - say: {who: martin, text: Mia sent a clip from game night.}
    - phone:
        app: video
        hold: landscape
        video: {frames: [clips/battle/*.jpg], fps: 12, text: 'Game night: the Brass Warden fight'}
    - say: {who: martin, text: Three seconds of a boss fight. Back to the booking form.}
profiles:
  martin: {name: Martin Shaw, picture: martin/normal.png, affiliation: Harbor app team, text: Engineering manager. Keeps the plan honest., fields: [{label: Role, value: Manager}, {label: Since, value: '2024'}]}
  elena: {name: Elena Ruiz, picture: elena/normal.png, affiliation: Harbor app team, text: Owns the backlog and the client requests., fields: [{label: Role, value: Product owner}]}
  daniel: {name: Daniel Cho, picture: daniel/normal.png, affiliation: Harbor app team, text: Builds the booking API., fields: [{label: Role, value: Backend engineer}]}
  iris: {name: Iris Vale, picture: iris/normal.png, affiliation: Harbor app team, text: Draws the screens and checks them on phones., fields: [{label: Role, value: Designer}]}
  nora: {name: Nora Quinn, picture: nora/normal.png, affiliation: Harbor app team, text: Writes and runs the acceptance tests., fields: [{label: Role, value: QA engineer}]}
  mia: {name: Mia Hart, picture: mia/normal.png, affiliation: Client side, text: Account manager. Talks to the client., fields: [{label: Role, value: Account manager}]}
