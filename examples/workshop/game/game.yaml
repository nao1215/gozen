schema_version: 11
id: workshop-planning
title: The pottery workshop
language: en
screen: {width: 1280, height: 720, native: true}
start: {location: workshop, event: opening}
planning:
  attributes:
    vigor: {type: number, initial: 70, min: 0, max: 100, hidden: true}
    craft: {type: number, initial: 2, min: 0, max: 5}
    place: {type: string, initial: workshop}
  entities:
    potter:
      name: Potter
      tags: [residents]
      observations: {condition: 'self.vigor >= 50 ? "ready" : "tired"'}
    weaver:
      name: Weaver
      tags: [residents]
      attributes: {craft: 1}
      observations: {condition: 'self.vigor >= 50 ? "ready" : "tired"'}
  calendar:
    start: '2030-07-31'
    end: '2030-08-04'
    phases: [morning, evening]
    weekdays_off: [0, 6]
  activities:
    prepare: {name: Prepare clay, effort: 2, assignee: potter, from: '2030-07-31', to: '2030-07-31'}
    shape: {name: Shape bowls, effort: 6, assignee: potter, after: [prepare], from: '2030-08-01', to: '2030-08-02'}
  ledgers: {usage: {retain: 12}}
  schedule:
    - {id: assembly, date: '2030-08-01', phase: morning, event: assembly, label: Assembly, hide_closed: true}
  rules:
    recover:
      params: [amount]
      do:
        - {op: set, tag: residents, attribute: vigor, value: 'min(100, self.vigor + arg.amount)'}
        - {op: observe}
  policies:
    steady:
      - {when: 'entity.potter.condition == "tired"', event: rest}
      - {event: work}
screens:
  workshop:
    title: 'Workshop / current usage: {period_value("usage", "potter", 0)}'
    kind: entities
    entries:
      - {label: Work this phase, do: [{call: work}]}
      - {label: Rest this phase, do: [{call: rest}]}
      - {label: Assign bowls to Weaver, do: [{plan: {op: assign, activity: shape, entity: weaver}}]}
      - {label: Studio overview, do: [{open: studio}]}
      - {label: Timeline, do: [{open: timeline}]}
      - {label: Calendar, do: [{open: calendar}]}
      - {label: Assembly, do: [{open: assembly}]}
      - {label: Save, do: [{open: save}]}
  timeline: {title: Work plan, kind: timeline}
  calendar: {title: Calendar, kind: calendar}
  assembly:
    title: Workshop assembly
    kind: ensemble
    view:
      fullscreen: true
      guests: [visitor]
      call:
        address: call.example.test/workshop
        controls: [Mic, Camera, Share, Hand, Chat, Leave]
      chat:
        title: Workshop messages
        joined: joined
        left: left
        camera_off: Camera off
        camera_on: Camera on

  studio:
    title: Studio
    kind: islands
    view:
      fullscreen: true
      light: true
      header: Pottery and weaving
      footer: Select a resident to work or rest. View the plan without spending a phase.
      burnup: {title: Workshop work, total: Scope, planned_label: Planned, observed: Observed, today: Today, deadline: Delivery}
      fields:
        - {key: craft, label: Craft, maximum: 5}
    entries:
      - {label: Work, target: potter, do: [{call: work}]}
      - {label: Rest, target: weaver, do: [{call: rest}]}
      - {label: Work plan, bounds: [940, 60, 320, 48], do: [{open: timeline}]}
      - {label: Calendar, bounds: [940, 120, 320, 48], do: [{open: calendar}]}

ui:
  material:
    kind: glass
    blur: 5
    opacity: 0.24
    refraction: 16
    wallpaper_strength: 1
    border: 0.55
    shadow: 0.7
    surfaces: {base: glass, card: glass, control: glass}
    wallpaper: ["#b5cbf4", "#49c9ca", "#dc97bc"]
