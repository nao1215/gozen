# Five Banners: a small region-conquest campaign (schema_version 5, ADR 0030). Stage 0 wrote
# it with variables and dispatch events; it now uses the campaign words. See NOTES.md.
schema_version: 5
id: campaign-proto
title: Five Banners
subtitle: A campaign prototype
language: en
screen: {width: 1920, height: 1080}
fonts: {regular: fonts/mplus-1p-regular.ttf}
title_background: maps/town.jpg
start:
  location: war
  party: [corin, hilde]
  gold: 60
  event: opening
max_party: 4
battle: {variance: 0, critical: 0, escape: 1}
campaign:
  location: war
  player: crown
  turns: 10
  actions: "2 + floor(faction.crown.regions / 2)"
  won: victory
  lost: fallen
  on_turn: turn_start
  generals:
    corin: {troops: 500, might: 3}
    hilde: {troops: 600, might: 2}
    sable: {troops: 0, might: 1}
    vessa: {troops: 0, might: 4}
  clash:
    power: "a.troops * (1 + a.might / 10) * (0.8 + rand() * 0.4)"
  orders:
    attack: {label: "Attack ({campaign.actions_left} orders left)", general: ready, target: border, march: true}
    develop:
      label: "Develop ({campaign.actions_left} orders left)"
      target: own
      do: [{set: {target.wealth: "target.wealth + 15"}}]
    draft:
      label: "Draft 150 for 50 gold ({campaign.actions_left} orders left)"
      when: gold >= 50
      general: any
      do: [{gold: -50}, {set: {general.troops: "general.troops + 150"}}]
state:
  strict: true
  names:
    # The last turn of the Raven's truce (0: none).
    var.truce: {type: number, initial: 0}
