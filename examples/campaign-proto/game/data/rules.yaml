# The rules of the campaign, as events. There are no parameters, loops or tables, so the
# shared events read their arguments from vars (var.g, var.t, var.f, var.r ...) and every
# write to "the region var.r" is a dispatch: one if per region (put_region, put_general).
events:
  # The Crown's march: general var.g against region var.t.
  player_clash:
    do:
      - set: {var.ap: "var.ap - 1"}
      - call: get_general
      - set: {var.r: var.t}
      - call: get_region
      - set: {var.atk: "floor(var.cur_gt * (1 + var.cur_mt / 10) * (0.8 + rand() * 0.4))"}
      - set: {var.def: "floor(var.cur_tr * 1.25)"}
      - if: var.atk > var.def
        then:
          - set: {var.left: "floor(var.cur_gt * (1 - 0.5 * var.def / var.atk))"}
          - set: {var.r_own: "'Crown'", var.r_tr: "floor(var.left * 0.4)"}
          - call: put_region
          - set: {var.left: "var.left - var.r_tr"}
          - call: put_general
          - set: {var.news: "var.cur_nm + ' falls to the Crown.'"}
        else:
          - set: {var.left: "floor(var.cur_gt * 0.5)"}
          - set: {var.r_own: var.cur_own, var.r_tr: "max(0, floor(var.cur_tr - var.atk * 0.4))"}
          - call: put_region
          - call: put_general
          - set: {var.news: "var.cur_nm + ' holds.'"}
      - say: "{var.news} ({var.atk} against {var.def})"
      - call: tally

  # Reads the general var.g into var.cur_gt and var.cur_mt. Reading var['gt_' + var.g]
  # would be one line, but strict state names refuse a name built at run time.
  get_general:
    do:
      - if: var.g == 'maren'
        then: [{set: {var.cur_gt: var.gt_maren, var.cur_mt: var.mt_maren}}]
      - if: var.g == 'ox'
        then: [{set: {var.cur_gt: var.gt_ox, var.cur_mt: var.mt_ox}}]
      - if: var.g == 'tilly'
        then: [{set: {var.cur_gt: var.gt_tilly, var.cur_mt: var.mt_tilly}}]
      - if: var.g == 'kes'
        then: [{set: {var.cur_gt: var.gt_kes, var.cur_mt: var.mt_kes}}]

  # Reads the region var.r into var.cur_nm, var.cur_own and var.cur_tr.
  get_region:
    do:
      - if: var.r == 'vale'
        then: [{set: {var.cur_nm: var.nm_vale, var.cur_own: var.own_vale, var.cur_tr: var.tr_vale}}]
      - if: var.r == 'ford'
        then: [{set: {var.cur_nm: var.nm_ford, var.cur_own: var.own_ford, var.cur_tr: var.tr_ford}}]
      - if: var.r == 'cross'
        then: [{set: {var.cur_nm: var.nm_cross, var.cur_own: var.own_cross, var.cur_tr: var.tr_cross}}]
      - if: var.r == 'hill'
        then: [{set: {var.cur_nm: var.nm_hill, var.cur_own: var.own_hill, var.cur_tr: var.tr_hill}}]
      - if: var.r == 'well'
        then: [{set: {var.cur_nm: var.nm_well, var.cur_own: var.own_well, var.cur_tr: var.tr_well}}]

  # Writes var.left and acted to the general var.g.
  put_general:
    do:
      - if: var.g == 'maren'
        then: [{set: {var.gt_maren: var.left, flag.acted_maren: true}}]
      - if: var.g == 'ox'
        then: [{set: {var.gt_ox: var.left, flag.acted_ox: true}}]
      - if: var.g == 'tilly'
        then: [{set: {var.gt_tilly: var.left, flag.acted_tilly: true}}]
      - if: var.g == 'kes'
        then: [{set: {var.gt_kes: var.left, flag.acted_kes: true}}]

  # Writes the owner var.r_own and the garrison var.r_tr to the region var.r.
  put_region:
    do:
      - if: var.r == 'vale'
        then: [{set: {var.own_vale: var.r_own, var.tr_vale: var.r_tr}}]
      - if: var.r == 'ford'
        then: [{set: {var.own_ford: var.r_own, var.tr_ford: var.r_tr}}]
      - if: var.r == 'cross'
        then: [{set: {var.own_cross: var.r_own, var.tr_cross: var.r_tr}}]
      - if: var.r == 'hill'
        then: [{set: {var.own_hill: var.r_own, var.tr_hill: var.r_tr}}]
      - if: var.r == 'well'
        then: [{set: {var.own_well: var.r_own, var.tr_well: var.r_tr}}]

  # Counts the regions of each faction.
  tally:
    do:
      - set:
          var.n_crown: "(var.own_vale == 'Crown' ? 1 : 0) + (var.own_ford == 'Crown' ? 1 : 0) + (var.own_cross == 'Crown' ? 1 : 0) + (var.own_hill == 'Crown' ? 1 : 0) + (var.own_well == 'Crown' ? 1 : 0)"
          var.n_raven: "(var.own_vale == 'Raven' ? 1 : 0) + (var.own_ford == 'Raven' ? 1 : 0) + (var.own_cross == 'Raven' ? 1 : 0) + (var.own_hill == 'Raven' ? 1 : 0) + (var.own_well == 'Raven' ? 1 : 0)"
          var.n_stag: "(var.own_vale == 'Stag' ? 1 : 0) + (var.own_ford == 'Stag' ? 1 : 0) + (var.own_cross == 'Stag' ? 1 : 0) + (var.own_hill == 'Stag' ? 1 : 0) + (var.own_well == 'Stag' ? 1 : 0)"

  # The end of the Crown's turn: the other factions move, the land pays, a new turn begins.
  end_turn:
    do:
      - if: var.truce < var.turn
        then: [{set: {var.f: "'Raven'"}}, {call: ai_turn}]
      - set: {var.f: "'Stag'"}
      - call: ai_turn
      - call: tally
      - set: {gold: "gold + (var.own_vale == 'Crown' ? var.wl_vale : 0) + (var.own_ford == 'Crown' ? var.wl_ford : 0) + (var.own_cross == 'Crown' ? var.wl_cross : 0) + (var.own_hill == 'Crown' ? var.wl_hill : 0) + (var.own_well == 'Crown' ? var.wl_well : 0)"}
      - set: {var.turn: "var.turn + 1"}
      - set: {var.ap: "2 + floor(var.n_crown / 2)"}
      - set: {flag.acted_maren: false, flag.acted_ox: false, flag.acted_tilly: false, flag.acted_kes: false}

  # The AI of faction var.f: draft, then march along the first border (in the order written)
  # from a region of at least var.keep troops where 60% of the garrison beats the defence. There is no "pick the weakest", so the
  # order of these lines is the AI's preference.
  ai_turn:
    do:
      - set: {var.src: "''", var.dst: "''"}
      - if: "var.src == '' && var.own_cross == var.f && var.own_vale != var.f && var.tr_cross >= var.keep && var.tr_cross * 0.6 > var.tr_vale * 1.25"
        then: [{set: {var.src: "'cross'", var.dst: "'vale'"}}]
      - if: "var.src == '' && var.own_ford == var.f && var.own_vale != var.f && var.tr_ford >= var.keep && var.tr_ford * 0.6 > var.tr_vale * 1.25"
        then: [{set: {var.src: "'ford'", var.dst: "'vale'"}}]
      - if: "var.src == '' && var.own_cross == var.f && var.own_ford != var.f && var.tr_cross >= var.keep && var.tr_cross * 0.6 > var.tr_ford * 1.25"
        then: [{set: {var.src: "'cross'", var.dst: "'ford'"}}]
      - if: "var.src == '' && var.own_vale == var.f && var.own_ford != var.f && var.tr_vale >= var.keep && var.tr_vale * 0.6 > var.tr_ford * 1.25"
        then: [{set: {var.src: "'vale'", var.dst: "'ford'"}}]
      - if: "var.src == '' && var.own_hill == var.f && var.own_cross != var.f && var.tr_hill >= var.keep && var.tr_hill * 0.6 > var.tr_cross * 1.25"
        then: [{set: {var.src: "'hill'", var.dst: "'cross'"}}]
      - if: "var.src == '' && var.own_well == var.f && var.own_cross != var.f && var.tr_well >= var.keep && var.tr_well * 0.6 > var.tr_cross * 1.25"
        then: [{set: {var.src: "'well'", var.dst: "'cross'"}}]
      - if: "var.src == '' && var.own_ford == var.f && var.own_cross != var.f && var.tr_ford >= var.keep && var.tr_ford * 0.6 > var.tr_cross * 1.25"
        then: [{set: {var.src: "'ford'", var.dst: "'cross'"}}]
      - if: "var.src == '' && var.own_vale == var.f && var.own_cross != var.f && var.tr_vale >= var.keep && var.tr_vale * 0.6 > var.tr_cross * 1.25"
        then: [{set: {var.src: "'vale'", var.dst: "'cross'"}}]
      - if: "var.src == '' && var.own_cross == var.f && var.own_hill != var.f && var.tr_cross >= var.keep && var.tr_cross * 0.6 > var.tr_hill * 1.25"
        then: [{set: {var.src: "'cross'", var.dst: "'hill'"}}]
      - if: "var.src == '' && var.own_well == var.f && var.own_hill != var.f && var.tr_well >= var.keep && var.tr_well * 0.6 > var.tr_hill * 1.25"
        then: [{set: {var.src: "'well'", var.dst: "'hill'"}}]
      - if: "var.src == '' && var.own_cross == var.f && var.own_well != var.f && var.tr_cross >= var.keep && var.tr_cross * 0.6 > var.tr_well * 1.25"
        then: [{set: {var.src: "'cross'", var.dst: "'well'"}}]
      - if: "var.src == '' && var.own_hill == var.f && var.own_well != var.f && var.tr_hill >= var.keep && var.tr_hill * 0.6 > var.tr_well * 1.25"
        then: [{set: {var.src: "'hill'", var.dst: "'well'"}}]
      - call: ai_draft
      - if: var.src != ''
        then: [{call: ai_clash}]

  # Faction var.f marches from var.src to var.dst with 60% of the garrison.
  ai_clash:
    do:
      - set: {var.r: var.src}
      - call: get_region
      - set: {var.sent: "floor(var.cur_tr * 0.6)"}
      - set: {var.r_own: var.f, var.r_tr: "var.cur_tr - var.sent"}
      - call: put_region
      - set: {var.atk: "floor(var.sent * (0.8 + rand() * 0.4))"}
      - set: {var.r: var.dst}
      - call: get_region
      - set: {var.def: "floor(var.cur_tr * 1.25)"}
      - if: var.atk > var.def
        then:
          - set: {var.r_own: var.f, var.r_tr: "max(50, floor(var.sent * (1 - 0.5 * var.def / var.atk)))"}
          - set: {var.news: "var.cur_nm + ' falls to the ' + var.f + '.'"}
        else:
          - set: {var.r_own: var.cur_own, var.r_tr: "max(0, floor(var.cur_tr - var.atk * 0.4))"}
          - set: {var.news: "var.cur_nm + ' holds against the ' + var.f + '.'"}
      - call: put_region
      - say: "{var.news}"

  # Faction var.f drafts 120 into every region it holds.
  ai_draft:
    do:
      - if: var.own_vale == var.f
        then: [{set: {var.tr_vale: "var.tr_vale + 170"}}]
      - if: var.own_ford == var.f
        then: [{set: {var.tr_ford: "var.tr_ford + 170"}}]
      - if: var.own_cross == var.f
        then: [{set: {var.tr_cross: "var.tr_cross + 170"}}]
      - if: var.own_hill == var.f
        then: [{set: {var.tr_hill: "var.tr_hill + 170"}}]
      - if: var.own_well == var.f
        then: [{set: {var.tr_well: "var.tr_well + 170"}}]

  # The end: there is no command to lose without a battle, so both ends use clear.
  victory:
    trigger: auto
    once: true
    when: var.n_crown == 5
    do:
      - say: {who: maren, text: "Five banners, one colour. It is over."}
      - set: {flag.won: true}
      - clear: true
  fallen:
    trigger: auto
    once: true
    when: var.own_vale != 'Crown' && !flag.won
    do:
      - say: Ashvale has fallen. The Crown is no more.
      - set: {flag.lost: true}
      - clear: true
  out_of_time:
    trigger: auto
    once: true
    when: var.turn > 10 && !flag.won && !flag.lost
    do:
      - say: The tenth winter comes. The land stays divided.
      - set: {flag.lost: true}
      - clear: true
