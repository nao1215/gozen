# The talk around the turns. Placeholder English, to be rewritten.
events:
  opening:
    do:
      - say: {who: corin, text: Five regions and three banners. Ours flies over Ashvale only.}
      - say: {who: hilde, text: Ten winters to take them all. Pick the marches with care.}

  # The land pays its wealth at the start of each turn.
  turn_start:
    do:
      - gold: faction.crown.sum_wealth

  sable_arrives:
    trigger: auto
    once: true
    when: campaign.turn == 3
    do:
      - say: {who: sable, text: I have three hundred spears and nowhere to stand. Will the Crown have us?}
      - choice:
          - label: Take her in
            do:
              - join: sable
              - set: {generals.sable.troops: 300}
              - say: {who: sable, text: Then point us at someone.}
          - label: Send her away
            do:
              - gold: 60
              - say: {who: sable, text: "Then take this for the road, and good luck."}
        id: sable

  vessa_arrives:
    trigger: auto
    once: true
    when: region.cross.owner == 'crown'
    do:
      - say: {who: vessa, text: You took the crossing. I fight for whoever holds it.}
      - join: vessa
      - set: {generals.vessa.troops: 300}

  envoy:
    trigger: auto
    once: true
    when: campaign.turn == 6 && region.well.owner == 'raven'
    do:
      - say: {who: Raven envoy, face: envoy/normal.png, text: The Raven offers two winters of peace. Will you take it?}
      - choice:
          - label: Accept the truce
            do: [{set: {var.truce: "campaign.turn + 1"}}]
          - label: Refuse
            do: [{say: {who: Raven envoy, face: envoy/normal.png, text: "Then we will meet in the field."}}]
        id: truce

  victory:
    do:
      - say: {who: corin, text: "Five banners, one colour. It is over."}
  fallen:
    do:
      - say: Ashvale has fallen. The Crown is no more.
