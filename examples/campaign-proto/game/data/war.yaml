# The land: five regions on Go Zen's town map, three factions. The map's points are the
# regions (their plates show the owner and the garrison); two more points are only plates,
# for the turn and the generals, as the map screen draws no meters yet.
factions:
  crown: {name: Crown, color: "#3060c0", capital: vale}
  raven:
    name: Raven
    color: "#303040"
    capital: well
    ai:
      - {draft: "190"}
      - {march: true, when: "var.truce < campaign.turn", keep: 1000, where: "s.troops * 0.6 > t.troops * 1.25", pick: min, by: t.troops}
  stag:
    name: Stag
    color: "#806020"
    capital: hill
    ai:
      - {draft: "190"}
      - {march: true, keep: 1000, where: "s.troops * 0.6 > t.troops * 1.25", pick: min, by: t.troops}
regions:
  vale: {name: Ashvale, next: [cross, ford], owner: crown, troops: 600, values: {wealth: 40}}
  ford: {name: Brookford, next: [cross, vale], troops: 350, values: {wealth: 30}}
  cross: {name: Crossway, next: [ford, hill, well, vale], troops: 600, values: {wealth: 40}}
  hill: {name: Highhill, next: [cross, well], owner: stag, troops: 1300, values: {wealth: 30}}
  well: {name: Deepwell, next: [cross, hill], owner: raven, troops: 1500, values: {wealth: 30}}
locations:
  war:
    name: The Five Banners
    map:
      picture: maps/town.jpg
      unknown: named
      draw_roads: true
      label_size: 0.026
      points:
        vale: {at: [830, 720], start: true, label: "{region.vale.name}  {region.vale.owner} {region.vale.troops}"}
        ford: {at: [745, 555], label: "{region.ford.name}  {region.ford.owner} {region.ford.troops}"}
        cross: {at: [640, 370], label: "{region.cross.name}  {region.cross.owner} {region.cross.troops}"}
        hill: {at: [820, 180], label: "{region.hill.name}  {region.hill.owner} {region.hill.troops}"}
        well: {at: [1640, 410], label: "{region.well.name}  {region.well.owner} {region.well.troops}"}
        hq: {at: [1480, 860], label: "Turn {campaign.turn}/{campaign.turns}  Orders {campaign.actions_left}  Gold {gold}"}
        camp: {at: [1480, 960], label: "Corin {generals.corin.troops}  Hilde {generals.hilde.troops}{generals.sable.joined ? '  Sable ' + str(generals.sable.troops) : ''}{generals.vessa.joined ? '  Vessa ' + str(generals.vessa.troops) : ''}"}
      roads:
        - {between: [cross, ford], via: [[700, 430]]}
        - {between: [cross, hill], via: [[760, 320]]}
        - {between: [cross, well], via: [[900, 250], [1040, 245], [1200, 285], [1500, 390]]}
        - {between: [cross, vale], via: [[620, 560], [760, 650]]}
        - {between: [ford, vale]}
        - {between: [hill, well], via: [[1200, 190]]}
        # The plates must be on a road (check), so they get roads that never open.
        - {between: [well, hq], when: "false"}
        - {between: [hq, camp], when: "false"}
