# The land: five regions on Go Zen's town map, three factions. The map's points are named
# like the regions, so the screen draws each in its owner's colour with its garrison, and
# OK on one lists the orders it can be given.
factions:
  crown: {name: Crown, color: "#3060c0", capital: vale}
  raven:
    name: Raven
    color: "#303040"
    capital: well
    ai:
      - {draft: "180"}
      - {march: true, when: "var.truce < campaign.turn", keep: 1000, where: "s.troops * 0.6 > t.troops * 1.25", pick: min, by: t.troops}
  stag:
    name: Stag
    color: "#806020"
    capital: hill
    ai:
      - {draft: "180"}
      - {march: true, keep: 1000, where: "s.troops * 0.6 > t.troops * 1.25", pick: min, by: t.troops}
regions:
  vale: {name: Ashvale, next: [cross, ford], owner: crown, troops: 600, terrain: castle, defend: vale_guard, values: {wealth: 40}, area: [[1401, 1000], [380, 1000], [380, 847], [1164, 444], [1188, 443]]}
  ford: {name: Brookford, next: [cross, vale], troops: 350, terrain: field, defend: ford_guard, values: {wealth: 30}, area: [[1164, 444], [380, 847], [380, 640], [840, 379]]}
  cross: {name: Crossway, next: [ford, hill, well, vale], troops: 600, terrain: town, defend: cross_guard, values: {wealth: 40}, area: [[380, 60], [503, 60], [840, 379], [380, 640]]}
  hill: {name: Highhill, next: [cross, well], owner: stag, troops: 1300, terrain: castle, defend: hill_guard, values: {wealth: 30}, area: [[503, 60], [1296, 60], [1188, 443], [1164, 444], [840, 379]]}
  well: {name: Deepwell, next: [cross, hill], owner: raven, troops: 1500, terrain: castle, defend: well_guard, values: {wealth: 30}, area: [[1296, 60], [1880, 60], [1880, 1000], [1401, 1000], [1188, 443]]}
locations:
  war:
    name: The Five Banners
    map:
      picture: maps/town.jpg
      unknown: named
      draw_roads: true
      label_size: 0.026
      points:
        vale: {at: [830, 720], start: true}
        ford: {at: [745, 555]}
        cross: {at: [640, 370]}
        hill: {at: [820, 180]}
        well: {at: [1640, 410]}
      roads:
        - {between: [cross, ford], via: [[700, 430]]}
        - {between: [cross, hill], via: [[760, 320]]}
        - {between: [cross, well], via: [[900, 250], [1040, 245], [1200, 285], [1500, 390]]}
        - {between: [cross, vale], via: [[620, 560], [760, 650]]}
        - {between: [ford, vale]}
        - {between: [hill, well], via: [[1200, 190]]}
