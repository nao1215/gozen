classes:
  walker:
    name: Walker
    # Level 1 matches the original sample (30 HP, Tap 8); each level adds 8 HP and 2 attack.
    stats: {mhp: "22 + level * 8", mmp: 5, atk: "6 + level * 2", def: 3, mat: 2, mdf: 2, agi: 8, luk: 1}
    exp_for: level * 30
actors: {walker: {name: Walker, class: walker, faces: walker}}
skills:
  attack: {name: Tap, effects: [{damage: a.atk, variance: 0}]}
  guard: {name: Wait, scope: self}
  nudge: {name: Nudge, effects: [{damage: 1, variance: 0}]}
  roll: {name: Roll, effects: [{damage: 6, variance: 0.6}]}
enemies:
  pebble:
    name: Pebble
    image: pebble.png
    stats: {mhp: 16, mmp: 0, atk: 1, def: 0, mat: 0, mdf: 0, agi: 1, luk: 1}
    gold: 3
    ai: [{use: nudge}]
  cobble:
    name: Cobble
    image: pebble.png
    stats: {mhp: 44, mmp: 0, atk: 1, def: 0, mat: 0, mdf: 0, agi: 1, luk: 1}
    gold: 5
    ai: [{use: roll}]
troops:
  lesson: {members: [pebble]}
  cobble: {members: [cobble]}
  rockfall: {members: [cobble, pebble, cobble]}
locations:
  camp:
    name: Trail camp
    background: camp.jpg
    battle_background: grotto.jpg
    safe: true
    people:
      - name: Courier
        image: courier.png
        talk:
          - say: {who: Courier, face: courier.png, text: A little light can guide a long journey.}
          - say: {who: Courier, face: courier.png, text: "Practice with Pebble, then light the marker. The ridge path will open."}
          - set: {flag.briefed: true}
    actions:
      - label: Practice
        do:
          - battle: lesson
            on_win:
              - set: {flag.trained: true}
              - say: Well done! You are ready to light the marker.
      - label: Light the marker
        when: flag.trained && !flag.marker_lit
        do: [{call: greeting}]
      - {label: Save journey, do: [{save: true}]}
      - {label: Rest, do: [{heal: all}, {say: Ready for another walk.}]}
    exits:
      - {to: ridge, label: Walk to the ridge, when: flag.marker_lit}
      - {to: chamber, label: Explore chamber}
      - {to: town, label: Visit the village}
      - {to: grotto, label: Enter the grotto}
  ridge:
    name: Lantern ridge
    background: ridge.jpg
    safe: true
    actions:
      - {label: Save journey, do: [{save: true}]}
    exits: [{to: camp, label: Return to camp}]
  town:
    name: Lamplight village
    background: town.jpg
    safe: true
    people:
      - name: Innkeeper
        image: innkeeper.png
        talk:
          - say: {who: Innkeeper, face: innkeeper.png, text: Welcome to Lamplight. The beds are warm and the soup is hot.}
          - say: {who: Innkeeper, face: innkeeper.png, text: Rest here whenever the trail wears you down.}
    actions:
      - {label: Rest at the inn, do: [{heal: all}, {say: You feel ready to walk again.}]}
      - {label: Save journey, do: [{save: true}]}
    exits: [{to: camp, label: Return to camp}]
  grotto:
    name: Echo grotto
    background: grotto.jpg
    safe: true
    actions:
      - label: Challenge a wild Pebble
        do:
          - battle: lesson
            on_win: [{say: The Pebble rolls away happily.}]
      - label: Face the Cobble
        do:
          - battle: cobble
            on_win: [{say: The Cobble settles down.}]
      - label: Brave the rockfall
        do:
          - battle: rockfall
            on_win: [{say: The grotto is quiet again.}]
    exits: [{to: camp, label: Return to camp}]
  chamber:
    name: Observation room
    safe: true
    dungeon:
      wall: {file: wall.jpg, tint: "#a9bcc6"}
      floor: "#304c54"
      ceiling: "#172a37"
      map: |
        #######
        #S...L#
        #.###.#
        #C....#
        #######
      tiles:
        S: {start: true, facing: east}
        L:
          name: Window lantern
          once: true
          mark: "#edbe70"
          symbol: L
          do:
            - say: From this window, the little trail looks like a ribbon.
            - set: {flag.window_seen: true}
        C:
          name: Camp door
          mark: "#97daca"
          symbol: C
          do: [{move: camp}]
events:
  greeting:
    do:
      - say: The marker glows. A path to Lantern ridge is now open.
      - set: {flag.marker_lit: true}
  arrival:
    trigger: enter
    location: ridge
    once: true
    do:
      - say: The ridge lantern answers your light. The trail is connected again!
      - gold: 4
      - set: {flag.complete: true}
      - say: Journey complete. Save here, or return to explore the observation room.
