schema_version: 2
id: wayfinder-demo
title: Wayfinder
subtitle: A little light on the trail
language: en
screen: {width: 960, height: 540}
title_background: title.jpg
title_figures:
  - {file: walker/normal.png, x: 0.72, height: 0.78}
  - {file: courier.png, x: 0.9, height: 0.7}
start: {location: camp, party: [walker]}
battle: {variance: 0, critical: 0, escape: 1}
terms: {currency: G, level: Lv., hp: HP, mp: MP, exp: EXP}
ui:
  window: "#142c36e8"
  border: "#7ba8aa"
  text: "#f2eddb"
  accent: "#edbe70"
  cursor: "#97daca"
# The engine's words are English (language: en above). Only Wayfinder's own wording is kept here:
# its battles are practice bouts on the trail.
text:
  はじめから: New journey
  "どの きろくから はじめますか？": "Choose a journey to continue"
  "たたかいに かった！": "Practice complete!"
  "{first}が あらわれた！": "{first} is ready to practice!"
  "{first}たちが あらわれた！": "{first}s roll up, ready to practice!"
  "{target}を たおした！": "{target} finishes practice."
  # The battle log leaves out the tactic notes.
  "［%s・%s → %s・%s］": "%.0[1]s"
  "［%sの作戦%d・%s → %s・%s］": "%.0[1]s"
