# Architecture policy: docs/decisions/0008-architecture-and-api.md
# The levels (base, model, rules, drive, screen, app) and their order are defined once in
# internal/dev/hygiene/levels.go (ADR 0064); TestLevelOrder rejects a dependency on a higher level.
version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true
  # x/ (experiments) is created only when an experiment has a user (ADR 0021).
  ignoreNotFoundComponents: true
exclude:
  - .cache
  - build
  - bin
  - dist
  # the graphics tests' window host, a test harness like the _test.go files
  - internal/play/testdata
excludeFiles:
  # Runtime dependency policy; external test harnesses may compose layers.
  - '^.*_test\.go$'
vendors:
  markdown: { in: [github.com/nao1215/markdown] }
  onnx: { in: [github.com/yalue/onnxruntime_go, "github.com/yalue/onnxruntime_go/**"] }
  yaml: { in: [github.com/goccy/go-yaml, "github.com/goccy/go-yaml/**"] }
  # x/image, and WebP: deepteams/webp decodes it with the colours libwebp gives (x/image/webp
  # reads its limited-range YUV as full range) and encodes the pictures of a web export.
  image: { in: [golang.org/x/image, "golang.org/x/image/**", github.com/deepteams/webp, "github.com/deepteams/webp/**"] }
  ebiten: { in: [github.com/hajimehoshi/ebiten/v2, "github.com/hajimehoshi/ebiten/v2/**"] }
  width: { in: [golang.org/x/text/width] }
  norm: { in: [golang.org/x/text/unicode/norm] }
  pflag: { in: [github.com/spf13/pflag] }
  # QR codes on a phone's page (internal/play/phone_page.go) and their check.
  qr: { in: [rsc.io/qr, "rsc.io/qr/**"] }
  # The browser's localStorage for the saves of a web build (internal/play/store_js.go),
  # its pictures decoded by the browser (internal/layer5/picdecode), its frame meter
  # (internal/play/platform_js.go), the page that the browser build of Go Zen
  # reports its loading to, and the game's files fetched whole by the browser
  # (internal/webfs).
  js: { in: [syscall/js] }
components:
  expr: { in: ["internal/expr", "internal/expr/**"] }
  text: { in: ["internal/text", "internal/text/**"] }
  savefile: { in: ["internal/savefile", "internal/savefile/**"] }
  chat: { in: "internal/chat/**" }
  rpg: { in: ["internal/rpg", "internal/rpg/**"] }
  battle: { in: ["internal/battle", "internal/battle/**"] }
  event: { in: ["internal/event", "internal/event/**"] }
  world: { in: ["internal/world", "internal/world/**"] }
  react: { in: "internal/react/**" }
  headless: { in: ["internal/headless", "internal/headless/**"] }
  play: { in: "internal/play/**" }
  session: { in: "internal/session/**" }
  base: { in: "internal/layer1/**" }
  model: { in: "internal/layer2/**" }
  rules: { in: "internal/layer3/**" }
  drive: { in: "internal/layer4/**" }
  screen: { in: "internal/layer5/**" }
  # One CLI (ADR 0016): gozen owns prompt and mosaic through their internal command packages.
  commands: { in: ["cmd/gozen/**", "cmd/internal/checkdata/**", "cmd/internal/cli/**", "cmd/internal/distribute/**", "cmd/internal/gamecatalog/**", "cmd/internal/starter/**", "cmd/internal/themes/**", "cmd/internal/trial/**"] }
  repro: { in: "cmd/internal/repro/**" }
  dango: { in: "cmd/internal/dango/**" }
  player: { in: "cmd/gozen-player/**" }
  cliio: { in: "internal/cliio/**" }
  # GNU-style options and help pages shared by gozen and its production commands (ADR 0018).
  clihelp: { in: "internal/clihelp/**" }
  # Diagnostic codes (ADR 0024): a leaf like clihelp, used by the commands, the loader and the tools.
  diag: { in: ["internal/diag", "internal/diag/**"] }
  promptgen: { in: "internal/promptgen" }
  promptcmd: { in: "internal/promptgen/command/**" }
  mosaic: { in: ["internal/mosaic", "internal/mosaic/detect/**", "internal/mosaic/segment/**", "internal/mosaic/settings/**", "internal/mosaic/tagger/**"] }
  mosaiccmd: { in: "internal/mosaic/command/**" }
  experiments: { in: "x/**" }
  examples: { in: "examples/**" }
  # The file system the browser builds of the samples read their game from (fetched files).
  webfs: { in: "internal/webfs/**" }
  dev: { in: "internal/dev/**" }
  testgame: { in: "internal/testgame/**" }
deps:
  webfs:
    canUse: [js]
  base:
    canUse: [yaml]
  expr:
    mayDependOn: [expr, base]
  text:
    mayDependOn: [text, base]
  savefile:
    mayDependOn: [savefile, base]
  chat:
    mayDependOn: [chat, base]
    canUse: [yaml, norm]
  rpg:
    mayDependOn: [rpg, expr, text, savefile, base, model, react]
  model:
    canUse: [yaml, qr]
    mayDependOn: [model, expr, text, savefile, base, diag, react]
  battle:
    mayDependOn: [battle, expr, text, savefile, chat, rpg, base, model, rules]
  event:
    mayDependOn: [event, expr, text, savefile, chat, react, rpg, base, model, rules]
  world:
    mayDependOn: [world, expr, text, savefile, chat, rpg, base, model, rules]
  react:
    mayDependOn: [react, expr, base]
    canUse: [yaml, width]
  rules:
    mayDependOn: [rules, expr, text, savefile, chat, rpg, base, model]
  headless:
    mayDependOn: [headless, expr, text, savefile, chat, rpg, battle, event, world, react, base, model, rules, drive, diag]
  drive:
    mayDependOn: [drive, expr, text, savefile, chat, rpg, battle, event, world, react, base, model, rules]
  session:
    mayDependOn: [session, expr, text, savefile, chat, rpg, battle, event, world, react, headless, base, model, rules, drive]
    canUse: [yaml]
  play:
    mayDependOn: [play, clihelp, expr, text, savefile, chat, rpg, battle, event, world, react, headless, base, model, rules, drive, screen]
    canUse: [ebiten, image, pflag, js, qr]
  screen:
    mayDependOn: [screen, expr, text, savefile, chat, rpg, battle, event, world, react, headless, base, model, rules, drive]
    canUse: [ebiten, image, js]
  commands:
    mayDependOn: [repro, commands, expr, text, savefile, chat, rpg, battle, event, world, react, headless, play, base, model, rules, drive, screen, promptcmd, mosaiccmd, mosaic, clihelp, cliio, diag]
    canUse: [yaml, ebiten, image, pflag, markdown]
  repro:
    mayDependOn: [diag, base]
  dango:
    mayDependOn: [repro, dev, clihelp, cliio, diag]
  player:
    mayDependOn: [play, model, webfs]
    canUse: [ebiten, js]
  cliio:
    mayDependOn: [cliio, diag]
  clihelp:
    mayDependOn: [clihelp, diag]
    canUse: [pflag]
  diag:
    mayDependOn: [diag]
  promptgen:
    mayDependOn: [promptgen, expr, text, savefile, chat, rpg, battle, event, world, react, headless, diag]
    canUse: [yaml, image]
  promptcmd:
    mayDependOn: [promptcmd, promptgen, clihelp, cliio, diag]
    canUse: [pflag]
  mosaic:
    mayDependOn: [mosaic, expr, text, savefile, chat, rpg, battle, event, world, react, headless, diag]
    canUse: [yaml, image, onnx]
  mosaiccmd:
    mayDependOn: [mosaiccmd, mosaic, clihelp, cliio, diag]
    canUse: [pflag, image, markdown]
  experiments:
    mayDependOn: [expr, text, savefile, chat, rpg, battle, event, world, react, headless, play]
    canUse: [yaml, ebiten, image]
  examples:
    mayDependOn: [session, expr, text, savefile, chat, rpg, battle, event, world, react, headless, play, screen, webfs]
    canUse: [ebiten, image, js]
  dev:
    mayDependOn: [dev, diag]
    canUse: [markdown]
  testgame:
    mayDependOn: [expr, text, savefile, chat, rpg, model]
