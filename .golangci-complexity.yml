# Complexity checks for new and changed code only (make complexity runs this
# with --new-from-merge-base). The engine has older functions above these limits;
# they are not reported until they are touched, and then they should shrink.
version: "2"
run:
  go: "1.26"
  timeout: 10m
  build-tags:
    - graphics
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - gocognit
    - funlen
  settings:
    gocognit:
      min-complexity: 40
    funlen:
      lines: 150
      statements: 90
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocognit, funlen]
